name: Inspecionar main ALIYVO

on:
  push:
    paths:
      - "inspect.json"

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar release atual
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/base /tmp/build
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "*.zip" --dir /tmp/base
          BASE_ZIP=$(find /tmp/base -maxdepth 1 -type f -name '*.zip' | head -n1)
          unzip -q "$BASE_ZIP" -d /tmp/build
      - name: Mostrar trechos importantes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/build/_app/main.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          pats=['Ações rápidas','Assistente','Busca por imagem','Disparo de mensagens','current','conversation','runJavaScript','evaluate_js','CODPROD','COMPLDESC','REFFORN','search_products','buscar_prod','produto','QShortcut']
          seen=set()
          for pat in pats:
              print('\n### PADRAO',pat)
              for i,l in enumerate(lines):
                  if pat.lower() in l.lower():
                      a=max(0,i-8); b=min(len(lines),i+14)
                      key=(a,b)
                      if key in seen: continue
                      seen.add(key)
                      print(f'--- linhas {a+1}-{b} ---')
                      for j in range(a,b): print(f'{j+1:05d}: {lines[j]}')
          PY
