name: Inspecionar main ALIYVO

on:
  push:
    paths:
      - "inspect.json"
permissions:
  contents: write
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar release atual
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/base /tmp/build
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "*.zip" --dir /tmp/base
          BASE_ZIP=$(find /tmp/base -maxdepth 1 -type f -name '*.zip' | head -n1)
          unzip -q "$BASE_ZIP" -d /tmp/build
      - name: Gerar trechos exatos
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/build/_app/main.py'); lines=p.read_text(encoding='utf-8').splitlines()
          ranges=[('MAIN_BINDINGS',4890,5115),('QUICK_END',5590,5685),('ASSISTANT_INIT',3370,3565),('WA_COMPAT',2040,2095),('WA_EXISTING',2525,2615)]
          out=[]
          for title,a,b in ranges:
              out.append(f'===== {title} SOURCE {a}-{b} =====')
              out += [f'{n:05d}: {lines[n-1]}' for n in range(a,b+1) if n<=len(lines)]
              out.append('')
          Path('inspect-output.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Salvar relatório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inspect-output.txt
          git commit -m "Atualizar inspeção do main" || exit 0
          git push
