name: Publicar ALIYVO 0.23.51

on:
  push:
    paths:
      - '.github/workflows/publicar-aliyvo-02351.yml'
      - 'source/v0.23.51/**'
      - 'tests/test_update_channels_v2351.py'
      - 'channels/**'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Baixar versão base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force base,build,out | Out-Null
          gh release download v0.23.50 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_02350.zip" --dir base
          if ($LASTEXITCODE -ne 0) { throw "Base 0.23.50 não baixada" }
          Expand-Archive base/ALIYVO_02350.zip build -Force

      - name: Separar canal de atualização de Vendas
        shell: pwsh
        run: |
          python -c "from pathlib import Path; paths=[Path('source/v0.23.51/main.py.patch'),Path('build/_app/main.py')]; [p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n')) for p in paths]"
          git apply --check --directory=build source/v0.23.51/main.py.patch
          if ($LASTEXITCODE -ne 0) { throw "Patch de canal incompatível" }
          git apply --directory=build source/v0.23.51/main.py.patch
          if ($LASTEXITCODE -ne 0) { throw "Patch de canal falhou" }

      - name: Validar separação Vendas e Compras
        shell: pwsh
        run: |
          $env:ALIYVO_TEST_APP_DIR=(Resolve-Path 'build/_app').Path
          python -m unittest tests/test_update_channels_v2351.py -v
          if ($LASTEXITCODE -ne 0) { throw "Testes dos canais falharam" }
          python -m compileall -q build/_app
          if ($LASTEXITCODE -ne 0) { throw "Compilação do aplicativo falhou" }

      - name: Empacotar atualização
        shell: pwsh
        run: |
          python -c "import pathlib,zipfile; root=pathlib.Path('build'); z=zipfile.ZipFile('out/ALIYVO_02351.zip','w',zipfile.ZIP_DEFLATED); [z.write(p,p.relative_to(root)) for p in root.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.name!='soma_catalog.sqlite']; z.close()"
          python -c "import zipfile; z=zipfile.ZipFile('out/ALIYVO_02351.zip'); assert z.testzip() is None; s=z.read('_app/main.py').decode('utf-8'); assert '0.23.51' in s; assert 'channels/vendas.json' in s; assert 'releases/latest' not in s"
          if ($LASTEXITCODE -ne 0) { throw "Pacote final inválido" }
          $sha=(Get-FileHash out/ALIYVO_02351.zip -Algorithm SHA256).Hash.ToLower()
          "ALIYVO Vendas 0.23.51. Canal exclusivo de Vendas, separado do Compras. SHA256: $sha" | Set-Content out/VALIDACAO_02351.txt

      - name: Publicar versão 0.23.51
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.23.51 --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.23.51 out/ALIYVO_02351.zip out/VALIDACAO_02351.txt --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            gh release create v0.23.51 out/ALIYVO_02351.zip out/VALIDACAO_02351.txt --repo "$env:GITHUB_REPOSITORY" --title "ALIYVO Vendas 0.23.51 - Atualizações separadas" --notes "Corrige o canal de atualização: o ALIYVO Vendas agora recebe somente versões de Vendas e nunca oferece o ALIYVO Compras."
          }
          if ($LASTEXITCODE -ne 0) { throw "Publicação falhou" }
          gh release edit v0.23.51 --repo "$env:GITHUB_REPOSITORY" --latest
          if ($LASTEXITCODE -ne 0) { throw "Não foi possível marcar como versão mais recente" }

