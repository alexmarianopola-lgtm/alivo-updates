name: DEV Inspecionar ALIYVO 0.22.91 para modulo Ponto
on:
  push:
    branches: ['feature/ponto-aliyvo-02292']
    paths: ['dev-trigger-ponto-v92.txt']
permissions:
  contents: read
jobs:
  inspecionar:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar base oficial 0.22.91
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\v91 | Out-Null
          gh release download v0.22.91 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02291.zip" --dir C:\temp
          Expand-Archive C:\temp\ALIYVO_BETA_GRATIS_02291.zip -DestinationPath C:\temp\v91 -Force
          if(-not (Test-Path C:\temp\v91\_app\main.py)){ throw 'main.py ausente' }
      - name: Mostrar arquitetura relevante
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          @'
          from pathlib import Path
          import re,sys
          try: sys.stdout.reconfigure(encoding="utf-8",errors="replace")
          except Exception: pass
          p=Path(r"C:\temp\v91\_app\main.py")
          s=p.read_text(encoding="utf-8")
          lines=s.splitlines()
          print("TOTAL_LINES",len(lines))
          print("VERSION",re.findall(r'ALIYVO_VERSION\s*=\s*["\']([^"\']+)',s)[:3])
          def block(title, start1, end1):
              print("\n===== "+title+" =====")
              for n in range(max(1,start1),min(len(lines),end1)+1):
                  print(f"{n:05d}: {lines[n-1]}")
          block("IMPORTS",1,220)\n          block("MAINWINDOW_UI_6150_6420",6150,6420)
          block("MAINWINDOW_UI_6421_6620",6421,6620)
          for term in ["self.setCentralWidget","nav_lay.addWidget","nav_lay.addStretch","self.brand_bar","QStackedWidget","QTabWidget","def closeEvent","def resizeEvent","def eventFilter","def _toggle_maximize_window"]:
              print("\n### MATCH",term)
              hits=[i+1 for i,l in enumerate(lines) if term.lower() in l.lower()]
              for n in hits[:20]:
                  print(f"{n:05d}: {lines[n-1]}")
          block("BOTTOM",max(1,len(lines)-220),len(lines))
          '@ | Set-Content C:\temp\inspect.py -Encoding UTF8
          python C:\temp\inspect.py
