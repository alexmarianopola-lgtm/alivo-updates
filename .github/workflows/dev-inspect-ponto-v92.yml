name: DEV Inspecionar ALIYVO 0.22.91 para modulo Ponto
on:
  push:
    branches: ['feature/ponto-aliyvo-02292']
    paths: ['dev-trigger-ponto-v92.txt']
permissions:
  contents: read
jobs:
  inspecionar:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar base oficial 0.22.91
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\v91 | Out-Null
          gh release download v0.22.91 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02291.zip" --dir C:\temp
          Expand-Archive C:\temp\ALIYVO_BETA_GRATIS_02291.zip -DestinationPath C:\temp\v91 -Force
          if(-not (Test-Path C:\temp\v91\_app\main.py)){ throw 'main.py ausente' }
      - name: Mostrar arquitetura relevante
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re
          p=Path(r"C:\temp\v91\_app\main.py")
          s=p.read_text(encoding="utf-8")
          lines=s.splitlines()
          print("TOTAL_LINES",len(lines))
          print("VERSION",re.findall(r'ALIYVO_VERSION\s*=\s*["\']([^"\']+)',s)[:3])
          def block(title, start, end):
              print("\n===== "+title+" =====")
              for i in range(max(0,start),min(len(lines),end)):
                  print(f"{i+1:05d}: {lines[i]}")
          for i,l in enumerate(lines):
              if re.match(r'class\s+MainWindow\b',l):
                  block("MAINWINDOW_CLASS",i,i+240)
                  break
          for term in ["def __init__(self", "header", "statusBar", "QToolBar", "QHBoxLayout", "QStackedWidget", "QTabWidget", "Lembrete", "Diagnóstico", "Prazos"]:
              print("\n### MATCH",term)
              hits=[i for i,l in enumerate(lines) if term.lower() in l.lower()]
              for i in hits[:12]:
                  print(f"{i+1:05d}: {lines[i]}")
          block("BOTTOM",max(0,len(lines)-260),len(lines))
          '@ | Set-Content C:\temp\inspect.py -Encoding UTF8
          python C:\temp\inspect.py
