name: Inspecionar Assistente v0.22.81
on:
  push:
    paths: ['trigger-inspect-v81.txt']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar release 0.22.81
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\base,C:\temp\build | Out-Null
          gh release download v0.22.81 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02281.zip" --dir C:\temp\base
          Expand-Archive C:\temp\base\ALIYVO_BETA_GRATIS_02281.zip -DestinationPath C:\temp\build -Force
      - name: Mostrar WebView2 do WhatsApp
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          @'
          from pathlib import Path
          s=Path(r'C:\temp\build\_app\main.py').read_text(encoding='utf-8',errors='ignore').splitlines()
          starts=[]
          for key in ('class WhatsAppView','class _WebView2PageAdapter'):
              for i,l in enumerate(s):
                  if key in l:
                      starts.append(i)
          for start in sorted(starts):
              end=min(len(s),start+180)
              print(f'--- {start+1}:{end} ---')
              for i in range(start,end):
                  print(f'{i+1:05d}: '+s[i].encode('ascii','backslashreplace').decode('ascii'))
          '@ | python -
