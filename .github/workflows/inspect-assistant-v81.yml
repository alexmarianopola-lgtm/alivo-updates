name: Inspecionar Assistente v0.22.81
on:
  push:
    paths: ['trigger-inspect-v81.txt']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar release 0.22.81
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\base,C:\temp\build | Out-Null
          gh release download v0.22.81 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02281.zip" --dir C:\temp\base
          Expand-Archive C:\temp\base\ALIYVO_BETA_GRATIS_02281.zip -DestinationPath C:\temp\build -Force
      - name: Mostrar ChatGPTPanel
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -c "from pathlib import Path; s=Path(r'C:\temp\build\_app\main.py').read_text(encoding='utf-8',errors='ignore').splitlines(); [print(f'{i+1:05d}: '+s[i].encode('ascii','backslashreplace').decode('ascii')) for i in range(1382,min(len(s),1535))]"
