name: Publicar ALIYVO 0.23.45

on:
  push:
    paths:
      - '.github/workflows/publicar-aliyvo-02345.yml'
      - 'source/v0.23.45/**'
      - 'tests/test_freight_payment_v2345.py'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Baixar versão base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force base,build,out | Out-Null
          gh release download v0.23.44 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_02344.zip" --dir base
          if ($LASTEXITCODE -ne 0) { throw "Base 0.23.44 não baixada" }
          Expand-Archive base/ALIYVO_02344.zip build -Force

      - name: Integrar frete e pagamento
        shell: pwsh
        run: |
          python -c "from pathlib import Path; paths=[Path('source/v0.23.45/main.patch'),Path('source/v0.23.45/aliyvo_freight.patch'),Path('build/_app/main.py'),Path('build/_app/aliyvo_freight.py')]; [p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n')) for p in paths]"
          git apply --check --directory=build source/v0.23.45/main.patch
          if ($LASTEXITCODE -ne 0) { throw "Patch do main.py incompatível" }
          git apply --directory=build source/v0.23.45/main.patch
          if ($LASTEXITCODE -ne 0) { throw "Patch do main.py falhou" }
          git apply --check --directory=build source/v0.23.45/aliyvo_freight.patch
          if ($LASTEXITCODE -ne 0) { throw "Patch das regras de frete incompatível" }
          git apply --directory=build source/v0.23.45/aliyvo_freight.patch
          if ($LASTEXITCODE -ne 0) { throw "Patch das regras de frete falhou" }

      - name: Validar regras, mensagem e código
        shell: pwsh
        run: |
          $env:ALIYVO_TEST_APP_DIR=(Resolve-Path 'build/_app').Path
          python -m unittest tests/test_freight_payment_v2345.py -v
          if ($LASTEXITCODE -ne 0) { throw "Testes de frete e pagamento falharam" }
          python -m compileall -q build/_app
          if ($LASTEXITCODE -ne 0) { throw "Compilação do aplicativo falhou" }
          python -c "import ast,pathlib; p=pathlib.Path('build/_app/main.py'); s=p.read_text(encoding='utf-8'); ast.parse(s); panel=s[s.index('class PrazoPanel'):s.index('class ChatGPTPanel')]; assert '0.23.45' in s; assert 'Frete e pagamento' in panel; assert 'Calcular frete + pagamento' in panel; assert 'Colocar no WhatsApp' in panel; assert 'prazo_tabs' not in panel; assert 'payment_tab' not in panel; assert \"quote['cutoff']\" not in panel; assert 'Corte:' not in panel; assert 'Faltam' not in panel"
          if ($LASTEXITCODE -ne 0) { throw "Integração final incompleta" }

      - name: Empacotar atualização
        shell: pwsh
        run: |
          python -c "import pathlib,zipfile; root=pathlib.Path('build'); z=zipfile.ZipFile('out/ALIYVO_02345.zip','w',zipfile.ZIP_DEFLATED); [z.write(p,p.relative_to(root)) for p in root.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.name!='soma_catalog.sqlite']; z.close()"
          python -c "import zipfile; z=zipfile.ZipFile('out/ALIYVO_02345.zip'); assert z.testzip() is None; assert '_app/main.py' in z.namelist(); assert '_app/aliyvo_freight.py' in z.namelist(); s=z.read('_app/main.py').decode('utf-8'); assert '0.23.45' in s; assert 'Frete e pagamento' in s"
          if ($LASTEXITCODE -ne 0) { throw "Pacote final inválido" }
          $sha=(Get-FileHash out/ALIYVO_02345.zip -Algorithm SHA256).Hash.ToLower()
          "ALIYVO 0.23.45. Frete e pagamento em um único painel. O resultado informa somente frete grátis ou o valor cobrado e exibe as opções de pagamento. Horário de corte e diferença para frete grátis foram retirados da tela e da mensagem. O botão Colocar no WhatsApp preenche a conversa aberta para revisão, sem enviar automaticamente. Funciona localmente e não usa API de IA. Regras, mensagem, sintaxe e pacote verificados. SHA256: $sha" | Set-Content out/VALIDACAO_02345.txt

      - name: Publicar versão 0.23.45
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.23.45 --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.23.45 out/ALIYVO_02345.zip out/VALIDACAO_02345.txt --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            gh release create v0.23.45 out/ALIYVO_02345.zip out/VALIDACAO_02345.txt --repo "$env:GITHUB_REPOSITORY" --title "ALIYVO 0.23.45 - Frete e pagamento direto" --notes "Frete e pagamento agora ficam na mesma tela. Informe cidade, transportadora e valor do pedido para ver somente se o frete é grátis ou quanto custa, junto das opções de pagamento. O horário de corte e a diferença para alcançar frete grátis não aparecem mais para o cliente. O botão Colocar no WhatsApp preenche a conversa aberta com a mensagem pronta, mas não envia sozinho: você revisa e confirma. A função é local e não consome API de IA." --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "Publicação falhou" }
