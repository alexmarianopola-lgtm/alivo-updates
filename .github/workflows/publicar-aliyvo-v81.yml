name: Publicar ALIYVO 0.22.81 teste updater
on:
  push:
    paths: ['trigger-v81.txt']
permissions:
  contents: write
jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar base 0.22.80
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\base,C:\temp\build | Out-Null
          gh release download v0.22.80 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02280.zip" --dir C:\temp\base
          Expand-Archive C:\temp\base\ALIYVO_BETA_GRATIS_02280.zip -DestinationPath C:\temp\build -Force
      - name: Alterar somente numero da versao
        shell: pwsh
        run: |
          python patch_test_update_v81.py C:\temp\build
          python -m py_compile C:\temp\build\_app\main.py C:\temp\build\_app\updater_worker.pyw
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.81"' | Out-Null
      - name: Empacotar e validar
        shell: pwsh
        run: |
          Compress-Archive -Path C:\temp\build\* -DestinationPath C:\temp\ALIYVO_BETA_GRATIS_02281.zip -Force
          Remove-Item -Recurse -Force C:\temp\verify -ErrorAction SilentlyContinue
          Expand-Archive C:\temp\ALIYVO_BETA_GRATIS_02281.zip -DestinationPath C:\temp\verify -Force
          python -m py_compile C:\temp\verify\_app\main.py C:\temp\verify\_app\updater_worker.pyw
          Select-String -Path C:\temp\verify\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.81"' | Out-Null
      - name: Publicar release de teste
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.22.81 C:\temp\ALIYVO_BETA_GRATIS_02281.zip --repo "$env:GITHUB_REPOSITORY" --title "ALIYVO Beta Gratis 0.22.81 - teste de atualização automática" --notes "Versão de teste baseada exatamente na 0.22.80. A única alteração é o número da versão para validar, no computador do usuário, o fluxo real de atualização automática 0.22.80 -> 0.22.81 pelo próprio ALIYVO." --latest
