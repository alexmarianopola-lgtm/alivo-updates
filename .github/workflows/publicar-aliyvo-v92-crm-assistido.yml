name: Publicar ALIYVO 0.22.92 CRM Assistido
on:
  push:
    paths: ['trigger-v92-release.txt']
permissions:
  contents: write
jobs:
  testar-e-publicar:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Baixar base oficial 0.22.91
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\base,C:\temp\build,C:\temp\verify,C:\temp\out | Out-Null
          gh release download v0.22.91 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02291.zip" --dir C:\temp\base
          Expand-Archive C:\temp\base\ALIYVO_BETA_GRATIS_02291.zip -DestinationPath C:\temp\build -Force
          if(-not (Test-Path C:\temp\build\_app\main.py)){ throw 'Base 0.22.91 invalida' }
          (Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash | Set-Content C:\temp\updater_before.txt

      - name: Aplicar CRM Assistido
        shell: pwsh
        run: |
          python patch_crm_assistido_v92.py C:\temp\build
          python -m py_compile C:\temp\build\_app\main.py C:\temp\build\_app\updater_worker.pyw
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.92"' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'def _crm_detect_state' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'self._crm_update_state_from_context\(name,context\)' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'PENDÊNCIAS DETECTADAS PELO OBSERVADOR' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'SITUAÇÃO CRM' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'setInterval\(20000\)' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'def _diagnostic_scan_guard_done' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'class WhatsAppView\(QtWebView2Widget\)' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'self.web=QWebEngineView\(self\)' | Out-Null
          $before=(Get-Content C:\temp\updater_before.txt).Trim()
          $after=(Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater foi alterado' }

      - name: Gate CRM Assistido
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --disable-pip-version-check --quiet PyQt6
          python tests\logic_crm_assistido_v92.py C:\temp\build\_app | Tee-Object C:\temp\out\logic-crm-v92.txt
          if($LASTEXITCODE -ne 0){ throw 'Gate CRM Assistido v92 falhou' }
          Select-String -Path C:\temp\out\logic-crm-v92.txt -Pattern 'ALIYVO_V92_CRM_ASSISTIDO=OK' | Out-Null

      - name: Repetir gate WhatsApp Turbo
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $t=Get-Content tests\logic_whatsapp_turbo_v91.py -Raw
          $t=$t.Replace("assert m.ALIYVO_VERSION=='0.22.91'","assert m.ALIYVO_VERSION=='0.22.92'")
          $t=$t.Replace('ALIYVO_V91_WHATSAPP_TURBO=OK','ALIYVO_V92_WHATSAPP_TURBO=OK')
          Set-Content C:\temp\logic_whatsapp_v92.py $t -Encoding UTF8
          python C:\temp\logic_whatsapp_v92.py C:\temp\build\_app | Tee-Object C:\temp\out\logic-whatsapp-v92.txt
          if($LASTEXITCODE -ne 0){ throw 'Gate WhatsApp Turbo falhou' }
          Select-String -Path C:\temp\out\logic-whatsapp-v92.txt -Pattern 'ALIYVO_V92_WHATSAPP_TURBO=OK' | Out-Null

      - name: Empacotar candidato exato
        shell: pwsh
        run: |
          Compress-Archive -Path C:\temp\build\* -DestinationPath C:\temp\out\ALIYVO_BETA_GRATIS_02292.zip -Force
          Expand-Archive C:\temp\out\ALIYVO_BETA_GRATIS_02292.zip -DestinationPath C:\temp\verify -Force
          python -m py_compile C:\temp\verify\_app\main.py C:\temp\verify\_app\updater_worker.pyw
          Select-String -Path C:\temp\verify\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.92"' | Out-Null
          Select-String -Path C:\temp\verify\_app\main.py -Pattern 'def _crm_detect_state' | Out-Null
          Select-String -Path C:\temp\verify\_app\main.py -Pattern 'setInterval\(20000\)' | Out-Null
          $before=(Get-Content C:\temp\updater_before.txt).Trim()
          $after=(Get-FileHash C:\temp\verify\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater no ZIP final foi alterado' }

      - name: Repetir gates no ZIP final
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests\logic_crm_assistido_v92.py C:\temp\verify\_app | Tee-Object C:\temp\out\logic-crm-final-v92.txt
          if($LASTEXITCODE -ne 0){ throw 'ZIP final falhou no gate CRM' }
          python C:\temp\logic_whatsapp_v92.py C:\temp\verify\_app | Tee-Object C:\temp\out\logic-whatsapp-final-v92.txt
          if($LASTEXITCODE -ne 0){ throw 'ZIP final falhou no gate WhatsApp Turbo' }
          Select-String -Path C:\temp\out\logic-crm-final-v92.txt -Pattern 'ALIYVO_V92_CRM_ASSISTIDO=OK' | Out-Null
          Select-String -Path C:\temp\out\logic-whatsapp-final-v92.txt -Pattern 'ALIYVO_V92_WHATSAPP_TURBO=OK' | Out-Null
          $sha=(Get-FileHash C:\temp\out\ALIYVO_BETA_GRATIS_02292.zip -Algorithm SHA256).Hash
          @(
            "ALIYVO 0.22.92",
            "Base: 0.22.91",
            "CRM Assistido BETA: OK",
            "Status comercial: OK",
            "Proxima acao: OK",
            "Pendencia/responsavel: OK",
            "Sem novo scanner/timer DOM: OK",
            "WhatsApp Turbo 20s + guard: preservado",
            "Updater preservado",
            "ZIP SHA256=$sha"
          ) | Set-Content C:\temp\out\VALIDACAO_02292.txt -Encoding UTF8

      - name: Publicar somente depois dos gates
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.22.92 C:\temp\out\ALIYVO_BETA_GRATIS_02292.zip C:\temp\out\VALIDACAO_02292.txt --repo "$env:GITHUB_REPOSITORY" --title "ALIYVO 0.22.92 - CRM Assistido BETA" --notes "Baseada diretamente na 0.22.91. O Observador passa a registrar um estado comercial leve por conversa (status, proxima acao, pendencia, responsavel e confianca) reutilizando o mesmo contexto ja lido pelo diagnostico, sem novo scanner/timer do DOM. O CRM do dia e a Assistencia Rapida exibem esses estados. Nenhuma mensagem ou lembrete e criado automaticamente. WhatsApp Turbo, arquitetura e updater preservados." --latest
