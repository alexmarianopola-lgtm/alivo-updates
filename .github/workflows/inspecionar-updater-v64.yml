name: Inspecionar updater 0.22.72
on:
  push:
    paths:
      - 'trigger-v64.txt'
permissions:
  contents: read
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e inspecionar updater antigo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/base /tmp/app
          gh release download v0.22.72 --repo "$GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02272.zip" --dir /tmp/base
          unzip -q /tmp/base/ALIYVO_BETA_GRATIS_02272.zip -d /tmp/app
          echo '=== updater_worker.pyw ==='
          sed -n '1,260p' /tmp/app/_app/updater_worker.pyw || true
          echo '=== update snippets main.py ==='
          grep -n -E 'UpdatePanel|Atualizar agora|updater_worker|latest|releases/latest|sha256|browser_download_url|Verificar atualização|Verificar atualizacao' /tmp/app/_app/main.py | head -n 220 || true
