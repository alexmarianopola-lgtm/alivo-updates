name: Extract v2322 call crm exact
on:
  push:
    paths: ['trigger-extract-v2322-callcrm.txt']
permissions:
  contents: write
jobs:
  x:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - shell: pwsh
        env: {GH_TOKEN: ${{ github.token }}}
        run: |
          New-Item -ItemType Directory -Force C:\x | Out-Null
          gh release download v0.23.22 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02322.zip" --dir C:\x
          Expand-Archive C:\x\ALIYVO_BETA_GRATIS_02322.zip C:\x\app -Force
          python extract_v2322_callcrm.py C:\x\app\_app\main.py inspect_v2322_callcrm.txt
          git config user.name aliyvo-inspector
          git config user.email actions@users.noreply.github.com
          git add inspect_v2322_callcrm.txt
          git commit -m "inspect: v2322 call crm exact"
          git push
