name: Extract v2322 call crm exact
on:
  push:
    paths:
      - 'trigger-extract-v2322-callcrm.txt'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extrair
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\v2322 | Out-Null
          gh release download v0.23.22 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02322.zip" --dir C:\temp\v2322
          Expand-Archive C:\temp\v2322\ALIYVO_BETA_GRATIS_02322.zip -DestinationPath C:\temp\v2322\app -Force
          python extract_v2322_callcrm.py C:\temp\v2322\app\_app\main.py inspect_v2322_callcrm.txt
          git config user.name "aliyvo-inspector"
          git config user.email "actions@users.noreply.github.com"
          git add inspect_v2322_callcrm.txt
          git commit -m "inspect: v2322 call crm exact"
          git push
