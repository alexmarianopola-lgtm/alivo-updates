name: Publicar ALIYVO v57
on:
  push:
    paths:
      - 'trigger-v57.txt'
permissions:
  contents: write
jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler versao
        id: meta
        shell: pwsh
        run: |
          $d = Get-Content update-v57.json -Raw | ConvertFrom-Json
          "version=$($d.version)" >> $env:GITHUB_OUTPUT
          "tag=v$($d.version)" >> $env:GITHUB_OUTPUT
          "asset=$($d.asset_name)" >> $env:GITHUB_OUTPUT
      - name: Baixar base 0.22.68
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\base | Out-Null
          gh release download v0.22.68 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02268.zip" --dir C:\temp\base
      - name: Aplicar recuperacao
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force C:\temp\build -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path C:\temp\build | Out-Null
          Expand-Archive C:\temp\base\ALIYVO_BETA_GRATIS_02268.zip -DestinationPath C:\temp\build -Force
          python patch_script_v57.py C:\temp\build\_app\main.py
          python -m py_compile C:\temp\build\_app\main.py
      - name: Teste de inicializacao Python
        shell: pwsh
        run: |
          python - <<'PY'
          import ast, pathlib
          p=pathlib.Path(r'C:\temp\build\_app\main.py')
          ast.parse(p.read_text(encoding='utf-8'))
          print('main.py parse OK')
          PY
      - name: Empacotar
        shell: pwsh
        run: |
          Compress-Archive -Path C:\temp\build\* -DestinationPath "C:\temp\${{ steps.meta.outputs.asset }}" -Force
      - name: Publicar Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $d = Get-Content update-v57.json -Raw | ConvertFrom-Json
          gh release create "${{ steps.meta.outputs.tag }}" "C:\temp\${{ steps.meta.outputs.asset }}" --repo "$env:GITHUB_REPOSITORY" --title "ALIYVO Beta Gratis ${{ steps.meta.outputs.version }}" --notes "$($d.notes)" --latest
