name: Inspecionar UpdatePanel 0.22.72
on:
  push:
    paths:
      - 'trigger-inspecionar-updatepanel-v66.txt'
permissions:
  contents: read
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e inspecionar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/base /tmp/app
          gh release download v0.22.72 --repo "$GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02272.zip" --dir /tmp/base
          unzip -q /tmp/base/ALIYVO_BETA_GRATIS_02272.zip -d /tmp/app
          echo '=== UpdatePanel ==='
          sed -n '4039,4195p' /tmp/app/_app/main.py
          echo '=== Update methods later ==='
          sed -n '10600,10895p' /tmp/app/_app/main.py
