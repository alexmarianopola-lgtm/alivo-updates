name: Inspecionar pacote para instalador v47

on:
  push:
    paths:
      - ".github/workflows/inspecionar-pacote-installer-v47.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar ultima release e inspecionar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/base /tmp/build && mkdir -p /tmp/base /tmp/build
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "*.zip" --dir /tmp/base
          unzip -q "$(find /tmp/base -type f -name '*.zip' | head -n1)" -d /tmp/build
          echo '=== ARQUIVOS ==='
          find /tmp/build -maxdepth 3 -type f -printf '%P\n' | sort
          echo '=== ALIYVO.PYW ==='
          sed -n '1,220p' /tmp/build/_app/Aliyvo.pyw || true
          echo '=== IMPORTS MAIN.PY ==='
          grep -nE '^(from|import) ' /tmp/build/_app/main.py | head -n 250 || true
          echo '=== REFERENCIAS EXTERNAS AUDIO/ORTOGRAFIA ==='
          grep -niE 'ffmpeg|whisper|spell|audio|pydub|speech|qtwebview2|pythonnet|webengine|requests|urllib|win32' /tmp/build/_app/main.py | head -n 350 || true
