name: Inspecionar dependencias instalador v48

on:
  push:
    paths:
      - ".github/workflows/inspecionar-deps-installer-v48.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspecionar workers e setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/base /tmp/build && mkdir -p /tmp/base /tmp/build
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "*.zip" --dir /tmp/base
          unzip -q "$(find /tmp/base -type f -name '*.zip' | head -n1)" -d /tmp/build
          for f in /tmp/build/_app/_setup/*.bat /tmp/build/_app/transcribe_worker.py /tmp/build/_app/ocr_worker.py /tmp/build/_app/update_check_worker.py /tmp/build/_app/update_selftest_worker.py /tmp/build/_app/updater_worker.pyw; do
            echo "===== $f ====="
            sed -n '1,320p' "$f" || true
          done
          echo '===== PROCESSOS EM MAIN ====='
          grep -nE 'QProcess|sys\.executable|pythonw|transcribe_worker|ocr_worker|update_check_worker|updater_worker|faster_whisper|SpellChecker' /tmp/build/_app/main.py | head -n 500 || true
