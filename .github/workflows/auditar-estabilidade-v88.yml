name: Auditar estabilidade ALIYVO 0.22.88
on:
  push:
    paths: ['trigger-audit-v88.txt']
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar release 0.22.88
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\audit | Out-Null
          gh release download v0.22.88 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02288.zip" --dir C:\temp\audit
          Expand-Archive C:\temp\audit\ALIYVO_BETA_GRATIS_02288.zip -DestinationPath C:\temp\audit\build -Force
      - name: Gerar auditoria estatica
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re, ast
          p=Path(r'C:\temp\audit\build\_app\main.py')
          txt=p.read_text(encoding='utf-8')
          lines=txt.splitlines()
          out=[]
          out.append(f'lines={len(lines)}')
          out.append(f'qtimer_mentions={txt.count("QTimer")}; singleShot={txt.count("singleShot")}; timeout_connects={len(re.findall(r"timeout\.connect",txt))}')
          out.append(f'qdialogs={txt.count("QDialog(")}; qtextedits={txt.count("QTextEdit(")}')
          out.append('\n=== ERRO RELATADO: entorno 9100-9165 ===')
          for i in range(9090,min(9170,len(lines))): out.append(f'{i+1:05d}: {lines[i]}')
          out.append('\n=== TODOS OS QTimer / timeout.connect / singleShot ===')
          for i,l in enumerate(lines,1):
              if 'QTimer' in l or '.timeout.connect' in l or 'singleShot' in l:
                  out.append(f'{i:05d}: {l}')
          out.append('\n=== DEFINICOES refresh/update/tick/scan ===')
          for i,l in enumerate(lines,1):
              s=l.strip()
              if re.match(r'def\s+(refresh|update|tick|scan|poll|check|backup|sync|run)',s):
                  out.append(f'{i:05d}: {l}')
          out.append('\n=== POSSIVEIS WIDGETS LOCAIS USADOS EM CALLBACKS ===')
          for i,l in enumerate(lines,1):
              if any(x in l for x in ('setPlainText(','setText(','append(','setHtml(')) and 8500 <= i <= 9800:
                  out.append(f'{i:05d}: {l}')
          Path(r'C:\temp\audit\audit.txt').write_text('\n'.join(out),encoding='utf-8')
          print('\n'.join(out[:20]))
          '@ | Set-Content -Encoding UTF8 C:\temp\audit\audit.py
          python C:\temp\audit\audit.py
          Copy-Item C:\temp\audit\build\_app\main.py C:\temp\audit\main_v88.py
      - uses: actions/upload-artifact@v4
        with:
          name: aliyvo-v88-estabilidade
          path: |
            C:\temp\audit\audit.txt
            C:\temp\audit\main_v88.py
