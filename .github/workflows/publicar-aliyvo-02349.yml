name: Publicar ALIYVO 0.23.49

on:
  push:
    paths:
      - '.github/workflows/publicar-aliyvo-02349.yml'
      - 'source/v0.23.49/**'
      - 'tests/test_campaign_persistence_agenda_v2349.py'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Baixar versão base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force base,build,out | Out-Null
          gh release download v0.23.48 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_02348.zip" --dir base
          if ($LASTEXITCODE -ne 0) { throw "Base 0.23.48 não baixada" }
          Expand-Archive base/ALIYVO_02348.zip build -Force

      - name: Integrar agenda e persistência das campanhas
        shell: pwsh
        run: |
          python -c "from pathlib import Path; paths=[Path('source/v0.23.49/main.py.patch'),Path('build/_app/main.py')]; [p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n')) for p in paths]"
          git apply --check --directory=build source/v0.23.49/main.py.patch
          if ($LASTEXITCODE -ne 0) { throw "Patch de campanhas incompatível" }
          git apply --directory=build source/v0.23.49/main.py.patch
          if ($LASTEXITCODE -ne 0) { throw "Patch de campanhas falhou" }

      - name: Validar preservação e importação
        shell: pwsh
        run: |
          $env:ALIYVO_TEST_APP_DIR=(Resolve-Path 'build/_app').Path
          python -m unittest tests/test_campaign_persistence_agenda_v2349.py -v
          if ($LASTEXITCODE -ne 0) { throw "Testes de campanhas falharam" }
          python -m compileall -q build/_app
          if ($LASTEXITCODE -ne 0) { throw "Compilação do aplicativo falhou" }

      - name: Empacotar atualização
        shell: pwsh
        run: |
          python -c "import pathlib,zipfile; root=pathlib.Path('build'); z=zipfile.ZipFile('out/ALIYVO_02349.zip','w',zipfile.ZIP_DEFLATED); [z.write(p,p.relative_to(root)) for p in root.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.name!='soma_catalog.sqlite']; z.close()"
          python -c "import zipfile; z=zipfile.ZipFile('out/ALIYVO_02349.zip'); assert z.testzip() is None; s=z.read('_app/main.py').decode('utf-8'); assert '0.23.49' in s; assert 'CAMPAIGN_DRAFT_FILE' in s; assert 'Importar agenda do WhatsApp' in s; assert 'WPP.contact.list({onlyMyContacts:true})' in s; assert '_restore_whatsapp_composer_focus' in s"
          if ($LASTEXITCODE -ne 0) { throw "Pacote final inválido" }
          $sha=(Get-FileHash out/ALIYVO_02349.zip -Algorithm SHA256).Hash.ToLower()
          "ALIYVO 0.23.49. Campanhas, listas, mensagem e imagem agora são preservadas automaticamente fora da pasta do programa. Nova importação em lote da agenda do WhatsApp via WA-JS, com seleção antes de adicionar. O envio direto por número continua sem abrir conversa por conversa. SHA256: $sha" | Set-Content out/VALIDACAO_02349.txt

      - name: Publicar versão 0.23.49
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.23.49 --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.23.49 out/ALIYVO_02349.zip out/VALIDACAO_02349.txt --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            gh release create v0.23.49 out/ALIYVO_02349.zip out/VALIDACAO_02349.txt --repo "$env:GITHUB_REPOSITORY" --title "ALIYVO 0.23.49 - Campanhas salvas e agenda em lote" --notes "As listas, a campanha atual, a mensagem e a imagem ficam salvas automaticamente fora da pasta atualizada. O novo botão Importar agenda do WhatsApp carrega os contatos salvos de uma vez e permite revisar/desmarcar antes de adicionar. O envio continua direto por número, sem abrir cada conversa."
          }
          if ($LASTEXITCODE -ne 0) { throw "Publicação falhou" }
          gh release edit v0.23.49 --repo "$env:GITHUB_REPOSITORY" --latest
          if ($LASTEXITCODE -ne 0) { throw "Não foi possível marcar como versão mais recente" }
