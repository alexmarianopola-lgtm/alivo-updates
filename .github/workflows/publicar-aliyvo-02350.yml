name: Publicar ALIYVO 0.23.50

on:
  push:
    paths:
      - '.github/workflows/publicar-aliyvo-02350.yml'
      - 'source/v0.23.50/**'
      - 'tests/test_campaign_agenda_lid_v2350.py'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Baixar versão base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force base,build,out | Out-Null
          gh release download v0.23.49 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_02349.zip" --dir base
          if ($LASTEXITCODE -ne 0) { throw "Base 0.23.48 não baixada" }
          Expand-Archive base/ALIYVO_02349.zip build -Force

      - name: Corrigir agenda LID e conversas individuais
        shell: pwsh
        run: |
          python -c "from pathlib import Path; paths=[Path('source/v0.23.50/main.py.patch'),Path('build/_app/main.py')]; [p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n')) for p in paths]"
          git apply --check --directory=build source/v0.23.50/main.py.patch
          if ($LASTEXITCODE -ne 0) { throw "Patch de agenda incompatível" }
          git apply --directory=build source/v0.23.50/main.py.patch
          if ($LASTEXITCODE -ne 0) { throw "Patch de agenda falhou" }

      - name: Validar agenda, LID e envio direto
        shell: pwsh
        run: |
          $env:ALIYVO_TEST_APP_DIR=(Resolve-Path 'build/_app').Path
          python -m unittest tests/test_campaign_agenda_lid_v2350.py -v
          if ($LASTEXITCODE -ne 0) { throw "Testes de agenda falharam" }
          python -m compileall -q build/_app
          if ($LASTEXITCODE -ne 0) { throw "Compilação do aplicativo falhou" }

      - name: Empacotar atualização
        shell: pwsh
        run: |
          python -c "import pathlib,zipfile; root=pathlib.Path('build'); z=zipfile.ZipFile('out/ALIYVO_02350.zip','w',zipfile.ZIP_DEFLATED); [z.write(p,p.relative_to(root)) for p in root.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.name!='soma_catalog.sqlite']; z.close()"
          python -c "import zipfile; z=zipfile.ZipFile('out/ALIYVO_02350.zip'); assert z.testzip() is None; s=z.read('_app/main.py').decode('utf-8'); assert '0.23.50' in s; assert 'CAMPAIGN_DRAFT_FILE' in s; assert 'Importar agenda do WhatsApp' in s; assert 'WPP.contact.list({onlyMyContacts:true})' in s; assert 'WPP.chat.list({onlyUsers:true})' in s; assert '@lid' in s; assert '_restore_whatsapp_composer_focus' in s"
          if ($LASTEXITCODE -ne 0) { throw "Pacote final inválido" }
          $sha=(Get-FileHash out/ALIYVO_02350.zip -Algorithm SHA256).Hash.ToLower()
          "ALIYVO 0.23.50. A importação combina contatos salvos e conversas individuais, aceita identificadores LID atuais do WhatsApp e tenta convertê-los para telefone. O envio direto funciona mesmo quando o WhatsApp não expõe o número. SHA256: $sha" | Set-Content out/VALIDACAO_02350.txt

      - name: Publicar versão 0.23.50
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.23.50 --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.23.50 out/ALIYVO_02350.zip out/VALIDACAO_02350.txt --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            gh release create v0.23.50 out/ALIYVO_02350.zip out/VALIDACAO_02350.txt --repo "$env:GITHUB_REPOSITORY" --title "ALIYVO 0.23.50 - Agenda completa e contatos LID" --notes "Corrige a importação que retornava zero contatos. O ALIYVO agora combina a agenda salva com as conversas individuais, reconhece os identificadores LID usados pelo WhatsApp atual e mantém o envio direto sem abrir conversa por conversa."
          }
          if ($LASTEXITCODE -ne 0) { throw "Publicação falhou" }
          gh release edit v0.23.50 --repo "$env:GITHUB_REPOSITORY" --latest
          if ($LASTEXITCODE -ne 0) { throw "Não foi possível marcar como versão mais recente" }

