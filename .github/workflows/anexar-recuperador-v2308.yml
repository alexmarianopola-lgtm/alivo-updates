name: Anexar Recuperador 0.23.08
on:
  push:
    paths: ['trigger-upload-recovery-02308.txt']
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Anexar recuperador ao release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.23.08 RECUPERAR_ALIYVO_02308.bat --repo "$GITHUB_REPOSITORY" --clobber
