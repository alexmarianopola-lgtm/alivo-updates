name: Extrair blocos Radar v2303
on:
  push:
    paths: ['trigger-extrair-radar-v2303.txt']
permissions:
  contents: write
jobs:
  extract:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Baixar base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\base | Out-Null
          gh release download v0.23.03 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02303.zip" --dir C:\temp\base
          Expand-Archive C:\temp\base\ALIYVO_BETA_GRATIS_02303.zip -DestinationPath C:\temp\base\app -Force
      - name: Extrair blocos
        shell: pwsh
        run: |
          $p='C:\temp\base\app\_app\main.py'
          $l=Get-Content $p
          $out=@()
          foreach($r in @(@(6150,6350),@(6351,6500),@(6980,7085),@(8700,9320))){
            $a=$r[0];$b=$r[1]
            $out+="===== MAIN $a-$b ====="
            for($i=$a;$i -le $b -and $i -le $l.Count;$i++){ $out+=("{0:D5}: {1}" -f $i,$l[$i-1]) }
          }
          $out | Set-Content radar_blocos_v2303.txt -Encoding UTF8
      - name: Commit
        shell: pwsh
        run: |
          git config user.name "aliyvo-inspector"
          git config user.email "actions@users.noreply.github.com"
          git add radar_blocos_v2303.txt
          git commit -m "inspect: extrair blocos para Radar v2303"
          git push
