name: Publicar ALIYVO 0.23.52

on:
  push:
    paths:
      - '.github/workflows/publicar-aliyvo-02352.yml'
      - 'source/v0.23.52/**'
      - 'tests/test_call_quota_v2352.py'
      - 'channels/**'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Baixar versão base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force base,build,out | Out-Null
          gh release download v0.23.51 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_02351.zip" --dir base
          if ($LASTEXITCODE -ne 0) { throw "Base 0.23.51 não baixada" }
          Expand-Archive base/ALIYVO_02351.zip build -Force

      - name: Corrigir cota da avaliação de ligações
        shell: pwsh
        run: |
          python -c "from pathlib import Path; paths=[Path('source/v0.23.52/app.patch'),Path('build/_app/main.py'),Path('build/_app/aliyvo_call_ai.py'),Path('build/_app/aliyvo_call_quota.py')]; [p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n')) for p in paths]"
          git apply --check --directory=build source/v0.23.52/app.patch
          if ($LASTEXITCODE -ne 0) { throw "Patch da cota incompatível" }
          git apply --directory=build source/v0.23.52/app.patch
          if ($LASTEXITCODE -ne 0) { throw "Patch da cota falhou" }

      - name: Validar avaliação próxima do limite
        shell: pwsh
        run: |
          $env:ALIYVO_TEST_APP_DIR=(Resolve-Path 'build/_app').Path
          python -m unittest tests/test_call_quota_v2352.py -v
          if ($LASTEXITCODE -ne 0) { throw "Testes da cota falharam" }
          python -m compileall -q build/_app
          if ($LASTEXITCODE -ne 0) { throw "Compilação do aplicativo falhou" }

      - name: Empacotar atualização
        shell: pwsh
        run: |
          python -c "import pathlib,zipfile; root=pathlib.Path('build'); z=zipfile.ZipFile('out/ALIYVO_02352.zip','w',zipfile.ZIP_DEFLATED); [z.write(p,p.relative_to(root)) for p in root.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.name!='soma_catalog.sqlite']; z.close()"
          python -c "import zipfile; z=zipfile.ZipFile('out/ALIYVO_02352.zip'); assert z.testzip() is None; m=z.read('_app/main.py').decode('utf-8'); q=z.read('_app/aliyvo_call_quota.py').decode('utf-8'); assert '0.23.52' in m; assert 'data[\"seconds\"] >= MAX_SECONDS' in q"
          if ($LASTEXITCODE -ne 0) { throw "Pacote final inválido" }
          $sha=(Get-FileHash out/ALIYVO_02352.zip -Algorithm SHA256).Hash.ToLower()
          "ALIYVO Vendas 0.23.52. Avaliação de ligação corrigida perto do limite mensal. SHA256: $sha" | Set-Content out/VALIDACAO_02352.txt

      - name: Publicar versão 0.23.52
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.23.52 --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.23.52 out/ALIYVO_02352.zip out/VALIDACAO_02352.txt --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            gh release create v0.23.52 out/ALIYVO_02352.zip out/VALIDACAO_02352.txt --repo "$env:GITHUB_REPOSITORY" --title "ALIYVO Vendas 0.23.52 - Avaliação de ligações" --notes "Corrige o bloqueio antecipado da análise próximo da cota mensal. Se uma avaliação começar abaixo de 30 ligações e 60 minutos, ela termina normalmente; somente a próxima é pausada."
          }
          if ($LASTEXITCODE -ne 0) { throw "Publicação falhou" }
          gh release edit v0.23.52 --repo "$env:GITHUB_REPOSITORY" --latest
          if ($LASTEXITCODE -ne 0) { throw "Não foi possível marcar como versão mais recente" }

