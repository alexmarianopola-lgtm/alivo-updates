name: Inspecionar WhatsApp reabertura v52

on:
  push:
    paths:
      - ".github/workflows/inspecionar-whatsapp-reabertura-v52.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspecionar pontos de perfil e montagem
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/base /tmp/app && mkdir -p /tmp/base /tmp/app
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_*.zip" --dir /tmp/base
          unzip -q "$(find /tmp/base -name '*.zip' | head -n1)" -d /tmp/app
          echo '=== TOP / PERFIL ==='
          sed -n '45,240p' /tmp/app/_app/main.py
          echo '=== MONTAGEM WHATSAPP ==='
          sed -n '6170,6325p' /tmp/app/_app/main.py
          echo '=== ABRIR WHATS / LAYOUT ==='
          sed -n '10520,10680p' /tmp/app/_app/main.py
          echo '=== LAUNCHER ==='
          sed -n '1,260p' /tmp/app/_app/Aliyvo.pyw
          echo '=== REFERENCIAS READY/INIT ==='
          grep -nE '_on_wv2_initialized|initialization_done|is_ready|_webview|WEBVIEW2_PROFILE_DIR|closeEvent' /tmp/app/_app/main.py | head -n 300
