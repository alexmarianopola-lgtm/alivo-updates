name: Publicar ALIYVO 0.23.30
on:
  push:
    paths: ['.github/workflows/publicar-aliyvo-02330.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar pacote e validar
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force base,build,out | Out-Null
          gh release download v0.23.22 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02322.zip" --dir base
          if ($LASTEXITCODE -ne 0) { throw "Base nao baixada" }
          Expand-Archive base/ALIYVO_BETA_GRATIS_02322.zip build -Force
          '' | Set-Content overlay.b64 -Encoding ascii
          python -c "import base64,io,zipfile,pathlib; z=zipfile.ZipFile(io.BytesIO(base64.b64decode(pathlib.Path('overlay.b64').read_text()))); assert z.testzip() is None; z.extractall('build')"
          if ($LASTEXITCODE -ne 0) { throw "Overlay invalido" }
          python -m pip install --target build/_app/audio_vendor PyAudioWPatch Pillow openpyxl PyMuPDF
          if ($LASTEXITCODE -ne 0) { throw "Dependencias indisponiveis" }
          python -m compileall -q build/_app
          if ($LASTEXITCODE -ne 0) { throw "Compilacao falhou" }
          python -c "import sys;sys.path.insert(0,'build/_app/audio_vendor');import pyaudiowpatch,PIL,openpyxl,fitz;print('Dependencias OK')"
          if ($LASTEXITCODE -ne 0) { throw "Importacao falhou" }
          python -c "import pathlib,zipfile; root=pathlib.Path('build'); z=zipfile.ZipFile('out/ALIYVO_02330.zip','w',zipfile.ZIP_DEFLATED); [z.write(p,p.relative_to(root)) for p in root.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.name!='soma_catalog.sqlite']; z.close()"
          python -c "import zipfile;z=zipfile.ZipFile('out/ALIYVO_02330.zip');assert z.testzip() is None"
          if ($LASTEXITCODE -ne 0) { throw "ZIP invalido" }
          $sha=(Get-FileHash out/ALIYVO_02330.zip -Algorithm SHA256).Hash.ToLower()
          "ALIYVO 0.23.30. Compilacao e dependencias Windows verificadas. SHA256: $sha. Captura real, pesquisa API e identificacao visual precisam de confirmacao no PC. Tabela Soma nao incluida na publicacao; preservada localmente ou importada pelo usuario." | Set-Content out/VALIDACAO_02330.txt
          gh release view v0.23.30 --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.23.30 out/ALIYVO_02330.zip out/VALIDACAO_02330.txt --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            gh release create v0.23.30 out/ALIYVO_02330.zip out/VALIDACAO_02330.txt --repo "$env:GITHUB_REPOSITORY" --title "ALIYVO 0.23.30 - Respostas incompletas e referencias salvas" --notes "Busca aceita resposta JSON envolvida em texto e recupera somente produtos completos de respostas cortadas. Se necessario, organiza a resposta existente uma unica vez em JSON sem repetir a busca na internet. Ausencia ou formato invalido nao apagam resultados locais. Relacao 227290 e similares para original Scania 1786563 salva com fonte DR3 e data, cruzando todas as marcas na tabela local Soma mesmo sem consulta online. Sem tabela privada ou estoque no pacote. Regressao de texto simples, JSON incompleto/invalido/vazio, falha de download e tres codigos da tabela local passou. API paga e interface real no Windows precisam ser conferidas no PC." --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "Publicacao falhou" }
