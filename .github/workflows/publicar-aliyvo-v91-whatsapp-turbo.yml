name: Publicar ALIYVO 0.22.91 WhatsApp Turbo
on:
  push:
    paths: ['trigger-v91-release.txt']
permissions:
  contents: write
jobs:
  testar-e-publicar:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Baixar base oficial 0.22.90
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\base,C:\temp\build,C:\temp\verify,C:\temp\out | Out-Null
          gh release download v0.22.90 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02290.zip" --dir C:\temp\base
          Expand-Archive C:\temp\base\ALIYVO_BETA_GRATIS_02290.zip -DestinationPath C:\temp\build -Force
          if(-not (Test-Path C:\temp\build\_app\main.py)){ throw 'Base 0.22.90 invalida' }
          (Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash | Set-Content C:\temp\updater_before.txt

      - name: Aplicar WhatsApp Turbo sem mudar arquitetura
        shell: pwsh
        run: |
          python patch_whatsapp_turbo_v91.py C:\temp\build
          python -m py_compile C:\temp\build\_app\main.py C:\temp\build\_app\updater_worker.pyw
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.91"' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'self._diagnostic_timer=QTimer\(self\); self._diagnostic_timer.setInterval\(20000\)' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'def _diagnostic_scan_guard_done' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern '_diagnostic_extract_script' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'a.isContentEditable' | Out-Null
          if(Select-String -Path C:\temp\build\_app\main.py -SimpleMatch 'self._diagnostic_timer=QTimer(self); self._diagnostic_timer.setInterval(5000)' -Quiet){ throw 'Polling pesado de 5 s ainda presente' }
          if(Select-String -Path C:\temp\build\_app\main.py -Pattern 'class ChatGPTWebView\(QtWebView2Widget\)' -Quiet){ throw 'Assistente mudou para WebView2' }
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'self.web=QWebEngineView\(self\)' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'class WhatsAppView\(QtWebView2Widget\)' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'WEB_RENDER_02290.jsonl' | Out-Null
          if(-not (Test-Path C:\temp\build\GERAR_DIAGNOSTICO_PARA_CHATGPT.bat)){ throw 'Coletor diagnostico v90 foi perdido' }
          $before=(Get-Content C:\temp\updater_before.txt).Trim()
          $after=(Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater foi alterado' }

      - name: Gate especifico WhatsApp Turbo
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --disable-pip-version-check --quiet PyQt6
          python tests\logic_whatsapp_turbo_v91.py C:\temp\build\_app | Tee-Object C:\temp\out\logic-whatsapp-v91.txt
          if($LASTEXITCODE -ne 0){ throw 'Gate WhatsApp Turbo v91 falhou' }
          Select-String -Path C:\temp\out\logic-whatsapp-v91.txt -Pattern 'ALIYVO_V91_WHATSAPP_TURBO=OK' | Out-Null

      - name: Repetir gate de estabilidade historico
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $t=Get-Content tests\logic_stability_v89.py -Raw
          $t=$t.Replace("assert m.ALIYVO_VERSION=='0.22.89'","assert m.ALIYVO_VERSION=='0.22.91'")
          $t=$t.Replace('self._diagnostic_timer=QTimer(self); self._diagnostic_timer.setInterval(5000)','self._diagnostic_timer=QTimer(self); self._diagnostic_timer.setInterval(20000)')
          $t=$t.Replace('ALIYVO_V89_LOGIC_STABILITY=OK','ALIYVO_V91_LOGIC_STABILITY=OK')
          Set-Content C:\temp\logic_stability_v91.py $t -Encoding UTF8
          python C:\temp\logic_stability_v91.py C:\temp\build\_app | Tee-Object C:\temp\out\logic-stability-v91.txt
          if($LASTEXITCODE -ne 0){ throw 'Gate historico de estabilidade falhou' }
          Select-String -Path C:\temp\out\logic-stability-v91.txt -Pattern 'ALIYVO_V91_LOGIC_STABILITY=OK' | Out-Null

      - name: Empacotar candidato exato
        shell: pwsh
        run: |
          Compress-Archive -Path C:\temp\build\* -DestinationPath C:\temp\out\ALIYVO_BETA_GRATIS_02291.zip -Force
          Expand-Archive C:\temp\out\ALIYVO_BETA_GRATIS_02291.zip -DestinationPath C:\temp\verify -Force
          python -m py_compile C:\temp\verify\_app\main.py C:\temp\verify\_app\updater_worker.pyw
          Select-String -Path C:\temp\verify\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.91"' | Out-Null
          Select-String -Path C:\temp\verify\_app\main.py -Pattern 'setInterval\(20000\)' | Out-Null
          Select-String -Path C:\temp\verify\_app\main.py -Pattern 'def _diagnostic_scan_guard_done' | Out-Null
          if(-not (Test-Path C:\temp\verify\GERAR_DIAGNOSTICO_PARA_CHATGPT.bat)){ throw 'Coletor ausente no ZIP final' }
          $before=(Get-Content C:\temp\updater_before.txt).Trim()
          $after=(Get-FileHash C:\temp\verify\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater no ZIP final foi alterado' }

      - name: Repetir gates sobre ZIP final
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests\logic_whatsapp_turbo_v91.py C:\temp\verify\_app | Tee-Object C:\temp\out\logic-whatsapp-final-v91.txt
          if($LASTEXITCODE -ne 0){ throw 'ZIP final falhou no gate WhatsApp Turbo' }
          python C:\temp\logic_stability_v91.py C:\temp\verify\_app | Tee-Object C:\temp\out\logic-stability-final-v91.txt
          if($LASTEXITCODE -ne 0){ throw 'ZIP final falhou no gate historico' }
          Select-String -Path C:\temp\out\logic-whatsapp-final-v91.txt -Pattern 'ALIYVO_V91_WHATSAPP_TURBO=OK' | Out-Null
          Select-String -Path C:\temp\out\logic-stability-final-v91.txt -Pattern 'ALIYVO_V91_LOGIC_STABILITY=OK' | Out-Null
          $sha=(Get-FileHash C:\temp\out\ALIYVO_BETA_GRATIS_02291.zip -Algorithm SHA256).Hash
          @(
            "ALIYVO 0.22.91",
            "Base: 0.22.90",
            "WhatsApp Turbo: OK",
            "Scan pesado: 5 s -> 20 s",
            "Guard de digitacao/pagina oculta: OK",
            "Extrator em cache: OK",
            "Gate estabilidade: OK",
            "Diagnostico v90 preservado",
            "Arquitetura Assistente/WhatsApp preservada",
            "Updater preservado",
            "ZIP SHA256=$sha"
          ) | Set-Content C:\temp\out\VALIDACAO_02291.txt -Encoding UTF8

      - name: Publicar somente depois de todos os gates
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.22.91 C:\temp\out\ALIYVO_BETA_GRATIS_02291.zip C:\temp\out\VALIDACAO_02291.txt --repo "$env:GITHUB_REPOSITORY" --title "ALIYVO 0.22.91 - WhatsApp Turbo" --notes "Baseada diretamente na 0.22.90. Reduz a varredura pesada do DOM do WhatsApp de 5 s para 20 s (75% menos ciclos), reutiliza o extrator em cache e faz um guard leve antes de cada leitura: se o usuario estiver digitando ou a pagina estiver oculta, o ciclo pesado e pulado. Mantem diagnostico, CRM, lembretes, chamadas, tema, Assistente e updater. Publicada somente depois dos gates de compilacao, arquitetura, updater, logica Turbo e estabilidade, repetidos sobre o ZIP final." --latest
