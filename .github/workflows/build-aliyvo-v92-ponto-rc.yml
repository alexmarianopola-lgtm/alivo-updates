name: Build ALIYVO 0.22.92 RC1 - Controle de Ponto
on:
  push:
    branches: ['feature/ponto-aliyvo-02292']
    paths: ['trigger-v92-ponto-rc1.txt']
permissions:
  contents: write

jobs:
  testar-e-publicar-rc:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Baixar base oficial 0.22.91
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\base,C:\temp\build,C:\temp\verify,C:\temp\out,C:\temp\extverify | Out-Null
          gh release download v0.22.91 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02291.zip" --dir C:\temp\base
          Expand-Archive C:\temp\base\ALIYVO_BETA_GRATIS_02291.zip -DestinationPath C:\temp\build -Force
          if(-not (Test-Path C:\temp\build\_app\main.py)){ throw 'Base 0.22.91 invalida' }
          (Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash | Set-Content C:\temp\updater_before.txt

      - name: Aplicar modulo Controle de Ponto
        shell: pwsh
        run: |
          python patch_ponto_v92.py C:\temp\build
          python -m py_compile C:\temp\build\_app\main.py C:\temp\build\_app\aliyvo_ponto.py C:\temp\build\_app\updater_worker.pyw
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.92"' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -SimpleMatch 'from aliyvo_ponto import AliyvoPontoController' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -SimpleMatch 'self.ponto_toggle=QPushButton("🕒  Ponto")' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -SimpleMatch 'self._ponto_controller=AliyvoPontoController(self,self.ponto_toggle)' | Out-Null
          Select-String -Path C:\temp\build\_app\aliyvo_ponto.py -SimpleMatch 'self._timer.setSingleShot(True)' | Out-Null
          Select-String -Path C:\temp\build\_app\aliyvo_ponto.py -SimpleMatch 'ThreadingHTTPServer(("127.0.0.1", POINT_API_PORT), Handler)' | Out-Null
          if(-not (Test-Path C:\temp\build\EXTENSAO_PONTO_SANKHYA\manifest.json)){ throw 'Extensao de ponto ausente' }
          if(-not (Test-Path C:\temp\build\GERAR_DIAGNOSTICO_PARA_CHATGPT.bat)){ throw 'Diagnostico v90 perdido' }
          $before=(Get-Content C:\temp\updater_before.txt).Trim()
          $after=(Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater foi alterado indevidamente' }

      - name: Validar extensao Chrome
        shell: pwsh
        run: |
          python -m json.tool C:\temp\build\EXTENSAO_PONTO_SANKHYA\manifest.json | Out-Null
          node --check C:\temp\build\EXTENSAO_PONTO_SANKHYA\background.js
          node --check C:\temp\build\EXTENSAO_PONTO_SANKHYA\content.js
          node --check C:\temp\build\EXTENSAO_PONTO_SANKHYA\popup.js
          python tests\logic_ponto_extension_v92.py C:\temp\build

      - name: Gate logico do Controle de Ponto
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --disable-pip-version-check --quiet PyQt6
          python tests\logic_ponto_v92.py C:\temp\build\_app | Tee-Object C:\temp\out\logic-ponto-v92.txt
          if($LASTEXITCODE -ne 0){ throw 'Gate do Controle de Ponto falhou' }
          Select-String -Path C:\temp\out\logic-ponto-v92.txt -Pattern 'ALIYVO_V92_PONTO_LOGIC=OK' | Out-Null

      - name: Repetir gate WhatsApp Turbo da 0.22.91
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $t=Get-Content tests\logic_whatsapp_turbo_v91.py -Raw
          $t=$t.Replace("assert m.ALIYVO_VERSION=='0.22.91'","assert m.ALIYVO_VERSION=='0.22.92'")
          $t=$t.Replace('ALIYVO_V91_WHATSAPP_TURBO=OK','ALIYVO_V92_WHATSAPP_TURBO=OK')
          Set-Content C:\temp\logic_whatsapp_v92.py $t -Encoding UTF8
          python C:\temp\logic_whatsapp_v92.py C:\temp\build\_app | Tee-Object C:\temp\out\logic-whatsapp-v92.txt
          if($LASTEXITCODE -ne 0){ throw 'Gate WhatsApp Turbo herdado falhou' }
          Select-String -Path C:\temp\out\logic-whatsapp-v92.txt -Pattern 'ALIYVO_V92_WHATSAPP_TURBO=OK' | Out-Null

      - name: Repetir gate historico de estabilidade
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $t=Get-Content tests\logic_stability_v89.py -Raw
          $t=$t.Replace("assert m.ALIYVO_VERSION=='0.22.89'","assert m.ALIYVO_VERSION=='0.22.92'")
          $t=$t.Replace('self._diagnostic_timer=QTimer(self); self._diagnostic_timer.setInterval(5000)','self._diagnostic_timer=QTimer(self); self._diagnostic_timer.setInterval(20000)')
          $t=$t.Replace('ALIYVO_V89_LOGIC_STABILITY=OK','ALIYVO_V92_LOGIC_STABILITY=OK')
          Set-Content C:\temp\logic_stability_v92.py $t -Encoding UTF8
          python C:\temp\logic_stability_v92.py C:\temp\build\_app | Tee-Object C:\temp\out\logic-stability-v92.txt
          if($LASTEXITCODE -ne 0){ throw 'Gate historico de estabilidade falhou' }
          Select-String -Path C:\temp\out\logic-stability-v92.txt -Pattern 'ALIYVO_V92_LOGIC_STABILITY=OK' | Out-Null

      - name: Guardas de performance e arquitetura
        shell: pwsh
        run: |
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'self._diagnostic_timer=QTimer\(self\); self._diagnostic_timer.setInterval\(20000\)' | Out-Null
          if(Select-String -Path C:\temp\build\_app\main.py -SimpleMatch 'self._diagnostic_timer=QTimer(self); self._diagnostic_timer.setInterval(5000)' -Quiet){ throw 'Polling pesado de 5 s voltou' }
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'class WhatsAppView\(QtWebView2Widget\)' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'self.web=QWebEngineView\(self\)' | Out-Null
          if(Select-String -Path C:\temp\build\_app\main.py -Pattern 'class ChatGPTWebView\(QtWebView2Widget\)' -Quiet){ throw 'Assistente mudou indevidamente para WebView2' }
          if(Select-String -Path C:\temp\build\_app\aliyvo_ponto.py -SimpleMatch 'setInterval(' -Quiet){ throw 'Modulo de ponto ganhou polling permanente' }
          if(Select-String -Path C:\temp\build\_app\aliyvo_ponto.py -Pattern 'runJavaScript|evaluate_js|document\.' -Quiet){ throw 'Modulo de ponto nao pode consultar DOM do WhatsApp' }

      - name: Empacotar candidato RC1
        shell: pwsh
        run: |
          Compress-Archive -Path C:\temp\build\* -DestinationPath C:\temp\out\ALIYVO_BETA_GRATIS_02292_RC1.zip -Force
          Compress-Archive -Path C:\temp\build\EXTENSAO_PONTO_SANKHYA\* -DestinationPath C:\temp\out\ALIYVO_PONTO_EXTENSION_02292_RC1.zip -Force
          Expand-Archive C:\temp\out\ALIYVO_BETA_GRATIS_02292_RC1.zip -DestinationPath C:\temp\verify -Force
          Expand-Archive C:\temp\out\ALIYVO_PONTO_EXTENSION_02292_RC1.zip -DestinationPath C:\temp\extverify -Force
          python -m py_compile C:\temp\verify\_app\main.py C:\temp\verify\_app\aliyvo_ponto.py C:\temp\verify\_app\updater_worker.pyw
          Select-String -Path C:\temp\verify\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.92"' | Out-Null
          if(-not (Test-Path C:\temp\verify\EXTENSAO_PONTO_SANKHYA\manifest.json)){ throw 'Extensao ausente no ZIP final' }
          if(-not (Test-Path C:\temp\verify\LEIA-ME-PONTO-02292.txt)){ throw 'Manual de ponto ausente no ZIP final' }
          if(-not (Test-Path C:\temp\verify\GERAR_DIAGNOSTICO_PARA_CHATGPT.bat)){ throw 'Coletor diagnostico ausente no ZIP final' }
          $before=(Get-Content C:\temp\updater_before.txt).Trim()
          $after=(Get-FileHash C:\temp\verify\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater do ZIP final foi alterado' }

      - name: Repetir gates sobre ZIP final
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests\logic_ponto_v92.py C:\temp\verify\_app | Tee-Object C:\temp\out\logic-ponto-final-v92.txt
          if($LASTEXITCODE -ne 0){ throw 'ZIP final falhou no gate de ponto' }
          python tests\logic_ponto_extension_v92.py C:\temp\verify | Tee-Object C:\temp\out\logic-extension-final-v92.txt
          if($LASTEXITCODE -ne 0){ throw 'ZIP final falhou no gate da extensao' }
          python C:\temp\logic_whatsapp_v92.py C:\temp\verify\_app | Tee-Object C:\temp\out\logic-whatsapp-final-v92.txt
          if($LASTEXITCODE -ne 0){ throw 'ZIP final falhou no WhatsApp Turbo' }
          python C:\temp\logic_stability_v92.py C:\temp\verify\_app | Tee-Object C:\temp\out\logic-stability-final-v92.txt
          if($LASTEXITCODE -ne 0){ throw 'ZIP final falhou no gate historico' }
          $sha=(Get-FileHash C:\temp\out\ALIYVO_BETA_GRATIS_02292_RC1.zip -Algorithm SHA256).Hash
          $extsha=(Get-FileHash C:\temp\out\ALIYVO_PONTO_EXTENSION_02292_RC1.zip -Algorithm SHA256).Hash
          @(
            "ALIYVO 0.22.92 RC1",
            "Base oficial: 0.22.91",
            "Controle de Ponto: OK em teste logico",
            "Horarios: 07:50 / 12:08 / 13:30 / 18:00",
            "Atraso continua pendente: OK",
            "Persistencia diaria: OK",
            "Bridge localhost 127.0.0.1:17892: OK",
            "Extensao Sankhya: sintaxe/manifest OK",
            "WhatsApp Turbo 20 s: preservado",
            "Gate historico de estabilidade: OK",
            "Arquitetura WhatsApp/Assistente: preservada",
            "Updater: preservado",
            "Runtime real Ahgora/Sankhya: PENDENTE DE TESTE NO PC DO USUARIO",
            "ZIP SHA256=$sha",
            "EXTENSION SHA256=$extsha"
          ) | Set-Content C:\temp\out\VALIDACAO_02292_RC1.txt -Encoding UTF8

      - name: Publicar somente como prerelease RC
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if(gh release view v0.22.92-rc1 --repo "$env:GITHUB_REPOSITORY" *> $null){ throw 'v0.22.92-rc1 ja existe; nao sobrescrever release de teste' }
          gh release create v0.22.92-rc1 C:\temp\out\ALIYVO_BETA_GRATIS_02292_RC1.zip C:\temp\out\ALIYVO_PONTO_EXTENSION_02292_RC1.zip C:\temp\out\VALIDACAO_02292_RC1.txt --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "ALIYVO 0.22.92 RC1 - Controle de Ponto" --notes "Versao candidata baseada diretamente na 0.22.91. Adiciona Controle de Ponto no ALIYVO para 07:50, 12:08, 13:30 e 18:00, persistencia de pendencias, aviso de ajuste quando uma batida foi perdida e bridge localhost para a extensao do Chrome bloquear o Sankhya. Nao registra ponto automaticamente e nao armazena matricula/senha. WhatsApp Turbo, Assistente, diagnostico e updater foram preservados. RC nao promovida a latest: requer validacao no PC real com Ahgora e Sankhya." --prerelease