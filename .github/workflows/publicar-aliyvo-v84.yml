name: Publicar ALIYVO 0.22.84 lembrete por confirmação
on:
  push:
    paths:
      - 'trigger-v84.txt'
permissions:
  contents: write
jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar base 0.22.83
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\base,C:\temp\build,C:\temp\out | Out-Null
          gh release download v0.22.83 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02283.zip" --dir C:\temp\base
          Expand-Archive C:\temp\base\ALIYVO_BETA_GRATIS_02283.zip -DestinationPath C:\temp\build -Force
      - name: Aplicar melhoria
        shell: pwsh
        run: python patch_script_v84.py
      - name: Validar Python
        shell: pwsh
        run: |
          python -m py_compile C:\temp\build\_app\main.py
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.84"' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern "seller_confirmed" | Out-Null
      - name: Empacotar e validar ZIP final
        shell: pwsh
        run: |
          Compress-Archive -Path C:\temp\build\* -DestinationPath C:\temp\out\ALIYVO_BETA_GRATIS_02284.zip -Force
          Remove-Item -Recurse -Force C:\temp\verify -ErrorAction SilentlyContinue
          Expand-Archive C:\temp\out\ALIYVO_BETA_GRATIS_02284.zip -DestinationPath C:\temp\verify -Force
          python -m py_compile C:\temp\verify\_app\main.py
          Select-String -Path C:\temp\verify\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.84"' | Out-Null
          Select-String -Path C:\temp\verify\_app\main.py -Pattern "promessa futura" | Out-Null
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create v0.22.84 C:\temp\out\ALIYVO_BETA_GRATIS_02284.zip --repo "$env:GITHUB_REPOSITORY" --title "ALIYVO Beta Gratis 0.22.84 - lembretes por confirmação" --notes "Baseada na 0.22.83. O detector de lembretes agora entende o contexto de uma promessa futura seguida por confirmação curta do cliente. Exemplo: vendedor 'mando amanhã?' e cliente 'isso'. O ALIYVO sugere o lembrete sem salvar automaticamente. Nenhuma alteração no updater."
