name: Publish ALIYVO 0.22.96 - Ahgora Browser Session
on:
  push:
    branches: ['feature/ahgora-browser-session-02296']
    paths: ['trigger-v96-official.txt']
permissions:
  contents: write
jobs:
  test-build-publish:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar base oficial 0.22.95
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\base,C:\temp\build,C:\temp\verify,C:\temp\out | Out-Null
          gh release download v0.22.95 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02295.zip" --dir C:\temp\base
          Expand-Archive C:\temp\base\ALIYVO_BETA_GRATIS_02295.zip -DestinationPath C:\temp\build -Force
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.95"' | Out-Null
          (Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash | Set-Content C:\temp\updater_before.txt
      - name: Aplicar sessao oficial Ahgora 0.22.96
        shell: pwsh
        run: |
          python patch_ahgora_v96.py C:\temp\build
          python -m py_compile C:\temp\build\_app\main.py C:\temp\build\_app\aliyvo_ponto.py C:\temp\build\_app\updater_worker.pyw C:\temp\build\_app\update_check_worker.py
          python tests\package_ahgora_v96.py C:\temp\build
          python -m json.tool C:\temp\build\EXTENSAO_PONTO_SANKHYA\manifest.json | Out-Null
          node --check C:\temp\build\EXTENSAO_PONTO_SANKHYA\background.js
          node --check C:\temp\build\EXTENSAO_PONTO_SANKHYA\content.js
          node --check C:\temp\build\EXTENSAO_PONTO_SANKHYA\popup.js
          $before=(Get-Content C:\temp\updater_before.txt).Trim()
          $after=(Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater foi alterado indevidamente' }
      - name: Testar logica Ahgora browser-session
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
        run: |
          python -m pip install --disable-pip-version-check --quiet PyQt6 PyQt6-WebEngine cryptography
          python tests\logic_ahgora_v96.py C:\temp\build\_app | Tee-Object C:\temp\out\logic-v96.txt
          if($LASTEXITCODE -ne 0){ throw 'Gate Ahgora v96 falhou' }
          Select-String C:\temp\out\logic-v96.txt -Pattern 'ALIYVO_V96_AHGORA_BROWSER=OK' | Out-Null
      - name: Repetir gates WhatsApp e estabilidade
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $w=Get-Content tests\logic_whatsapp_turbo_v91.py -Raw
          $w=$w.Replace("assert m.ALIYVO_VERSION=='0.22.91'","assert m.ALIYVO_VERSION=='0.22.96'")
          $w=$w.Replace('ALIYVO_V91_WHATSAPP_TURBO=OK','ALIYVO_V96_WHATSAPP_TURBO=OK')
          Set-Content C:\temp\logic_whatsapp_v96.py $w -Encoding UTF8
          python C:\temp\logic_whatsapp_v96.py C:\temp\build\_app
          if($LASTEXITCODE -ne 0){ throw 'Gate WhatsApp falhou' }
          $st=Get-Content tests\logic_stability_v89.py -Raw
          $st=$st.Replace("assert m.ALIYVO_VERSION=='0.22.89'","assert m.ALIYVO_VERSION=='0.22.96'")
          $st=$st.Replace('self._diagnostic_timer=QTimer(self); self._diagnostic_timer.setInterval(5000)','self._diagnostic_timer=QTimer(self); self._diagnostic_timer.setInterval(20000)')
          $st=$st.Replace('ALIYVO_V89_LOGIC_STABILITY=OK','ALIYVO_V96_LOGIC_STABILITY=OK')
          Set-Content C:\temp\logic_stability_v96.py $st -Encoding UTF8
          python C:\temp\logic_stability_v96.py C:\temp\build\_app
          if($LASTEXITCODE -ne 0){ throw 'Gate estabilidade falhou' }
      - name: Guardas de arquitetura e seguranca
        shell: pwsh
        run: |
          $m='C:\temp\build\_app\aliyvo_ponto.py'
          Select-String -Path $m -Pattern 'QWebEngineProfile' -SimpleMatch | Out-Null
          Select-String -Path $m -Pattern 'ForcePersistentCookies' -SimpleMatch | Out-Null
          Select-String -Path $m -Pattern 'https://www.ahgora.com.br/externo/index/' -SimpleMatch | Out-Null
          Select-String -Path $m -Pattern 'https://app.ahgora.com.br/api-espelho/apuracao/' -SimpleMatch | Out-Null
          Select-String -Path $m -Pattern 'JÁ ENTREI — SINCRONIZAR' -SimpleMatch | Out-Null
          Select-String -Path $m -Pattern 'CryptProtectData' -SimpleMatch | Out-Null
          Select-String -Path $m -Pattern 'QMessageBox.question' -SimpleMatch | Out-Null
          if(Select-String -Path $m -Pattern 'setInterval(' -SimpleMatch -Quiet){ throw 'Polling Qt permanente no modulo de ponto' }
          Select-String C:\temp\build\_app\main.py -Pattern 'class WhatsAppView\(QtWebView2Widget\)' | Out-Null
          Select-String C:\temp\build\_app\main.py -Pattern 'self.web=QWebEngineView\(self\)' | Out-Null
          Select-String C:\temp\build\_app\main.py -Pattern 'self._diagnostic_timer=QTimer\(self\); self._diagnostic_timer.setInterval\(20000\)' | Out-Null
      - name: Empacotar e repetir testes
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
        run: |
          Compress-Archive -Path C:\temp\build\* -DestinationPath C:\temp\out\ALIYVO_BETA_GRATIS_02296.zip -Force
          Expand-Archive C:\temp\out\ALIYVO_BETA_GRATIS_02296.zip -DestinationPath C:\temp\verify -Force
          python -m py_compile C:\temp\verify\_app\main.py C:\temp\verify\_app\aliyvo_ponto.py C:\temp\verify\_app\updater_worker.pyw
          python tests\package_ahgora_v96.py C:\temp\verify
          python tests\logic_ahgora_v96.py C:\temp\verify\_app
          if($LASTEXITCODE -ne 0){ throw 'ZIP final falhou no gate Ahgora' }
          python C:\temp\logic_whatsapp_v96.py C:\temp\verify\_app
          if($LASTEXITCODE -ne 0){ throw 'ZIP final falhou no gate WhatsApp' }
          python C:\temp\logic_stability_v96.py C:\temp\verify\_app
          if($LASTEXITCODE -ne 0){ throw 'ZIP final falhou no gate estabilidade' }
          $before=(Get-Content C:\temp\updater_before.txt).Trim()
          $after=(Get-FileHash C:\temp\verify\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater do ZIP final foi alterado' }
          $sha=(Get-FileHash C:\temp\out\ALIYVO_BETA_GRATIS_02296.zip -Algorithm SHA256).Hash.ToLower()
          @(
            'ALIYVO 0.22.96 - ATUALIZACAO OFICIAL',
            'Sincronizacao passa a reutilizar sessao oficial do portal Ahgora',
            'Login e feito visualmente no proprio site dentro do ALIYVO',
            'Cookies persistem em LOCALAPPDATA/ALIYVO/ahgora_browser_profile',
            'Nao reproduz mais login HTTP do espelho',
            'Batida continua exigindo clique + confirmacao',
            'WhatsApp Turbo/estabilidade/updater preservados',
            "SHA256=$sha"
          ) | Set-Content C:\temp\out\VALIDACAO_02296.txt -Encoding UTF8
      - name: Publicar como latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if(gh release view v0.22.96 --repo "$env:GITHUB_REPOSITORY" *> $null){ throw 'v0.22.96 ja existe' }
          gh release create v0.22.96 C:\temp\out\ALIYVO_BETA_GRATIS_02296.zip C:\temp\out\VALIDACAO_02296.txt --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "ALIYVO 0.22.96 - Vinculo oficial Ahgora" --notes "Corrige a sincronizacao do ponto substituindo a tentativa de reproduzir o login por uma sessao real do portal oficial Ahgora dentro do ALIYVO. O usuario vincula o portal uma vez, os cookies ficam persistidos localmente, e o Controle de Ponto consulta o espelho atual usando essa sessao. Perfis do WhatsApp e updater permanecem preservados. Disponivel pelo painel Atualizacoes." --latest