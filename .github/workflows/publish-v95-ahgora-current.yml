name: Publish ALIYVO 0.22.95 - Ahgora Current Flow
on:
  push:
    branches: ['feature/ahgora-modern-02295']
    paths: ['trigger-v95-official.txt']
permissions:
  contents: write
jobs:
  test-build-publish:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar base oficial 0.22.94
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\base,C:\temp\build,C:\temp\verify,C:\temp\out | Out-Null
          gh release download v0.22.94 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02294.zip" --dir C:\temp\base
          Expand-Archive C:\temp\base\ALIYVO_BETA_GRATIS_02294.zip -DestinationPath C:\temp\build -Force
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.94"' | Out-Null
          (Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash | Set-Content C:\temp\updater_before.txt
      - name: Aplicar Ahgora atual 0.22.95
        shell: pwsh
        run: |
          python patch_ahgora_v95.py C:\temp\build
          python -m py_compile C:\temp\build\_app\main.py C:\temp\build\_app\aliyvo_ponto.py C:\temp\build\_app\updater_worker.pyw C:\temp\build\_app\update_check_worker.py
          python tests\package_ahgora_v95.py C:\temp\build
          python -m json.tool C:\temp\build\EXTENSAO_PONTO_SANKHYA\manifest.json | Out-Null
          node --check C:\temp\build\EXTENSAO_PONTO_SANKHYA\background.js
          node --check C:\temp\build\EXTENSAO_PONTO_SANKHYA\content.js
          node --check C:\temp\build\EXTENSAO_PONTO_SANKHYA\popup.js
          $before=(Get-Content C:\temp\updater_before.txt).Trim()
          $after=(Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater foi alterado indevidamente' }
      - name: Testar logica moderna do Ahgora
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --disable-pip-version-check --quiet PyQt6 cryptography
          python tests\logic_ahgora_v95.py C:\temp\build\_app | Tee-Object C:\temp\out\logic-v95.txt
          if($LASTEXITCODE -ne 0){ throw 'Gate Ahgora v95 falhou' }
          Select-String C:\temp\out\logic-v95.txt -Pattern 'ALIYVO_V95_AHGORA_CURRENT=OK' | Out-Null
      - name: Repetir gates WhatsApp e estabilidade
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $w=Get-Content tests\logic_whatsapp_turbo_v91.py -Raw
          $w=$w.Replace("assert m.ALIYVO_VERSION=='0.22.91'","assert m.ALIYVO_VERSION=='0.22.95'")
          $w=$w.Replace('ALIYVO_V91_WHATSAPP_TURBO=OK','ALIYVO_V95_WHATSAPP_TURBO=OK')
          Set-Content C:\temp\logic_whatsapp_v95.py $w -Encoding UTF8
          python C:\temp\logic_whatsapp_v95.py C:\temp\build\_app
          if($LASTEXITCODE -ne 0){ throw 'Gate WhatsApp falhou' }
          $st=Get-Content tests\logic_stability_v89.py -Raw
          $st=$st.Replace("assert m.ALIYVO_VERSION=='0.22.89'","assert m.ALIYVO_VERSION=='0.22.95'")
          $st=$st.Replace('self._diagnostic_timer=QTimer(self); self._diagnostic_timer.setInterval(5000)','self._diagnostic_timer=QTimer(self); self._diagnostic_timer.setInterval(20000)')
          $st=$st.Replace('ALIYVO_V89_LOGIC_STABILITY=OK','ALIYVO_V95_LOGIC_STABILITY=OK')
          Set-Content C:\temp\logic_stability_v95.py $st -Encoding UTF8
          python C:\temp\logic_stability_v95.py C:\temp\build\_app
          if($LASTEXITCODE -ne 0){ throw 'Gate estabilidade falhou' }
      - name: Guardas de arquitetura e seguranca
        shell: pwsh
        run: |
          $m=C:\temp\build\_app\aliyvo_ponto.py
          if(Select-String $m -SimpleMatch 'externo/getApuracao' -Quiet){ throw 'Endpoint deprecated ainda presente' }
          Select-String $m -SimpleMatch 'https://app.ahgora.com.br/api-espelho/apuracao/' | Out-Null
          Select-String $m -SimpleMatch 'activateDeviceOnLineByLoginAndPassword' | Out-Null
          Select-String $m -SimpleMatch '_rsa_pkcs1_v15_encrypt_b64' | Out-Null
          Select-String $m -SimpleMatch 'QMessageBox.question' | Out-Null
          Select-String $m -SimpleMatch 'CryptProtectData' | Out-Null
          if(Select-String $m -SimpleMatch 'setInterval(' -Quiet){ throw 'Polling Qt permanente no modulo de ponto' }
          if(Select-String $m -Pattern 'runJavaScript|evaluate_js|document\.' -Quiet){ throw 'Modulo de ponto tocou no DOM do WhatsApp' }
          Select-String C:\temp\build\_app\main.py -Pattern 'class WhatsAppView\(QtWebView2Widget\)' | Out-Null
          Select-String C:\temp\build\_app\main.py -Pattern 'self.web=QWebEngineView\(self\)' | Out-Null
          Select-String C:\temp\build\_app\main.py -Pattern 'self._diagnostic_timer=QTimer\(self\); self._diagnostic_timer.setInterval\(20000\)' | Out-Null
      - name: Empacotar e repetir testes
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Compress-Archive -Path C:\temp\build\* -DestinationPath C:\temp\out\ALIYVO_BETA_GRATIS_02295.zip -Force
          Expand-Archive C:\temp\out\ALIYVO_BETA_GRATIS_02295.zip -DestinationPath C:\temp\verify -Force
          python -m py_compile C:\temp\verify\_app\main.py C:\temp\verify\_app\aliyvo_ponto.py C:\temp\verify\_app\updater_worker.pyw
          python tests\package_ahgora_v95.py C:\temp\verify
          python tests\logic_ahgora_v95.py C:\temp\verify\_app
          if($LASTEXITCODE -ne 0){ throw 'ZIP final falhou no gate Ahgora' }
          python C:\temp\logic_whatsapp_v95.py C:\temp\verify\_app
          if($LASTEXITCODE -ne 0){ throw 'ZIP final falhou no gate WhatsApp' }
          python C:\temp\logic_stability_v95.py C:\temp\verify\_app
          if($LASTEXITCODE -ne 0){ throw 'ZIP final falhou no gate estabilidade' }
          $before=(Get-Content C:\temp\updater_before.txt).Trim()
          $after=(Get-FileHash C:\temp\verify\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater do ZIP final foi alterado' }
          $sha=(Get-FileHash C:\temp\out\ALIYVO_BETA_GRATIS_02295.zip -Algorithm SHA256).Hash.ToLower()
          @(
            'ALIYVO 0.22.95 - ATUALIZACAO OFICIAL',
            'Remove endpoint Ahgora deprecated getApuracao',
            'Sincronizacao usa API atual /api-espelho/apuracao/',
            'Login web Ahgora com cookie de sessao',
            'Batida Online atual: device + token + RSA PKCS#1 v1.5',
            'Batida exige clique + confirmacao',
            'Credenciais continuam em Windows DPAPI',
            'WhatsApp Turbo e estabilidade preservados',
            'Updater preservado; perfis em LOCALAPPDATA preservados',
            'Teste real com conta do usuario necessario para confirmar regras da empresa',
            "SHA256=$sha"
          ) | Set-Content C:\temp\out\VALIDACAO_02295.txt -Encoding UTF8
      - name: Publicar como latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if(gh release view v0.22.95 --repo "$env:GITHUB_REPOSITORY" *> $null){ throw 'v0.22.95 ja existe' }
          gh release create v0.22.95 C:\temp\out\ALIYVO_BETA_GRATIS_02295.zip C:\temp\out\VALIDACAO_02295.txt --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "ALIYVO 0.22.95 - Ahgora atual" --notes "Corrige o erro deprecated do Ahgora. A sincronizacao deixa de usar /externo/getApuracao e passa para a API atual /api-espelho/apuracao/ da sessao web. A Batida Online integrada tambem foi atualizada para o fluxo atual de dispositivo, token e senha criptografada por RSA; cada batida exige clique e confirmacao. Perfis do WhatsApp, configuracoes locais e updater sao preservados. Disponivel pelo painel Atualizacoes do ALIYVO." --latest