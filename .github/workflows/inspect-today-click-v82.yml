name: Inspecionar painel Hoje v0.22.82
on:
  push:
    paths: ['trigger-inspect-today-v82.txt']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar release 0.22.82
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\base,C:\temp\build | Out-Null
          gh release download v0.22.82 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02282.zip" --dir C:\temp\base
          Expand-Archive C:\temp\base\ALIYVO_BETA_GRATIS_02282.zip -DestinationPath C:\temp\build -Force
      - name: Mostrar metodos relacionados
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          @'
          import ast
          from pathlib import Path
          p=Path(r'C:\temp\build\_app\main.py')
          s=p.read_text(encoding='utf-8',errors='ignore')
          lines=s.splitlines(); tree=ast.parse(s)
          keys=('today','hoje','wait','esper','chat','conversation','conversa','contact','contato','crm','diagnostic')
          for n in ast.walk(tree):
              if isinstance(n,(ast.FunctionDef,ast.ClassDef)) and any(k in n.name.lower() for k in keys):
                  print('\n###',type(n).__name__,n.name,n.lineno,getattr(n,'end_lineno',n.lineno))
                  if isinstance(n,ast.FunctionDef):
                      a=max(0,n.lineno-1); b=min(len(lines),getattr(n,'end_lineno',n.lineno))
                      if b-a <= 180:
                          for i in range(a,b): print(f'{i+1:05d}: '+lines[i].encode('ascii','backslashreplace').decode('ascii'))
          '@ | python -
