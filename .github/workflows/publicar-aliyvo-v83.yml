name: Publicar ALIYVO 0.22.83 clientes esperando clicaveis
on:
  push:
    paths: ['trigger-v83.txt']
permissions:
  contents: write
jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar base 0.22.82
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\base,C:\temp\build | Out-Null
          gh release download v0.22.82 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02282.zip" --dir C:\temp\base
          Expand-Archive C:\temp\base\ALIYVO_BETA_GRATIS_02282.zip -DestinationPath C:\temp\build -Force
          $env:UPDATER_SHA=(Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash
          $env:UPDATER_SHA | Out-File C:\temp\updater_sha.txt -Encoding ascii
      - name: Aplicar somente ajuste do painel Hoje
        shell: pwsh
        run: |
          python patch_today_click_v83.py C:\temp\build
          python -m py_compile C:\temp\build\_app\main.py C:\temp\build\_app\updater_worker.pyw
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.83"' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'Clique em um cliente para abrir a conversa' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern '_attendance_open_chat\(client\)' | Out-Null
          $before=(Get-Content C:\temp\updater_sha.txt -Raw).Trim()
          $after=(Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'O updater foi alterado sem querer' }
      - name: Empacotar e validar ZIP final
        shell: pwsh
        run: |
          Compress-Archive -Path C:\temp\build\* -DestinationPath C:\temp\ALIYVO_BETA_GRATIS_02283.zip -Force
          Remove-Item -Recurse -Force C:\temp\verify -ErrorAction SilentlyContinue
          Expand-Archive C:\temp\ALIYVO_BETA_GRATIS_02283.zip -DestinationPath C:\temp\verify -Force
          python -m py_compile C:\temp\verify\_app\main.py C:\temp\verify\_app\updater_worker.pyw
          Select-String -Path C:\temp\verify\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.83"' | Out-Null
          Select-String -Path C:\temp\verify\_app\main.py -Pattern 'QPushButton:hover\{background:#d8ecff' | Out-Null
          $before=(Get-Content C:\temp\updater_sha.txt -Raw).Trim()
          $after=(Get-FileHash C:\temp\verify\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater final diferente da 0.22.82' }
          Write-Host 'VALIDACAO 0.22.83: OK'
      - name: Publicar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.22.83 C:\temp\ALIYVO_BETA_GRATIS_02283.zip --repo "$env:GITHUB_REPOSITORY" --title "ALIYVO Beta Gratis 0.22.83 - clientes esperando clicáveis" --notes "Baseada na 0.22.82. No painel Hoje, os cartões de CLIENTES ESPERANDO agora são clicáveis: ao clicar, o painel fecha e o ALIYVO tenta abrir a conversa correspondente no WhatsApp usando a função de navegação já existente. Inclui indicação visual e efeito ao passar o mouse. Nenhuma mudança no mecanismo de atualização; updater preservado exatamente da 0.22.82." --latest
