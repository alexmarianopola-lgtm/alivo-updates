name: Inspecionar updater v61
on:
  push:
    paths:
      - 'trigger-inspecionar-updater-v61.txt'
permissions:
  contents: read
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar 0.22.72 e localizar atualizador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/base /tmp/app
          gh release download v0.22.72 --repo "$GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02272.zip" --dir /tmp/base
          unzip -q /tmp/base/ALIYVO_BETA_GRATIS_02272.zip -d /tmp/app
          python - <<'PY'
          import ast,pathlib
          p=pathlib.Path('/tmp/app/_app/main.py')
          s=p.read_text(encoding='utf-8'); t=ast.parse(s); lines=s.splitlines()
          c=next(n for n in t.body if isinstance(n,ast.ClassDef) and n.name=='MainWindow')
          for fn in c.body:
              if isinstance(fn,ast.FunctionDef):
                  n=fn.name.lower()
                  if any(k in n for k in ['update','atualiz','release','download','restart','relaunch']):
                      print('\n###',fn.name)
                      print('\n'.join(lines[fn.lineno-1:fn.end_lineno]))
          PY
          echo '--- arquivos do pacote ---'
          find /tmp/app -maxdepth 2 -type f | sort | head -200
