name: Inspecionar lembretes IA v51
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspecionar-lembretes-ai-v51.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect reminders and AI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/app /tmp/z && mkdir -p /tmp/app /tmp/z
          gh release download v0.22.64 --repo "$GITHUB_REPOSITORY" --pattern 'ALIYVO_BETA_GRATIS_*.zip' --dir /tmp/z
          unzip -q "$(find /tmp/z -name '*.zip' | head -n1)" -d /tmp/app
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/app/_app/main.py')
          s=p.read_text(encoding='utf-8',errors='ignore').splitlines()
          terms=['lembrete','reminder','QDateTimeEdit','QTimeEdit','_ai_client_profile','_ai_build_context','_ai_prompt','_ai_observer_dialog']
          hits=[]
          for i,line in enumerate(s,1):
              low=line.lower()
              if any(t.lower() in low for t in terms): hits.append(i)
          print('HITS', hits[:500])
          ranges=[]
          for i in hits:
              if not ranges or i-ranges[-1][1]>8:ranges.append([max(1,i-8),min(len(s),i+35)])
              else:ranges[-1][1]=min(len(s),max(ranges[-1][1],i+35))
          for a,b in ranges[:35]:
              print(f'\n=== {a}-{b} ===')
              for n in range(a,b+1): print(f'{n}: {s[n-1]}')
          PY