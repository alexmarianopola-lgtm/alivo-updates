name: Validar v92 publicada
on:
  push:
    paths:
      - ".github/workflows/validar-v92-publicada.yml"
permissions:
  contents: write
jobs:
  validar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar ZIP publicado
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\v92,C:\temp\v92\app | Out-Null
          gh release download v0.22.92 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02292.zip" --dir C:\temp\v92
          Expand-Archive C:\temp\v92\ALIYVO_BETA_GRATIS_02292.zip -DestinationPath C:\temp\v92\app -Force
          python -m py_compile C:\temp\v92\app\_app\main.py C:\temp\v92\app\_app\updater_worker.pyw
      - name: Testar pacote publicado
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --disable-pip-version-check --quiet PyQt6
          python tests\logic_crm_assistido_v92.py C:\temp\v92\app\_app | Tee-Object C:\temp\crm.txt
          if($LASTEXITCODE -ne 0){ throw 'CRM v92 publicado falhou' }
          $t=Get-Content tests\logic_whatsapp_turbo_v91.py -Raw
          $t=$t.Replace("assert m.ALIYVO_VERSION=='0.22.91'","assert m.ALIYVO_VERSION=='0.22.92'")
          $t=$t.Replace('ALIYVO_V91_WHATSAPP_TURBO=OK','ALIYVO_V92_WHATSAPP_TURBO=OK')
          Set-Content C:\temp\whatsapp_v92.py $t -Encoding UTF8
          python C:\temp\whatsapp_v92.py C:\temp\v92\app\_app | Tee-Object C:\temp\wa.txt
          if($LASTEXITCODE -ne 0){ throw 'WhatsApp Turbo publicado falhou' }
          $sha=(Get-FileHash C:\temp\v92\ALIYVO_BETA_GRATIS_02292.zip -Algorithm SHA256).Hash.ToLower()
          @(
            "ALIYVO 0.22.92 PUBLICADA = OK",
            "CRM_STATUS_COMERCIAL=OK",
            "CRM_PROXIMA_ACAO=OK",
            "CRM_PENDENCIA=OK",
            "CRM_SEM_NOVO_SCANNER=OK",
            "WHATSAPP_TURBO_PRESERVADO=OK",
            "ZIP_SHA256=$sha"
          ) | Set-Content validacao_v92_publicada.txt -Encoding UTF8
      - name: Registrar validacao
        shell: pwsh
        run: |
          git config user.name "aliyvo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add validacao_v92_publicada.txt
          git commit -m "test: validar ZIP publicado da v0.22.92"
          git push
