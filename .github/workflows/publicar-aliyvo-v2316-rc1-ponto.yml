name: Publicar ALIYVO 0.23.16 RC1 Ponto Tardio
on:
  push:
    paths:
      - 'trigger-v2316-rc1.txt'
permissions:
  contents: write
jobs:
  testar-e-publicar:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar base 0.23.15
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\base,C:\temp\build,C:\temp\verify,C:\temp\out | Out-Null
          gh release download v0.23.15 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02315.zip" --dir C:\temp\base
          Expand-Archive C:\temp\base\ALIYVO_BETA_GRATIS_02315.zip -DestinationPath C:\temp\build -Force
          if(-not (Test-Path C:\temp\build\_app\main.py)){ throw 'Base 0.23.15 invalida' }
          if(-not (Test-Path C:\temp\build\_app\aliyvo_ponto.py)){ throw 'Modulo de ponto ausente' }
          (Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash | Set-Content C:\temp\updater_before.txt
      - name: Aplicar correcao
        shell: pwsh
        run: |
          python patch_ponto_late_sync_v2316.py C:\temp\build
          python -m py_compile C:\temp\build\_app\main.py C:\temp\build\_app\aliyvo_ponto.py C:\temp\build\_app\updater_worker.pyw
          python tests\logic_ponto_late_sync_v2316.py C:\temp\build\_app
          $before=(Get-Content C:\temp\updater_before.txt).Trim()
          $after=(Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater foi alterado sem necessidade' }
      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet PyQt6 PyQt6-WebEngine pyspellchecker qtwebview2==0.5.0 qtpy pythonnet
      - name: Teste real de abertura
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          $env:QTWEBENGINE_DISABLE_SANDBOX='1'
          $proc=Start-Process -FilePath python -ArgumentList 'C:\temp\build\_app\Aliyvo.pyw' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 8
          if($proc.HasExited -and $proc.ExitCode -ne 0){ throw "ALIYVO encerrou na inicializacao com codigo $($proc.ExitCode)" }
          if(-not $proc.HasExited){ Stop-Process -Id $proc.Id -Force }
          Write-Host 'STARTUP_SMOKE_TEST=OK'
      - name: Empacotar e validar RC
        shell: pwsh
        run: |
          Compress-Archive -Path C:\temp\build\* -DestinationPath C:\temp\out\ALIYVO_BETA_GRATIS_02316_RC1.zip -Force
          Expand-Archive C:\temp\out\ALIYVO_BETA_GRATIS_02316_RC1.zip -DestinationPath C:\temp\verify -Force
          python -m py_compile C:\temp\verify\_app\main.py C:\temp\verify\_app\aliyvo_ponto.py
          python tests\logic_ponto_late_sync_v2316.py C:\temp\verify\_app
          $main=Get-Content C:\temp\verify\_app\main.py -Raw
          if($main -notmatch 'ALIYVO_VERSION = "0.23.16"'){ throw 'Versao interna incorreta' }
          $sha=(Get-FileHash C:\temp\out\ALIYVO_BETA_GRATIS_02316_RC1.zip -Algorithm SHA256).Hash.ToLower()
          @(
            'ALIYVO 0.23.16 RC1 - PONTO TARDIO',
            'Base: 0.23.15',
            'Batida tardia continua confirmada pelo horario real do Ahgora: OK',
            'Sessao web persistida passa a permitir sincronizacao automatica: OK',
            'Dialogo Ahgora tenta sincronizar assim que portal autenticado abre: OK',
            'Updater preservado: OK',
            'Startup smoke test: OK',
            'Runtime com sessao real Ahgora: PENDENTE DE TESTE NO PC',
            "ZIP_SHA256=$sha"
          ) | Set-Content C:\temp\out\VALIDACAO_02316_RC1.txt -Encoding UTF8
      - name: Publicar RC sem promover latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.23.16-rc1 C:\temp\out\ALIYVO_BETA_GRATIS_02316_RC1.zip C:\temp\out\VALIDACAO_02316_RC1.txt --repo "$env:GITHUB_REPOSITORY" --title "ALIYVO 0.23.16 RC1 - Ponto Tardio" --notes "RC para corrigir o caso em que existe batida real atrasada no Ahgora, mas o ALIYVO continua mostrando ponto pendente. A sessao web vinculada agora tambem dispara sincronizacao automatica; uma batida real como 08:16 confirma a entrada das 07:50 e exibe o atraso sem tratar como ausencia. Nao promovida a latest ate teste no PC real." --prerelease
