name: Publicar ALIYVO 0.22.80 updater limpo
on:
  push:
    paths: ['trigger-v80.txt']
permissions:
  contents: write
jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar base estavel 0.22.72
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\base,C:\temp\build | Out-Null
          gh release download v0.22.72 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02272.zip" --dir C:\temp\base
          Expand-Archive C:\temp\base\ALIYVO_BETA_GRATIS_02272.zip -DestinationPath C:\temp\build -Force
      - name: Aplicar somente correcoes do atualizador
        shell: pwsh
        run: |
          python patch_updater_clean_v80.py C:\temp\build
          python -m py_compile C:\temp\build\_app\main.py C:\temp\build\_app\updater_worker.pyw
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.80"' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'QTimer.singleShot\(500,QApplication.instance\(\).quit\)' | Out-Null
          Select-String -Path C:\temp\build\_app\updater_worker.pyw -Pattern 'taskkill' | Out-Null
      - name: Testar atualizador completo no Windows
        shell: pwsh
        run: |
          $test='C:\temp\update-test'
          $install=Join-Path $test 'install'
          $payload=Join-Path $test 'payload'
          New-Item -ItemType Directory -Force -Path (Join-Path $install '_app'),(Join-Path $payload '_app') | Out-Null
          Copy-Item C:\temp\build\_app\updater_worker.pyw (Join-Path $install '_app\updater_worker.pyw')
          Set-Content (Join-Path $install '_app\old.txt') 'OLD' -Encoding ascii
          Set-Content (Join-Path $payload '_app\old.txt') 'NEW' -Encoding ascii
          @'
          from pathlib import Path
          Path(__file__).with_name('restart_ok.txt').write_text('OK',encoding='utf-8')
          '@ | Set-Content (Join-Path $payload '_app\Aliyvo.pyw') -Encoding utf8
          Compress-Archive -Path (Join-Path $payload '*') -DestinationPath (Join-Path $test 'update.zip') -Force
          $zipPath=Join-Path $test 'update.zip'
          $sha=(Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLower()
          $parent=Start-Process python -ArgumentList '-c','import time;time.sleep(2)' -PassThru -WindowStyle Hidden
          $pending=@{
            version='9.9.9';
            download_url=$zipPath;
            sha256=$sha;
            install_root=$install;
            launch_path=(Join-Path $install '_app\Aliyvo.pyw');
            pid=$parent.Id
          } | ConvertTo-Json
          $pendingPath=Join-Path $test 'pending.json'
          Set-Content $pendingPath $pending -Encoding utf8
          python (Join-Path $install '_app\updater_worker.pyw') $pendingPath
          Start-Sleep -Seconds 4
          if((Get-Content (Join-Path $install '_app\old.txt') -Raw).Trim() -ne 'NEW'){ throw 'worker nao substituiu arquivos' }
          if(-not (Test-Path (Join-Path $install '_app\restart_ok.txt'))){ throw 'worker nao reiniciou launcher' }
          Write-Host 'TESTE COMPLETO DO ATUALIZADOR: OK'
      - name: Empacotar e validar
        shell: pwsh
        run: |
          Compress-Archive -Path C:\temp\build\* -DestinationPath C:\temp\ALIYVO_BETA_GRATIS_02280.zip -Force
          Remove-Item -Recurse -Force C:\temp\verify -ErrorAction SilentlyContinue
          Expand-Archive C:\temp\ALIYVO_BETA_GRATIS_02280.zip -DestinationPath C:\temp\verify -Force
          python -m py_compile C:\temp\verify\_app\main.py C:\temp\verify\_app\updater_worker.pyw
          Select-String -Path C:\temp\verify\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.80"' | Out-Null
      - name: Publicar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.22.80 C:\temp\ALIYVO_BETA_GRATIS_02280.zip --repo "$env:GITHUB_REPOSITORY" --title "ALIYVO Beta Gratis 0.22.80 - base estavel com atualizador corrigido" --notes "Baseada exatamente na 0.22.72. Mantém as funções daquela versão e corrige somente o mecanismo de atualização automática: encerra o aplicativo inteiro antes da troca e força o encerramento da árvore do processo antigo se ele ficar preso. O fluxo de atualização foi simulado e validado no Windows antes da publicação." --latest
