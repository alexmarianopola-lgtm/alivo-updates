name: Publicar ALIYVO 0.23.46

on:
  push:
    paths:
      - '.github/workflows/publicar-aliyvo-02346.yml'
      - 'source/v0.23.46/**'
      - 'tests/test_call_quota_v2346.py'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Baixar versão base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force base,build,out | Out-Null
          gh release download v0.23.45 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_02345.zip" --dir base
          if ($LASTEXITCODE -ne 0) { throw "Base 0.23.45 não baixada" }
          Expand-Archive base/ALIYVO_02345.zip build -Force

      - name: Integrar controle econômico de ligações
        shell: pwsh
        run: |
          python -c "from pathlib import Path; paths=[Path('source/v0.23.46/main.py.patch'),Path('source/v0.23.46/aliyvo_call_ai.py.patch'),Path('source/v0.23.46/aliyvo_call_quota.py.patch'),Path('build/_app/main.py'),Path('build/_app/aliyvo_call_ai.py'),Path('build/_app/aliyvo_call_quota.py')]; [p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n')) for p in paths]"
          foreach ($patch in @('main.py.patch','aliyvo_call_ai.py.patch','aliyvo_call_quota.py.patch')) {
            git apply --check --directory=build "source/v0.23.46/$patch"
            if ($LASTEXITCODE -ne 0) { throw "Patch incompatível: $patch" }
            git apply --directory=build "source/v0.23.46/$patch"
            if ($LASTEXITCODE -ne 0) { throw "Patch falhou: $patch" }
          }

      - name: Validar cota, retomada e código
        shell: pwsh
        run: |
          $env:ALIYVO_TEST_APP_DIR=(Resolve-Path 'build/_app').Path
          python -m unittest tests/test_call_quota_v2346.py -v
          if ($LASTEXITCODE -ne 0) { throw "Testes da cota de ligações falharam" }
          python -m compileall -q build/_app
          if ($LASTEXITCODE -ne 0) { throw "Compilação do aplicativo falhou" }
          python -c "import ast,pathlib; m=pathlib.Path('build/_app/main.py').read_text(encoding='utf-8'); c=pathlib.Path('build/_app/aliyvo_call_ai.py').read_text(encoding='utf-8'); q=pathlib.Path('build/_app/aliyvo_call_quota.py').read_text(encoding='utf-8'); ast.parse(m);ast.parse(c);ast.parse(q);assert '0.23.46' in m;assert 'operation_id=call_id' in c;assert 'aguardando_cota' in c;assert 'class QuotaExceeded' in q"
          if ($LASTEXITCODE -ne 0) { throw "Integração final incompleta" }

      - name: Empacotar atualização
        shell: pwsh
        run: |
          python -c "import pathlib,zipfile; root=pathlib.Path('build'); z=zipfile.ZipFile('out/ALIYVO_02346.zip','w',zipfile.ZIP_DEFLATED); [z.write(p,p.relative_to(root)) for p in root.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.name!='soma_catalog.sqlite']; z.close()"
          python -c "import zipfile; z=zipfile.ZipFile('out/ALIYVO_02346.zip'); assert z.testzip() is None; s=z.read('_app/main.py').decode('utf-8'); c=z.read('_app/aliyvo_call_ai.py').decode('utf-8'); assert '0.23.46' in s; assert 'aguardando_cota' in c"
          if ($LASTEXITCODE -ne 0) { throw "Pacote final inválido" }
          $sha=(Get-FileHash out/ALIYVO_02346.zip -Algorithm SHA256).Hash.ToLower()
          "ALIYVO 0.23.46. Corrige a limitação econômica da análise de ligações: novas tentativas da mesma ligação não descontam a cota outra vez; ao atingir o limite, o áudio permanece salvo e a ligação fica como aguardando cota, sem erro falso. O painel mostra o consumo mensal. Sem escuta por IA ao vivo. Testes, sintaxe e pacote verificados. SHA256: $sha" | Set-Content out/VALIDACAO_02346.txt

      - name: Publicar versão 0.23.46
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.23.46 --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.23.46 out/ALIYVO_02346.zip out/VALIDACAO_02346.txt --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            gh release create v0.23.46 out/ALIYVO_02346.zip out/VALIDACAO_02346.txt --repo "$env:GITHUB_REPOSITORY" --title "ALIYVO 0.23.46 - Ligações sem erro falso de cota" --notes "A gravação continua local e sem IA ao vivo. Reprocessar a mesma ligação não consome novamente a cota local. Quando o limite econômico mensal for alcançado, a ligação deixa de aparecer como erro: o áudio fica salvo como aguardando cota para reprocessamento no mês seguinte. O painel agora mostra o uso mensal."
          }
          if ($LASTEXITCODE -ne 0) { throw "Publicação falhou" }
          gh release edit v0.23.46 --repo "$env:GITHUB_REPOSITORY" --latest
          if ($LASTEXITCODE -ne 0) { throw "Não foi possível marcar a versão como mais recente" }
