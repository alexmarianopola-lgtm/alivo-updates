name: Inspecionar WhatsApp loaded v56

on:
  push:
    paths:
      - ".github/workflows/inspecionar-whatsapp-loaded-v56.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspecionar handlers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/base /tmp/app && mkdir -p /tmp/base /tmp/app
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_*.zip" --dir /tmp/base
          unzip -q "$(find /tmp/base -name '*.zip' | head -n1)" -d /tmp/app
          echo '=== ON WHATSAPP LOADED ==='
          n=$(grep -n 'def _on_whatsapp_loaded' /tmp/app/_app/main.py | head -n1 | cut -d: -f1 || true)
          if [ -n "$n" ]; then sed -n "$((n-50)),$((n+150))p" /tmp/app/_app/main.py; fi
          echo '=== AUDIO CALLBACKS ==='
          grep -nE 'audio_download_callback|media_download_callback' /tmp/app/_app/main.py | head -n 100
