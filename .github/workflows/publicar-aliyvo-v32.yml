name: Publicar ALIYVO v32

on:
  push:
    paths:
      - "update-v32.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ler versao
        id: meta
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open('update-v32.json',encoding='utf-8'))
          v=str(d['version']).lstrip('vV')
          a=str(d.get('asset_name') or ('ALIYVO_BETA_GRATIS_'+v.replace('.','')+'.zip'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('version='+v+'\n')
              f.write('tag=v'+v+'\n')
              f.write('asset='+a+'\n')
          PY

      - name: Baixar ultima Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/base
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "*.zip" --dir /tmp/base
          echo "BASE_ZIP=$(find /tmp/base -maxdepth 1 -type f -name '*.zip' | head -n1)" >> "$GITHUB_ENV"

      - name: Aplicar atualizacao
        run: |
          rm -rf /tmp/build && mkdir -p /tmp/build
          unzip -q "$BASE_ZIP" -d /tmp/build
          python patch_script_v32.py /tmp/build/_app/main.py
          python -m py_compile /tmp/build/_app/main.py
          cd /tmp/build
          zip -qr "/tmp/${{ steps.meta.outputs.asset }}" .

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" "/tmp/${{ steps.meta.outputs.asset }}" --repo "$GITHUB_REPOSITORY" --title "ALIYVO Beta Gratis ${{ steps.meta.outputs.version }}" --notes "Diagnostico passa a medir tres tempos: espera total do cliente, tempo ate abrir a conversa e tempo depois de abrir ate responder. Usa timestamp da mensagem do WhatsApp quando disponivel e primeiro instante do nao lido como fallback. Adiciona mais rapido/mais demorado, contagem acima de 5 e 15 minutos e ranking dos clientes que mais esperaram, preservando ligacoes e lembretes." --latest
