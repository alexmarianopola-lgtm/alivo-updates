name: Inspecionar main ALIYVO v27

on:
  push:
    paths:
      - ".github/workflows/inspecionar-main-v27.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar ultima release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/base /tmp/build
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "*.zip" --dir /tmp/base
          unzip -q "$(find /tmp/base -type f -name '*.zip' | head -n1)" -d /tmp/build
      - name: Mostrar metodos e blocos de WhatsApp
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast,re
          p=Path('/tmp/build/_app/main.py')
          s=p.read_text(encoding='utf-8',errors='ignore')
          lines=s.splitlines()
          tree=ast.parse(s)
          print('=== CLASSES / METODOS RELEVANTES ===')
          for n in ast.walk(tree):
              if isinstance(n,(ast.ClassDef,ast.FunctionDef,ast.AsyncFunctionDef)):
                  name=n.name.lower()
                  if any(k in name for k in ['main','chat','whatsapp','technical','quick','current','conversation','contact','message']):
                      print(type(n).__name__, n.name, 'line', n.lineno)
          print('=== CONTEXTO DOS PONTOS MAIS IMPORTANTES ===')
          pats=['class MainWindow','class Main','def _read_current','def read_current','def _get_current','def get_current','def _technical_analyze_current','def add_current_chat','def _open_quick_tool','self.web=WhatsAppView','self.web = WhatsAppView','self.web_host','on_add_current_chat']
          hits=[]
          for i,l in enumerate(lines):
              if any(p.lower() in l.lower() for p in pats): hits.append(i)
          chosen=set()
          for i in hits:
              for j in range(max(0,i-15),min(len(lines),i+85)): chosen.add(j)
          for j in sorted(chosen): print(f'{j+1:05d}: {lines[j]}')
          PY
