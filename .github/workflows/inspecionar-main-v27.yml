name: Inspecionar main ALIYVO v27

on:
  push:
    paths:
      - ".github/workflows/inspecionar-main-v27.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar ultima release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/base /tmp/build
          mkdir -p /tmp/base /tmp/build
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "*.zip" --dir /tmp/base
          unzip -q "$(find /tmp/base -type f -name '*.zip' | head -n1)" -d /tmp/build
      - name: Mostrar fila de atendimentos atual
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          p=Path('/tmp/build/_app/main.py')
          s=p.read_text(encoding='utf-8',errors='ignore')
          lines=s.splitlines()
          tree=ast.parse(s)
          print('=== METODOS ATTENDANCE ===')
          for n in ast.walk(tree):
              if isinstance(n,(ast.ClassDef,ast.FunctionDef)) and ('attendance' in n.name.lower() or n.name=='AliyvoAttendancePanel'):
                  print(type(n).__name__,n.name,n.lineno,getattr(n,'end_lineno',n.lineno))
          print('=== BLOCOS ===')
          ranges=[]
          for n in ast.walk(tree):
              if isinstance(n,ast.ClassDef) and n.name=='AliyvoAttendancePanel':
                  ranges.append((n.lineno,n.end_lineno))
              if isinstance(n,ast.FunctionDef) and 'attendance' in n.name.lower():
                  ranges.append((n.lineno,n.end_lineno))
          for a,b in sorted(ranges):
              print(f'--- {a}:{b} ---')
              for j in range(a-1,min(b,len(lines))): print(f'{j+1:05d}: {lines[j]}')
          PY
