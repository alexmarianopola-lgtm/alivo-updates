name: Publicar ALIYVO 0.23.33
on:
  push:
    paths: ['.github/workflows/publicar-aliyvo-02333.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar pacote e validar
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force base,build,out | Out-Null
          gh release download v0.23.22 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02322.zip" --dir base
          if ($LASTEXITCODE -ne 0) { throw "Base nao baixada" }
          Expand-Archive base/ALIYVO_BETA_GRATIS_02322.zip build -Force
          '' | Set-Content overlay.b64 -Encoding ascii
          python -c "import base64,io,zipfile,pathlib; z=zipfile.ZipFile(io.BytesIO(base64.b64decode(pathlib.Path('overlay.b64').read_text()))); assert z.testzip() is None; z.extractall('build')"
          if ($LASTEXITCODE -ne 0) { throw "Overlay invalido" }
          python -m pip install --target build/_app/audio_vendor PyAudioWPatch Pillow openpyxl PyMuPDF
          if ($LASTEXITCODE -ne 0) { throw "Dependencias indisponiveis" }
          python -m compileall -q build/_app
          if ($LASTEXITCODE -ne 0) { throw "Compilacao falhou" }
          python -c "import sys;sys.path.insert(0,'build/_app/audio_vendor');import pyaudiowpatch,PIL,openpyxl,fitz;print('Dependencias OK')"
          if ($LASTEXITCODE -ne 0) { throw "Importacao falhou" }
          python -c "import pathlib,zipfile; root=pathlib.Path('build'); z=zipfile.ZipFile('out/ALIYVO_02333.zip','w',zipfile.ZIP_DEFLATED); [z.write(p,p.relative_to(root)) for p in root.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.name!='soma_catalog.sqlite']; z.close()"
          python -c "import zipfile;z=zipfile.ZipFile('out/ALIYVO_02333.zip');assert z.testzip() is None"
          if ($LASTEXITCODE -ne 0) { throw "ZIP invalido" }
          $sha=(Get-FileHash out/ALIYVO_02333.zip -Algorithm SHA256).Hash.ToLower()
          "ALIYVO 0.23.33. Compilacao e dependencias Windows verificadas. SHA256: $sha. Captura real, pesquisa API e identificacao visual precisam de confirmacao no PC. Tabela Soma nao incluida na publicacao; preservada localmente ou importada pelo usuario." | Set-Content out/VALIDACAO_02333.txt
          gh release view v0.23.33 --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.23.33 out/ALIYVO_02333.zip out/VALIDACAO_02333.txt --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            gh release create v0.23.33 out/ALIYVO_02333.zip out/VALIDACAO_02333.txt --repo "$env:GITHUB_REPOSITORY" --title "ALIYVO 0.23.33 - Apoio ao atendimento" --notes "Substitui Dica na ligacao pelo painel visual Apoio ao atendimento: pedido editavel, ate duas ofertas complementares e ate duas perguntas de confirmacao. Fontes: texto/mensagem copiada, trecho da ligacao ativa e transcricao salva ou arquivo WAV. Analise somente ao clicar, em thread separada; resultado mantido apos desligar, reabrir painel ou falha de nova analise. Contato capturado no inicio da solicitacao nao muda ao abrir outra conversa ou atender nova chamada. Acoes Buscar peca com pedido corrigido, criar tarefa manual no contato do resultado e copiar resumo. Botao Desta conversa identifica cabecalho atual apenas quando acionado; ligacao ao vivo usa identidade da chamada. Testes locais de interface, retencao, troca de chamada, tarefa, copia e entradas passaram com API/transcricao simuladas. Transcricao real e qualidade das sugestoes precisam ser validadas com gravacao e chave do usuario no Windows." --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "Publicacao falhou" }
