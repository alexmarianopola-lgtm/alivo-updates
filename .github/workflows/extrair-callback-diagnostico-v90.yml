name: Extrair callback diagnostico v90
on:
  push:
    paths:
      - ".github/workflows/extrair-callback-diagnostico-v90.yml"
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Callback e callers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/base /tmp/app
          gh release download v0.22.90 --repo "$GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02290.zip" --dir /tmp/base
          unzip -q /tmp/base/ALIYVO_BETA_GRATIS_02290.zip -d /tmp/app
          P=/tmp/app/_app/main.py
          echo '=== ATTENDANCE CALLERS ==='
          grep -n '_attendance_scan(' "$P" || true
          grep -nE 'attendance.*(QTimer|setInterval|singleShot)' "$P" || true
          echo '=== DIAGNOSTIC CALLBACK ==='
          sed -n '7395,7585p' "$P"
