name: Publicar ALIYVO 0.22.82 Assistente WebView2
on:
  push:
    paths: ['trigger-v82.txt']
permissions:
  contents: write
jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar base 0.22.81
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\base,C:\temp\build | Out-Null
          gh release download v0.22.81 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02281.zip" --dir C:\temp\base
          Expand-Archive C:\temp\base\ALIYVO_BETA_GRATIS_02281.zip -DestinationPath C:\temp\build -Force
          (Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash | Set-Content C:\temp\worker_before.txt
      - name: Aplicar ajuste do Assistente
        shell: pwsh
        run: |
          python patch_assistant_webview2_v82.py C:\temp\build
          python -m py_compile C:\temp\build\_app\main.py C:\temp\build\_app\updater_worker.pyw
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.82"' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'class ChatGPTWebView\(QtWebView2Widget\)' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'self.web=ChatGPTWebView\(\)' | Out-Null
          $before=(Get-Content C:\temp\worker_before.txt).Trim()
          $after=(Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'updater_worker foi alterado indevidamente' }
      - name: Empacotar e validar ZIP final
        shell: pwsh
        run: |
          Compress-Archive -Path C:\temp\build\* -DestinationPath C:\temp\ALIYVO_BETA_GRATIS_02282.zip -Force
          Remove-Item -Recurse -Force C:\temp\verify -ErrorAction SilentlyContinue
          Expand-Archive C:\temp\ALIYVO_BETA_GRATIS_02282.zip -DestinationPath C:\temp\verify -Force
          python -m py_compile C:\temp\verify\_app\main.py C:\temp\verify\_app\updater_worker.pyw
          Select-String -Path C:\temp\verify\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.82"' | Out-Null
          Select-String -Path C:\temp\verify\_app\main.py -Pattern 'class ChatGPTWebView\(QtWebView2Widget\)' | Out-Null
          Select-String -Path C:\temp\verify\_app\main.py -Pattern 'user_data_folder=str\(profile_dir\)' | Out-Null
          $before=(Get-Content C:\temp\worker_before.txt).Trim()
          $final=(Get-FileHash C:\temp\verify\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $final){ throw 'updater_worker final difere da 0.22.81' }
      - name: Publicar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.22.82 C:\temp\ALIYVO_BETA_GRATIS_02282.zip --repo "$env:GITHUB_REPOSITORY" --title "ALIYVO Beta Gratis 0.22.82 - Assistente com Edge WebView2" --notes "Baseada na 0.22.81 confirmada. Migra somente o navegador do Assistente/ChatGPT de Qt WebEngine para Microsoft Edge WebView2, com perfil próprio, codecs/mídia do Edge, tela cheia, permissões de mídia e downloads nativos. O mecanismo de atualização permanece byte a byte igual ao da 0.22.81." --latest
