name: Inspecionar helpers foco v46

on:
  push:
    paths:
      - ".github/workflows/inspecionar-release-focus-v46.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar ultima release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/base /tmp/build && mkdir -p /tmp/base /tmp/build
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "*.zip" --dir /tmp/base
          unzip -q "$(find /tmp/base -type f -name '*.zip' | head -n1)" -d /tmp/build
      - name: Mostrar helpers
        run: |
          python - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/build/_app/main.py').read_text(encoding='utf-8',errors='ignore').splitlines()
          for a,b,label in [(8540,8645,'focus helpers'),(12490,12650,'focus callers A'),(12720,12810,'focus callers B'),(13020,13100,'focus callers C')]:
              print(f'=== {label} ===')
              for i in range(a-1,min(b,len(lines))):print(f'{i+1:05d}: {lines[i]}')
          PY
