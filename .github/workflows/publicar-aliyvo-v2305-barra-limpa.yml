name: Publicar ALIYVO 0.23.05 Barra Limpa
on:
  push:
    paths: ['trigger-v2305-release.txt']
permissions:
  contents: write
jobs:
  testar-e-publicar:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Baixar base oficial 0.23.04
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\base,C:\temp\build,C:\temp\verify,C:\temp\out | Out-Null
          gh release download v0.23.04 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02304.zip" --dir C:\temp\base
          Expand-Archive C:\temp\base\ALIYVO_BETA_GRATIS_02304.zip -DestinationPath C:\temp\build -Force
          if(-not (Test-Path C:\temp\build\_app\main.py)){ throw 'Base 0.23.04 invalida' }
          (Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash | Set-Content C:\temp\updater_before.txt
          if(-not (Test-Path C:\temp\build\_app\vendor\xlrd)){ throw 'Leitor XLS do Radar ausente na base' }

      - name: Aplicar limpeza da barra superior
        shell: pwsh
        run: |
          python patch_nav_clean_v2305.py C:\temp\build
          python -m py_compile C:\temp\build\_app\main.py C:\temp\build\_app\updater_worker.pyw
          python tests\logic_nav_clean_v2305.py C:\temp\build\_app | Tee-Object C:\temp\out\logic-nav-v2305.txt
          if($LASTEXITCODE -ne 0){ throw 'Gate da barra limpa falhou' }
          $before=(Get-Content C:\temp\updater_before.txt).Trim()
          $after=(Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater foi alterado' }

      - name: Empacotar e validar ZIP final
        shell: pwsh
        run: |
          Compress-Archive -Path C:\temp\build\* -DestinationPath C:\temp\out\ALIYVO_BETA_GRATIS_02305.zip -Force
          Expand-Archive C:\temp\out\ALIYVO_BETA_GRATIS_02305.zip -DestinationPath C:\temp\verify -Force
          python -m py_compile C:\temp\verify\_app\main.py C:\temp\verify\_app\updater_worker.pyw
          python tests\logic_nav_clean_v2305.py C:\temp\verify\_app | Tee-Object C:\temp\out\logic-nav-final-v2305.txt
          if($LASTEXITCODE -ne 0){ throw 'ZIP final falhou no gate' }
          $before=(Get-Content C:\temp\updater_before.txt).Trim()
          $after=(Get-FileHash C:\temp\verify\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater final foi alterado' }
          $sha=(Get-FileHash C:\temp\out\ALIYVO_BETA_GRATIS_02305.zip -Algorithm SHA256).Hash.ToLower()
          @(
            "ALIYVO 0.23.05 - BARRA SUPERIOR LIMPA",
            "Base oficial: 0.23.04",
            "Removidos do topo: Prazos, Assistente, Busca por imagem",
            "Botoes laterais equivalentes preservados: OK",
            "Radar da Carteira preservado: OK",
            "Leitor XLS preservado: OK",
            "CRM preservado: OK",
            "WhatsApp Turbo preservado: OK",
            "Ponto/Ahgora preservado: OK",
            "Proveniencia preservada: OK",
            "Updater preservado: OK",
            "ZIP_SHA256=$sha"
          ) | Set-Content C:\temp\out\VALIDACAO_02305.txt -Encoding UTF8

      - name: Publicar
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.23.05 C:\temp\out\ALIYVO_BETA_GRATIS_02305.zip C:\temp\out\VALIDACAO_02305.txt --repo "$env:GITHUB_REPOSITORY" --title "ALIYVO 0.23.05 - Barra Superior Limpa" --notes "Remove apenas os atalhos duplicados Prazos, Assistente e Busca por imagem da barra superior. As mesmas funcoes continuam disponíveis na lateral. Preserva Radar da Carteira, CRM, WhatsApp Turbo, ponto/Ahgora, proveniência e atualizador." --latest
