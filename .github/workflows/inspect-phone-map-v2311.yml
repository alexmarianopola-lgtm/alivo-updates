name: Inspecionar contatos e banco v0.23.11
on:
  push:
    paths: ['trigger-inspect-phone-map-v2311.txt']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair referencias de telefone
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\x | Out-Null
          gh release download v0.23.11 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02311.zip" --dir C:\temp\x
          Expand-Archive C:\temp\x\ALIYVO_BETA_GRATIS_02311.zip -DestinationPath C:\temp\x\app -Force
          $p='C:\temp\x\app\_app\main.py'
          $lines=Get-Content $p
          $patterns=@('campanha_contatos','whatsapp_nome','def _attendance_open_chat','def add_current_chat_to_campaign','phone','telefone')
          $out=@()
          foreach($pat in $patterns){
            $out+="===== $pat ====="
            foreach($m in (Select-String -Path $p -Pattern $pat -CaseSensitive:$false | Select-Object -First 35)){
              $a=[Math]::Max(1,$m.LineNumber-5);$b=[Math]::Min($lines.Count,$m.LineNumber+12)
              for($i=$a;$i -le $b;$i++){ $out+=("{0:D5}: {1}" -f $i,$lines[$i-1]) }
            }
          }
          $out | Set-Content phone_map_v2311.txt -Encoding UTF8
          git config user.name "aliyvo-inspector"
          git config user.email "actions@users.noreply.github.com"
          git add phone_map_v2311.txt
          git commit -m "inspect: mapa de telefone v2311"
          git push
