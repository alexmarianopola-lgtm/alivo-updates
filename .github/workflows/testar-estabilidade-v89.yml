name: Testar ALIYVO 0.22.89 estabilidade antes de publicar
on:
  push:
    paths: ['trigger-test-v89.txt']
permissions:
  contents: read
jobs:
  testar:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Baixar base oficial 0.22.88
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\base,C:\temp\build,C:\temp\out | Out-Null
          gh release download v0.22.88 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02288.zip" --dir C:\temp\base
          Expand-Archive C:\temp\base\ALIYVO_BETA_GRATIS_02288.zip -DestinationPath C:\temp\build -Force
          if(-not (Test-Path C:\temp\build\_app\main.py)){ throw 'Base 0.22.88 invalida' }
          (Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash | Set-Content C:\temp\updater_before.txt

      - name: Aplicar patch de estabilidade
        shell: pwsh
        run: |
          python patch_stability_v89.py C:\temp\build
          python -m py_compile C:\temp\build\_app\main.py C:\temp\build\_app\updater_worker.pyw
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.89"' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern '_diagnostic_cache_rows' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'setInterval\(600000\)' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern '_ai_learning_summary_payload\(False\)' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern '_aliyvo_download_hook_attempts<8' | Out-Null
          if(Select-String -Path C:\temp\build\_app\main.py -Pattern '_aliyvo_plate_override_timer=QTimer\(\)' -Quiet){ throw 'Timer permanente de override da placa ainda ativo' }
          if(Select-String -Path C:\temp\build\_app\main.py -Pattern '_aliyvo_plate_v24_timer=QTimer\(\)' -Quiet){ throw 'Timer permanente de limpeza da placa ainda ativo' }
          if(Select-String -Path C:\temp\build\_app\main.py -Pattern 'class ChatGPTWebView\(QtWebView2Widget\)' -Quiet){ throw 'Assistente voltou para WebView2' }
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'self.web=QWebEngineView\(self\)' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'class WhatsAppView\(QtWebView2Widget\)' | Out-Null
          $before=(Get-Content C:\temp\updater_before.txt).Trim()
          $after=(Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater foi alterado' }

      - name: Instalar dependencias para teste real de startup
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet PyQt6 PyQt6-WebEngine qtwebview2

      - name: Teste de runtime, cache e fechamento de diagnostico
        shell: pwsh
        run: |
          $script=@'
          import os,sys,time,json,traceback,importlib.util
          from pathlib import Path
          os.environ['LOCALAPPDATA']=r'C:\temp\aliyvo-v89-local'
          os.environ.setdefault('QTWEBENGINE_CHROMIUM_FLAGS','--disable-gpu')
          os.environ.setdefault('QTWEBENGINE_DISABLE_SANDBOX','1')
          base=Path(os.environ['LOCALAPPDATA'])/'ALIYVO'/'dados'
          base.mkdir(parents=True,exist_ok=True)
          logf=base/'diagnostico_eventos.jsonl'
          now=time.time()
          with logf.open('w',encoding='utf-8') as f:
              for i in range(20000):
                  row={'ts':now-i,'time':'2026-09-17T12:00:00','event':'message_customer','client':'Cliente '+str(i%300),'text':'teste '+str(i)}
                  f.write(json.dumps(row,ensure_ascii=False)+'\n')
          appdir=Path(r'C:\temp\build\_app')
          sys.path.insert(0,str(appdir))
          spec=importlib.util.spec_from_file_location('aliyvo_runtime_test',appdir/'main.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          app=m.QApplication([])
          errors=[]
          try:
              win=m.MainWindow();win.show()
          except Exception:
              traceback.print_exc();raise

          # Repete apenas os hooks de startup relevantes para a estabilidade auditada.
          m.QTimer.singleShot(700,m._aliyvo_install_download_hooks)
          m.QTimer.singleShot(900,m._aliyvo_override_old_plate_search)
          m.QTimer.singleShot(1000,m._aliyvo_clean_plate_ui)
          m.QTimer.singleShot(4500,m._aliyvo_clean_plate_ui)
          m.QTimer.singleShot(5000,m._aliyvo_override_old_plate_search)

          def fail(msg):
              errors.append(str(msg));print('FAIL:',msg,flush=True)

          def test_cache():
              try:
                  rows=win._diagnostic_read()
                  if len(rows)<20000:fail('cache nao carregou historico grande: '+str(len(rows)))
                  t=time.perf_counter()
                  for _ in range(40):win._diagnostic_read()
                  elapsed=time.perf_counter()-t
                  print('40 leituras cacheadas:',elapsed,'s',flush=True)
                  if elapsed>1.5:fail('leituras cacheadas lentas: %.3fs'%elapsed)
                  before=len(win._diagnostic_read())
                  win._diagnostic_log('stability_runtime_test',client='Teste')
                  after=len(win._diagnostic_read())
                  if after!=before+1:fail('novo evento nao entrou no cache')
              except Exception:
                  fail(traceback.format_exc())

          def close_diag():
              try:
                  for w in app.topLevelWidgets():
                      if 'Diagnóstico do atendimento' in str(w.windowTitle() or ''):
                          w.accept();return
                  fail('janela de diagnostico nao encontrada para fechar')
              except Exception:fail(traceback.format_exc())

          def test_diag():
              try:
                  m.QTimer.singleShot(900,close_diag)
                  win._diagnostic_show_dialog()
                  print('dialogo diagnostico abriu e fechou',flush=True)
              except Exception:fail(traceback.format_exc())

          hook_counts={}
          def snapshot_hooks(label):
              hook_counts[label]=int(getattr(m,'_aliyvo_download_hook_attempts',0) or 0)
              print(label,'download_hook_attempts=',hook_counts[label],flush=True)

          def finish():
              try:
                  if getattr(m,'_aliyvo_plate_override_timer',None) is not None:fail('timer permanente plate override foi criado')
                  if getattr(m,'_aliyvo_plate_v24_timer',None) is not None:fail('timer permanente plate clean foi criado')
                  if getattr(m,'_aliyvo_plate_ui_cleaner_timer',None) is not None:fail('timer legado plate cleaner foi criado')
                  a=hook_counts.get('t18',-1);b=int(getattr(m,'_aliyvo_download_hook_attempts',0) or 0)
                  print('download hooks final=',b,flush=True)
                  if b>8:fail('download hook continuou indefinidamente')
                  if a>=0 and b!=a:fail('download hook ainda aumentou depois do limite')
                  err=Path(os.environ['LOCALAPPDATA'])/'ALIYVO'/'logs'/'ALIYVO_RUNTIME_ERRO.txt'
                  if err.exists() and err.read_text(encoding='utf-8',errors='ignore').strip():
                      fail('runtime error log criado: '+err.read_text(encoding='utf-8',errors='ignore')[:1200])
              except Exception:fail(traceback.format_exc())
              try:win.close()
              except Exception:pass
              app.quit()

          m.QTimer.singleShot(2500,test_cache)
          m.QTimer.singleShot(5500,test_diag)
          m.QTimer.singleShot(18000,lambda:snapshot_hooks('t18'))
          m.QTimer.singleShot(22000,finish)
          app.exec()
          if errors:
              print('\n'.join(errors));sys.exit(1)
          print('RUNTIME STABILITY TEST: OK',flush=True)
          '@
          Set-Content C:\temp\runtime_test.py $script -Encoding UTF8
          python C:\temp\runtime_test.py 2>&1 | Tee-Object -FilePath C:\temp\runtime_test.log
          if($LASTEXITCODE -ne 0){ throw 'Teste de runtime falhou' }
          Select-String -Path C:\temp\runtime_test.log -Pattern 'RUNTIME STABILITY TEST: OK' | Out-Null

      - name: Empacotar candidato exato e revalidar
        shell: pwsh
        run: |
          Compress-Archive -Path C:\temp\build\* -DestinationPath C:\temp\out\ALIYVO_BETA_GRATIS_02289.zip -Force
          Expand-Archive C:\temp\out\ALIYVO_BETA_GRATIS_02289.zip -DestinationPath C:\temp\verify -Force
          python -m py_compile C:\temp\verify\_app\main.py C:\temp\verify\_app\updater_worker.pyw
          Select-String -Path C:\temp\verify\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.89"' | Out-Null
          $before=(Get-Content C:\temp\updater_before.txt).Trim()
          $after=(Get-FileHash C:\temp\verify\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater no ZIP final foi alterado' }
          $sha=(Get-FileHash C:\temp\out\ALIYVO_BETA_GRATIS_02289.zip -Algorithm SHA256).Hash
          "ALIYVO 0.22.89 CANDIDATO TESTADO`nZIP SHA256=$sha`nRuntime: OK`nCache 20k eventos: OK`nDialogo diagnostico abrir/fechar: OK`nTimers permanentes de placa: removidos`nDownload hook: limitado`nUpdater: preservado" | Set-Content C:\temp\out\TESTE_02289.txt -Encoding UTF8

      - uses: actions/upload-artifact@v4
        with:
          name: aliyvo-v89-candidate-tested
          path: |
            C:\temp\out\ALIYVO_BETA_GRATIS_02289.zip
            C:\temp\out\TESTE_02289.txt
            C:\temp\runtime_test.log
