name: Testar ALIYVO 0.22.89 estabilidade antes de publicar
on:
  push:
    paths: ['trigger-test-v89.txt']
permissions:
  contents: read
jobs:
  testar:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preparar base oficial e candidato
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\pkg,C:\temp\basebuild,C:\temp\build,C:\temp\out,C:\temp\logs | Out-Null
          gh release download v0.22.88 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02288.zip" --dir C:\temp\pkg
          Expand-Archive C:\temp\pkg\ALIYVO_BETA_GRATIS_02288.zip -DestinationPath C:\temp\basebuild -Force
          Copy-Item C:\temp\basebuild\* C:\temp\build -Recurse -Force
          if(-not (Test-Path C:\temp\build\_app\main.py)){ throw 'Base 0.22.88 invalida' }
          (Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash | Set-Content C:\temp\updater_before.txt
          python patch_stability_v89.py C:\temp\build
          python -m py_compile C:\temp\build\_app\main.py C:\temp\build\_app\updater_worker.pyw
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.89"' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern '_diagnostic_cache_rows' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'setInterval\(600000\)' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern '_ai_learning_summary_payload\(False\)' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern '_aliyvo_download_hook_attempts<8' | Out-Null
          if(Select-String -Path C:\temp\build\_app\main.py -Pattern '_aliyvo_plate_override_timer=QTimer\(\)' -Quiet){ throw 'Timer permanente de override da placa ainda ativo' }
          if(Select-String -Path C:\temp\build\_app\main.py -Pattern '_aliyvo_plate_v24_timer=QTimer\(\)' -Quiet){ throw 'Timer permanente de limpeza da placa ainda ativo' }
          if(Select-String -Path C:\temp\build\_app\main.py -Pattern 'class ChatGPTWebView\(QtWebView2Widget\)' -Quiet){ throw 'Assistente voltou para WebView2' }
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'self.web=QWebEngineView\(self\)' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'class WhatsAppView\(QtWebView2Widget\)' | Out-Null
          $before=(Get-Content C:\temp\updater_before.txt).Trim()
          $after=(Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater foi alterado' }

      - name: Instalar dependencias do smoke test
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet PyQt6 PyQt6-WebEngine qtwebview2

      - name: Comparar runtime real base x candidato
        shell: pwsh
        run: |
          cmd /d /c "python tests\runtime_stability_v89.py --appdir C:\temp\basebuild\_app --localappdata C:\temp\base-real --events 1000 > C:\temp\logs\base-real.log 2>&1"
          $baseExit=$LASTEXITCODE
          cmd /d /c "python tests\runtime_stability_v89.py --appdir C:\temp\build\_app --localappdata C:\temp\candidate-real --events 1000 > C:\temp\logs\candidate-real.log 2>&1"
          $candidateExit=$LASTEXITCODE
          "BASE_REAL_EXIT=$baseExit`nCANDIDATE_REAL_EXIT=$candidateExit" | Set-Content C:\temp\logs\real-comparison.txt -Encoding UTF8
          Write-Host "Base real exit=$baseExit; candidato real exit=$candidateExit"
          Write-Host '--- BASE REAL ---'; Get-Content C:\temp\logs\base-real.log -Tail 80 -ErrorAction SilentlyContinue
          Write-Host '--- CANDIDATO REAL ---'; Get-Content C:\temp\logs\candidate-real.log -Tail 80 -ErrorAction SilentlyContinue
          if($baseExit -eq 0 -and $candidateExit -ne 0){ throw 'Regressao: base abre no runner e candidato nao' }

      - name: Gate de runtime Qt isolando limite do WebView2 do runner
        shell: pwsh
        run: |
          cmd /d /c "python tests\runtime_stability_v89.py --appdir C:\temp\build\_app --localappdata C:\temp\candidate-stub --stub-webview2 --events 20000 > C:\temp\logs\candidate-stub.log 2>&1"
          $code=$LASTEXITCODE
          Get-Content C:\temp\logs\candidate-stub.log -Tail 160 -ErrorAction SilentlyContinue
          if($code -ne 0){ throw "Gate de runtime Qt falhou, codigo $code" }
          Select-String -Path C:\temp\logs\candidate-stub.log -Pattern 'RUNTIME STABILITY TEST: OK' | Out-Null

      - name: Empacotar exatamente o candidato aprovado
        if: success()
        shell: pwsh
        run: |
          Compress-Archive -Path C:\temp\build\* -DestinationPath C:\temp\out\ALIYVO_BETA_GRATIS_02289.zip -Force
          Expand-Archive C:\temp\out\ALIYVO_BETA_GRATIS_02289.zip -DestinationPath C:\temp\verify -Force
          python -m py_compile C:\temp\verify\_app\main.py C:\temp\verify\_app\updater_worker.pyw
          Select-String -Path C:\temp\verify\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.89"' | Out-Null
          $before=(Get-Content C:\temp\updater_before.txt).Trim()
          $after=(Get-FileHash C:\temp\verify\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater no ZIP final foi alterado' }
          $sha=(Get-FileHash C:\temp\out\ALIYVO_BETA_GRATIS_02289.zip -Algorithm SHA256).Hash
          "ALIYVO 0.22.89 CANDIDATO TESTADO`nZIP SHA256=$sha`nRuntime Qt: OK`nCache 20k eventos: OK`nDialogo diagnostico abrir/fechar: OK`nTimers permanentes de placa: removidos`nDownload hook: limitado`nUpdater: preservado" | Set-Content C:\temp\out\TESTE_02289.txt -Encoding UTF8

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aliyvo-v89-test-results
          path: |
            C:\temp\logs\*
            C:\temp\out\*
