name: Inspecionar CRM 0.23.21
on:
  push:
    paths:
      - 'trigger-inspect-crm-v2321.txt'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extrair CRM da release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\crm | Out-Null
          gh release download v0.23.21 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02321.zip" --dir C:\temp\crm
          Expand-Archive C:\temp\crm\ALIYVO_BETA_GRATIS_02321.zip -DestinationPath C:\temp\crm\app -Force
          python extract_crm_v2321.py C:\temp\crm\app\_app\main.py inspect_crm_v2321.txt
          git config user.name "aliyvo-inspector"
          git config user.email "actions@users.noreply.github.com"
          git add inspect_crm_v2321.txt
          git commit -m "inspect: CRM v2321"
          git push
