name: Publish ALIYVO 0.23.00 - Ahgora Chrome Shortcut
on:
  push:
    branches: ['feature/ahgora-shortcut-02300']
    paths: ['trigger-v2300-official.txt']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar base 0.22.99
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\base,C:\temp\build,C:\temp\verify,C:\temp\out | Out-Null
          gh release download v0.22.99 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02299.zip" --dir C:\temp\base
          Expand-Archive C:\temp\base\ALIYVO_BETA_GRATIS_02299.zip -DestinationPath C:\temp\build -Force
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.99"' | Out-Null
          (Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash | Set-Content C:\temp\updater.sha
      - name: Aplicar 0.23.00
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet PyQt6 PyQt6-WebEngine
          python patch_ponto_v2300.py C:\temp\build
          python -m py_compile C:\temp\build\_app\main.py C:\temp\build\_app\aliyvo_ponto.py
          python tests\logic_ponto_v2300.py C:\temp\build\_app
          if($LASTEXITCODE -ne 0){ throw 'Gate 0.23.00 falhou' }
          $before=(Get-Content C:\temp\updater.sha).Trim()
          $after=(Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater alterado indevidamente' }
      - name: Guardas
        shell: pwsh
        run: |
          Select-String -Path C:\temp\build\_app\aliyvo_ponto.py -SimpleMatch 'Ctrl+Shift+9' | Out-Null
          Select-String -Path C:\temp\build\_app\aliyvo_ponto.py -SimpleMatch 'Chrome_WidgetWin_' | Out-Null
          Select-String -Path C:\temp\build\_app\aliyvo_ponto.py -SimpleMatch '_verify_after_chrome_punch' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'class WhatsAppView\(QtWebView2Widget\)' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'self._diagnostic_timer=QTimer\(self\); self._diagnostic_timer.setInterval\(20000\)' | Out-Null
      - name: Empacotar
        shell: pwsh
        run: |
          Compress-Archive -Path C:\temp\build\* -DestinationPath C:\temp\out\ALIYVO_BETA_GRATIS_02300.zip -Force
          Expand-Archive C:\temp\out\ALIYVO_BETA_GRATIS_02300.zip -DestinationPath C:\temp\verify -Force
          python -m py_compile C:\temp\verify\_app\main.py C:\temp\verify\_app\aliyvo_ponto.py
          python tests\logic_ponto_v2300.py C:\temp\verify\_app
          if($LASTEXITCODE -ne 0){ throw 'ZIP final falhou' }
          $sha=(Get-FileHash C:\temp\out\ALIYVO_BETA_GRATIS_02300.zip -Algorithm SHA256).Hash.ToLower()
          @(
            'ALIYVO 0.23.00',
            'BATER PONTO AGORA abre a extensao oficial Ahgora Ponto Online via Ctrl+Shift+9',
            'ALIYVO nao preenche senha e nao clica em Bater Ponto automaticamente',
            'Sincronizacao posterior automatica somente leitura',
            'Updater/WhatsApp preservados',
            "SHA256=$sha"
          ) | Set-Content C:\temp\out\VALIDACAO_02300.txt -Encoding UTF8
      - name: Publicar latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if(gh release view v0.23.00 --repo "$env:GITHUB_REPOSITORY" *> $null){ throw 'release ja existe' }
          gh release create v0.23.00 C:\temp\out\ALIYVO_BETA_GRATIS_02300.zip C:\temp\out\VALIDACAO_02300.txt --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "ALIYVO 0.23.00 - Ahgora pelo Chrome" --notes "O botão BATER PONTO AGORA agora ativa o Google Chrome e chama a extensão oficial/licenciada Ahgora Ponto Online pelo atalho Ctrl+Shift+9. O usuário continua informando matrícula/senha e clicando em Bater Ponto na extensão. O ALIYVO não registra ponto automaticamente; após a ação, tenta sincronizar o espelho para confirmar a nova batida. Atualização disponível pelo painel do ALIYVO." --latest