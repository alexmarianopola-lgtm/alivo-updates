name: Publicar ALIYVO 0.22.93 CRM Visual
on:
  push:
    paths: ['trigger-v93-release.txt']
permissions:
  contents: write
jobs:
  testar-e-publicar:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Baixar base oficial 0.22.92
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\base,C:\temp\build,C:\temp\verify,C:\temp\out | Out-Null
          gh release download v0.22.92 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02292.zip" --dir C:\temp\base
          Expand-Archive C:\temp\base\ALIYVO_BETA_GRATIS_02292.zip -DestinationPath C:\temp\build -Force
          if(-not (Test-Path C:\temp\build\_app\main.py)){ throw 'Base 0.22.92 invalida' }
          (Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash | Set-Content C:\temp\updater_before.txt

      - name: Aplicar CRM Visual
        shell: pwsh
        run: |
          python patch_crm_visual_v93.py C:\temp\build
          python -m py_compile C:\temp\build\_app\main.py C:\temp\build\_app\updater_worker.pyw
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.93"' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'ALIYVO CRM' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'PENDÊNCIAS IA' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'Próxima ação:' | Out-Null
          $before=(Get-Content C:\temp\updater_before.txt).Trim()
          $after=(Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater foi alterado' }

      - name: Gate visual CRM
        shell: pwsh
        run: |
          python tests\logic_crm_visual_v93.py C:\temp\build\_app | Tee-Object C:\temp\out\logic-crm-visual-v93.txt
          if($LASTEXITCODE -ne 0){ throw 'Gate visual CRM v93 falhou' }
          Select-String -Path C:\temp\out\logic-crm-visual-v93.txt -Pattern 'ALIYVO_V93_CRM_VISUAL=OK' | Out-Null

      - name: Repetir gate CRM Assistido
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --disable-pip-version-check --quiet PyQt6
          $t=Get-Content tests\logic_crm_assistido_v92.py -Raw
          $t=$t.Replace("assert m.ALIYVO_VERSION=='0.22.92'","assert m.ALIYVO_VERSION=='0.22.93'")
          $t=$t.Replace('ALIYVO_V92_CRM_ASSISTIDO=OK','ALIYVO_V93_CRM_ASSISTIDO=OK')
          Set-Content C:\temp\logic_crm_v93.py $t -Encoding UTF8
          python C:\temp\logic_crm_v93.py C:\temp\build\_app | Tee-Object C:\temp\out\logic-crm-v93.txt
          if($LASTEXITCODE -ne 0){ throw 'Gate CRM Assistido falhou' }
          Select-String -Path C:\temp\out\logic-crm-v93.txt -Pattern 'ALIYVO_V93_CRM_ASSISTIDO=OK' | Out-Null

      - name: Repetir gate WhatsApp Turbo
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $t=Get-Content tests\logic_whatsapp_turbo_v91.py -Raw
          $t=$t.Replace("assert m.ALIYVO_VERSION=='0.22.91'","assert m.ALIYVO_VERSION=='0.22.93'")
          $t=$t.Replace('ALIYVO_V91_WHATSAPP_TURBO=OK','ALIYVO_V93_WHATSAPP_TURBO=OK')
          Set-Content C:\temp\logic_whatsapp_v93.py $t -Encoding UTF8
          python C:\temp\logic_whatsapp_v93.py C:\temp\build\_app | Tee-Object C:\temp\out\logic-whatsapp-v93.txt
          if($LASTEXITCODE -ne 0){ throw 'Gate WhatsApp Turbo falhou' }
          Select-String -Path C:\temp\out\logic-whatsapp-v93.txt -Pattern 'ALIYVO_V93_WHATSAPP_TURBO=OK' | Out-Null

      - name: Empacotar e validar ZIP final
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Compress-Archive -Path C:\temp\build\* -DestinationPath C:\temp\out\ALIYVO_BETA_GRATIS_02293.zip -Force
          Expand-Archive C:\temp\out\ALIYVO_BETA_GRATIS_02293.zip -DestinationPath C:\temp\verify -Force
          python -m py_compile C:\temp\verify\_app\main.py C:\temp\verify\_app\updater_worker.pyw
          python tests\logic_crm_visual_v93.py C:\temp\verify\_app | Tee-Object C:\temp\out\logic-visual-final-v93.txt
          if($LASTEXITCODE -ne 0){ throw 'ZIP final falhou no CRM visual' }
          python C:\temp\logic_crm_v93.py C:\temp\verify\_app | Tee-Object C:\temp\out\logic-crm-final-v93.txt
          if($LASTEXITCODE -ne 0){ throw 'ZIP final falhou no CRM assistido' }
          python C:\temp\logic_whatsapp_v93.py C:\temp\verify\_app | Tee-Object C:\temp\out\logic-wa-final-v93.txt
          if($LASTEXITCODE -ne 0){ throw 'ZIP final falhou no WhatsApp Turbo' }
          $before=(Get-Content C:\temp\updater_before.txt).Trim()
          $after=(Get-FileHash C:\temp\verify\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater no ZIP final foi alterado' }
          $sha=(Get-FileHash C:\temp\out\ALIYVO_BETA_GRATIS_02293.zip -Algorithm SHA256).Hash.ToLower()
          @(
            "ALIYVO 0.22.93",
            "Base: 0.22.92",
            "CRM visual: OK",
            "Cards Vencidos/Hoje/Esperando/Pendencias IA: OK",
            "Status CRM nos lembretes: OK",
            "CRM Assistido: preservado",
            "WhatsApp Turbo: preservado",
            "Updater: preservado",
            "ZIP_SHA256=$sha"
          ) | Set-Content C:\temp\out\VALIDACAO_02293.txt -Encoding UTF8

      - name: Publicar
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.22.93 C:\temp\out\ALIYVO_BETA_GRATIS_02293.zip C:\temp\out\VALIDACAO_02293.txt --repo "$env:GITHUB_REPOSITORY" --title "ALIYVO 0.22.93 - CRM Visual" --notes "Mudança visual do Lembretes: tela maior com cabeçalho ALIYVO CRM, quatro cards de resumo (Vencidos, Hoje, Esperando e Pendências IA), botão Pendências da IA e status comercial/próxima ação exibidos diretamente nos cartões vinculados a clientes. Mantém toda a lógica do CRM Assistido da 0.22.92 e o WhatsApp Turbo da 0.22.91, sem novo scanner do DOM." --latest
