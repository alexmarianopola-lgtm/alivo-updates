name: Inspecionar clique Hoje v0.23.12
on:
  push:
    paths: ['trigger-inspect-today-click-v2312.txt']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair metodo Hoje
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\x | Out-Null
          gh release download v0.23.12 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02312.zip" --dir C:\temp\x
          Expand-Archive C:\temp\x\ALIYVO_BETA_GRATIS_02312.zip -DestinationPath C:\temp\x\app -Force
          @'
from pathlib import Path
import ast
p=Path(r"C:\temp\x\app\_app\main.py")
s=p.read_text(encoding="utf-8")
tree=ast.parse(s)
cls=next(n for n in tree.body if isinstance(n,ast.ClassDef) and n.name=="MainWindow")
wanted={"_today_quick_panel","_attendance_open_chat","_attendance_phone_for_contact","_reminder_add","_reminder_add_from_current","_smart_reminder_from_diagnostic"}
out=[]
for n in cls.body:
    if isinstance(n,ast.FunctionDef) and n.name in wanted:
        out.append("===== "+n.name+" =====\n"+ast.get_source_segment(s,n)+"\n")
Path("today_click_v2312.txt").write_text("\n".join(out),encoding="utf-8")
'@ | Set-Content C:\temp\extract.py -Encoding UTF8
          python C:\temp\extract.py
          git config user.name "aliyvo-inspector"
          git config user.email "actions@users.noreply.github.com"
          git add today_click_v2312.txt
          git commit -m "inspect: clique Hoje v2312"
          git push
