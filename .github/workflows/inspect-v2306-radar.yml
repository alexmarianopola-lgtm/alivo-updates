name: Inspecionar Radar 0.23.06
on:
  push:
    paths: ['trigger-inspect-v2306-radar.txt']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Extrair metodos atuais
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\x | Out-Null
          gh release download v0.23.06 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02306.zip" --dir C:\temp\x
          Expand-Archive C:\temp\x\ALIYVO_BETA_GRATIS_02306.zip -DestinationPath C:\temp\x\app -Force
          $p='C:\temp\x\app\_app\main.py'
          @'
from pathlib import Path
import ast
p=Path(r"C:\temp\x\app\_app\main.py")
s=p.read_text(encoding="utf-8")
tree=ast.parse(s)
cls=next(n for n in tree.body if isinstance(n,ast.ClassDef) and n.name=="MainWindow")
wanted={"_radar_all_clients","_radar_profile_by_code","_radar_priorities","_radar_links_reverse","_radar_auto_link_all","_radar_bulk_link_dialog","_radar_show_dialog","_radar_resolve_client"}
out=[]
for n in cls.body:
    if isinstance(n,ast.FunctionDef) and n.name in wanted:
        out.append(f"===== {n.name} =====\n"+ast.get_source_segment(s,n)+"\n")
Path("radar_v2306_methods.txt").write_text("\n".join(out),encoding="utf-8")
'@ | Set-Content C:\temp\extract.py -Encoding UTF8
          python C:\temp\extract.py
          git config user.name "aliyvo-inspector"
          git config user.email "actions@users.noreply.github.com"
          git add radar_v2306_methods.txt
          git commit -m "inspect: extrair metodos Radar v2306"
          git push
