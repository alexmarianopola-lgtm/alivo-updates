name: Publicar ALIYVO 0.22.90 diagnostico WebEngine
on:
  push:
    paths: ['trigger-v90-release.txt']
permissions:
  contents: write
jobs:
  testar-e-publicar:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Baixar base oficial 0.22.89
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\base,C:\temp\build,C:\temp\verify,C:\temp\out | Out-Null
          gh release download v0.22.89 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02289.zip" --dir C:\temp\base
          Expand-Archive C:\temp\base\ALIYVO_BETA_GRATIS_02289.zip -DestinationPath C:\temp\build -Force
          if(-not (Test-Path C:\temp\build\_app\main.py)){ throw 'Base 0.22.89 invalida' }
          (Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash | Set-Content C:\temp\updater_before.txt

      - name: Aplicar diagnostico sem mudar arquitetura
        shell: pwsh
        run: |
          python patch_webdiag_v90.py C:\temp\build
          python -m py_compile C:\temp\build\_app\main.py C:\temp\build\_app\updater_worker.pyw
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.90"' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'WEB_RENDER_02290.jsonl' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'render_process_terminated' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'visual_probe' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'js_probe' | Out-Null
          if(-not (Test-Path C:\temp\build\GERAR_DIAGNOSTICO_PARA_CHATGPT.bat)){ throw 'Coletor nao foi criado' }
          if(-not (Test-Path C:\temp\build\_app\coletar_diagnostico_web.ps1)){ throw 'PowerShell de coleta nao foi criado' }
          if(Select-String -Path C:\temp\build\_app\main.py -Pattern 'class ChatGPTWebView\(QtWebView2Widget\)' -Quiet){ throw 'Assistente mudou para WebView2' }
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'self.web=QWebEngineView\(self\)' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'class WhatsAppView\(QtWebView2Widget\)' | Out-Null
          $before=(Get-Content C:\temp\updater_before.txt).Trim()
          $after=(Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater foi alterado' }

      - name: Repetir gate de estabilidade da 0.22.89
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --disable-pip-version-check --quiet PyQt6
          $t=Get-Content tests\logic_stability_v89.py -Raw
          $t=$t.Replace("assert m.ALIYVO_VERSION=='0.22.89'","assert m.ALIYVO_VERSION=='0.22.90'")
          $t=$t.Replace('ALIYVO_V89_LOGIC_STABILITY=OK','ALIYVO_V90_LOGIC_STABILITY=OK')
          Set-Content C:\temp\logic_stability_v90.py $t -Encoding UTF8
          python C:\temp\logic_stability_v90.py C:\temp\build\_app | Tee-Object C:\temp\out\logic-test-v90.txt
          if($LASTEXITCODE -ne 0){ throw 'Gate de estabilidade v90 falhou' }
          Select-String -Path C:\temp\out\logic-test-v90.txt -Pattern 'ALIYVO_V90_LOGIC_STABILITY=OK' | Out-Null

      - name: Empacotar candidato exato
        shell: pwsh
        run: |
          Compress-Archive -Path C:\temp\build\* -DestinationPath C:\temp\out\ALIYVO_BETA_GRATIS_02290.zip -Force
          Expand-Archive C:\temp\out\ALIYVO_BETA_GRATIS_02290.zip -DestinationPath C:\temp\verify -Force
          python -m py_compile C:\temp\verify\_app\main.py C:\temp\verify\_app\updater_worker.pyw
          Select-String -Path C:\temp\verify\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.90"' | Out-Null
          Select-String -Path C:\temp\verify\_app\main.py -Pattern 'WEB_RENDER_02290.jsonl' | Out-Null
          if(-not (Test-Path C:\temp\verify\GERAR_DIAGNOSTICO_PARA_CHATGPT.bat)){ throw 'Coletor ausente no ZIP final' }
          $before=(Get-Content C:\temp\updater_before.txt).Trim()
          $after=(Get-FileHash C:\temp\verify\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater no ZIP final foi alterado' }

      - name: Repetir estabilidade sobre ZIP final
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python C:\temp\logic_stability_v90.py C:\temp\verify\_app | Tee-Object C:\temp\out\logic-test-final-zip-v90.txt
          if($LASTEXITCODE -ne 0){ throw 'ZIP final falhou no gate de estabilidade' }
          Select-String -Path C:\temp\out\logic-test-final-zip-v90.txt -Pattern 'ALIYVO_V90_LOGIC_STABILITY=OK' | Out-Null
          $sha=(Get-FileHash C:\temp\out\ALIYVO_BETA_GRATIS_02290.zip -Algorithm SHA256).Hash
          "ALIYVO 0.22.90`nBase: 0.22.89`nDiagnostico QWebEngine: OK`nColetor tecnico: OK`nGate estabilidade v89: OK`nArquitetura Assistente/WhatsApp preservada`nUpdater preservado`nZIP SHA256=$sha" | Set-Content C:\temp\out\VALIDACAO_02290.txt -Encoding UTF8

      - name: Publicar diagnostico somente depois dos gates
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.22.90 C:\temp\out\ALIYVO_BETA_GRATIS_02290.zip C:\temp\out\VALIDACAO_02290.txt --repo "$env:GITHUB_REPOSITORY" --title "ALIYVO 0.22.90 - diagnostico de tela preta" --notes "Versao diagnostica baseada diretamente na 0.22.89. Nao altera a arquitetura do Assistente, WhatsApp ou updater. Adiciona instrumentacao passiva nos QWebEngineView para registrar carga, falhas do processo de renderizacao, estado do DOM, WebGL/renderer e metricas visuais agregadas sem salvar conteudo das paginas. Inclui GERAR_DIAGNOSTICO_PARA_CHATGPT.bat para criar um ZIP tecnico com logs, Windows, GPU e eventos de falha. A estabilidade da 0.22.89 e testada antes e depois do ZIP final." --latest
