name: Publicar ALIYVO 0.22.86 Assistente isolado
on:
  push:
    paths: ['trigger-v86.txt']
permissions:
  contents: write
jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar base 0.22.85
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\base,C:\temp\build | Out-Null
          gh release download v0.22.85 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02285.zip" --dir C:\temp\base
          Expand-Archive C:\temp\base\ALIYVO_BETA_GRATIS_02285.zip -DestinationPath C:\temp\build -Force
          (Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash | Set-Content C:\temp\worker_before.txt
      - name: Isolar Assistente do WhatsApp
        shell: pwsh
        run: |
          python patch_assistant_isolado_v86.py C:\temp\build
          python -m py_compile C:\temp\build\_app\main.py C:\temp\build\_app\updater_worker.pyw
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.86"' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'self.web=QWebEngineView\(self\)' | Out-Null
          if(Select-String -Path C:\temp\build\_app\main.py -Pattern 'class ChatGPTWebView\(QtWebView2Widget\)' -Quiet){ throw 'ChatGPT ainda usa WebView2' }
          $before=(Get-Content C:\temp\worker_before.txt).Trim()
          $after=(Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater foi alterado' }
      - name: Empacotar e validar
        shell: pwsh
        run: |
          Compress-Archive -Path C:\temp\build\* -DestinationPath C:\temp\ALIYVO_BETA_GRATIS_02286.zip -Force
          Expand-Archive C:\temp\ALIYVO_BETA_GRATIS_02286.zip -DestinationPath C:\temp\verify -Force
          python -m py_compile C:\temp\verify\_app\main.py C:\temp\verify\_app\updater_worker.pyw
          Select-String -Path C:\temp\verify\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.86"' | Out-Null
          Select-String -Path C:\temp\verify\_app\main.py -Pattern 'self.web=QWebEngineView\(self\)' | Out-Null
          if(Select-String -Path C:\temp\verify\_app\main.py -Pattern 'class ChatGPTWebView\(QtWebView2Widget\)' -Quiet){ throw 'ZIP final ainda contem ChatGPT WebView2' }
      - name: Publicar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.22.86 C:\temp\ALIYVO_BETA_GRATIS_02286.zip --repo "$env:GITHUB_REPOSITORY" --title "ALIYVO 0.22.86 - Assistente isolado do WhatsApp" --notes "Correcao de estabilidade baseada na 0.22.85. O WhatsApp continua no Microsoft Edge WebView2. O Assistente volta a usar Qt WebEngine, evitando que abrir o Assistente derrube ou faca desaparecer o WhatsApp. O mecanismo de atualizacao nao foi alterado." --latest
