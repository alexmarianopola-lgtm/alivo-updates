name: Build ALIYVO 0.22.94 RC3 - Ahgora Sync Fix
on:
  push:
    branches: ['feature/ahgora-sync-fix-02294']
    paths: ['trigger-v94-ahgora-rc3.txt']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar base 0.22.93 RC2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\base,C:\temp\build,C:\temp\verify,C:\temp\out | Out-Null
          gh release download v0.22.93-rc2 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02293_RC2.zip" --dir C:\temp\base
          Expand-Archive C:\temp\base\ALIYVO_BETA_GRATIS_02293_RC2.zip -DestinationPath C:\temp\build -Force
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.93"' | Out-Null
          (Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash | Set-Content C:\temp\updater_before.txt
      - name: Aplicar correcao 0.22.94
        shell: pwsh
        run: |
          python patch_ahgora_v94.py C:\temp\build
          python -m py_compile C:\temp\build\_app\main.py C:\temp\build\_app\aliyvo_ponto.py C:\temp\build\_app\updater_worker.pyw
          python tests\package_ahgora_v94.py C:\temp\build
          python -m json.tool C:\temp\build\EXTENSAO_PONTO_SANKHYA\manifest.json | Out-Null
          node --check C:\temp\build\EXTENSAO_PONTO_SANKHYA\background.js
          node --check C:\temp\build\EXTENSAO_PONTO_SANKHYA\content.js
          node --check C:\temp\build\EXTENSAO_PONTO_SANKHYA\popup.js
          $before=(Get-Content C:\temp\updater_before.txt).Trim()
          $after=(Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater alterado indevidamente' }
      - name: Testar logica Ahgora corrigida
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --disable-pip-version-check --quiet PyQt6
          python tests\logic_ahgora_v94.py C:\temp\build\_app | Tee-Object C:\temp\out\logic-v94.txt
          if($LASTEXITCODE -ne 0){ throw 'Gate Ahgora v94 falhou' }
          Select-String C:\temp\out\logic-v94.txt -Pattern 'ALIYVO_V94_AHGORA_FIX=OK' | Out-Null
      - name: Repetir gates WhatsApp e estabilidade
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $w=Get-Content tests\logic_whatsapp_turbo_v91.py -Raw
          $w=$w.Replace("assert m.ALIYVO_VERSION=='0.22.91'","assert m.ALIYVO_VERSION=='0.22.94'")
          $w=$w.Replace('ALIYVO_V91_WHATSAPP_TURBO=OK','ALIYVO_V94_WHATSAPP_TURBO=OK')
          Set-Content C:\temp\logic_whatsapp_v94.py $w -Encoding UTF8
          python C:\temp\logic_whatsapp_v94.py C:\temp\build\_app
          if($LASTEXITCODE -ne 0){ throw 'Gate WhatsApp falhou' }
          $s=Get-Content tests\logic_stability_v89.py -Raw
          $s=$s.Replace("assert m.ALIYVO_VERSION=='0.22.89'","assert m.ALIYVO_VERSION=='0.22.94'")
          $s=$s.Replace('self._diagnostic_timer=QTimer(self); self._diagnostic_timer.setInterval(5000)','self._diagnostic_timer=QTimer(self); self._diagnostic_timer.setInterval(20000)')
          $s=$s.Replace('ALIYVO_V89_LOGIC_STABILITY=OK','ALIYVO_V94_LOGIC_STABILITY=OK')
          Set-Content C:\temp\logic_stability_v94.py $s -Encoding UTF8
          python C:\temp\logic_stability_v94.py C:\temp\build\_app
          if($LASTEXITCODE -ne 0){ throw 'Gate estabilidade falhou' }
      - name: Empacotar e reverificar
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Compress-Archive -Path C:\temp\build\* -DestinationPath C:\temp\out\ALIYVO_BETA_GRATIS_02294_RC3.zip -Force
          Compress-Archive -Path C:\temp\build\EXTENSAO_PONTO_SANKHYA\* -DestinationPath C:\temp\out\ALIYVO_PONTO_EXTENSION_02294_RC3.zip -Force
          Expand-Archive C:\temp\out\ALIYVO_BETA_GRATIS_02294_RC3.zip -DestinationPath C:\temp\verify -Force
          python -m py_compile C:\temp\verify\_app\main.py C:\temp\verify\_app\aliyvo_ponto.py
          python tests\package_ahgora_v94.py C:\temp\verify
          python tests\logic_ahgora_v94.py C:\temp\verify\_app
          if($LASTEXITCODE -ne 0){ throw 'ZIP final falhou' }
          $sha=(Get-FileHash C:\temp\out\ALIYVO_BETA_GRATIS_02294_RC3.zip -Algorithm SHA256).Hash
          @(
            'ALIYVO 0.22.94 RC3',
            'Correcao: sincronizacao Ahgora valida resposta real antes de marcar conectado',
            'Correcao: estado antigo precisa de ajuste e limpo apos sync real',
            'Diagnostico da sincronizacao adicionado',
            'Batida direta liberada somente apos sync valida',
            'WhatsApp/estabilidade/updater preservados',
            'Teste com a conta real do usuario ainda necessario',
            "SHA256=$sha"
          ) | Set-Content C:\temp\out\VALIDACAO_02294_RC3.txt -Encoding UTF8
      - name: Publicar prerelease RC3
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if(gh release view v0.22.94-rc3 --repo "$env:GITHUB_REPOSITORY" *> $null){ throw 'release ja existe' }
          gh release create v0.22.94-rc3 C:\temp\out\ALIYVO_BETA_GRATIS_02294_RC3.zip C:\temp\out\ALIYVO_PONTO_EXTENSION_02294_RC3.zip C:\temp\out\VALIDACAO_02294_RC3.txt --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "ALIYVO 0.22.94 RC3 - Correcao Ahgora" --notes "Corrige a sincronizacao do Controle de Ponto: o ALIYVO agora valida a resposta real do espelho Ahgora, confere empresa/matricula/dia, mostra a quantidade de batidas encontradas e limpa estados locais antigos somente depois de uma sincronizacao valida. A batida direta permanece condicionada a clique + confirmacao. RC para teste real, nao promovida a latest." --prerelease