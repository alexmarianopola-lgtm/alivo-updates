name: Extrair WhatsAppView 0.23.12
on:
  push:
    paths: ['trigger-extract-whatsappview-v2312.txt']
permissions:
  contents: write
jobs:
  extract:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extrair classe WhatsAppView
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\x | Out-Null
          gh release download v0.23.12 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02312.zip" --dir C:\temp\x
          Expand-Archive C:\temp\x\ALIYVO_BETA_GRATIS_02312.zip -DestinationPath C:\temp\x\app -Force
          @'
from pathlib import Path
import ast
p=Path(r"C:\temp\x\app\_app\main.py")
s=p.read_text(encoding="utf-8")
tree=ast.parse(s)
node=next(n for n in tree.body if isinstance(n,ast.ClassDef) and n.name=="WhatsAppView")
Path("whatsappview_v2312.txt").write_text(ast.get_source_segment(s,node),encoding="utf-8")
'@ | Set-Content C:\temp\extract.py -Encoding UTF8
          python C:\temp\extract.py
          git config user.name "aliyvo-inspector"
          git config user.email "actions@users.noreply.github.com"
          git add whatsappview_v2312.txt
          git commit -m "inspect: WhatsAppView v2312"
          git push
