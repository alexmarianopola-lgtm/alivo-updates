name: Publicar ALIYVO v44

on:
  push:
    paths:
      - "update-v44.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ler versao
        id: meta
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open('update-v44.json',encoding='utf-8'))
          v=str(d['version']).lstrip('vV')
          a=str(d.get('asset_name') or ('ALIYVO_BETA_GRATIS_'+v.replace('.','')+'.zip'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('version='+v+'\n')
              f.write('tag=v'+v+'\n')
              f.write('asset='+a+'\n')
          PY

      - name: Baixar ultima Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/base
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_*.zip" --dir /tmp/base
          echo "BASE_ZIP=$(find /tmp/base -maxdepth 1 -type f -name '*.zip' | head -n1)" >> "$GITHUB_ENV"

      - name: Aplicar atualizacao
        run: |
          rm -rf /tmp/build && mkdir -p /tmp/build
          unzip -q "$BASE_ZIP" -d /tmp/build
          python patch_script_v44.py /tmp/build/_app/main.py
          python -m py_compile /tmp/build/_app/main.py
          grep -q 'ALIYVO_VERSION = "0.22.58"' /tmp/build/_app/main.py
          grep -q 'def _recreate_whatsapp_webview' /tmp/build/_app/main.py
          grep -q 'def _aliyvo_shutdown_webviews' /tmp/build/_app/main.py
          cd /tmp/build
          zip -qr "/tmp/${{ steps.meta.outputs.asset }}" .

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" "/tmp/${{ steps.meta.outputs.asset }}" --repo "$GITHUB_REPOSITORY" --title "ALIYVO Beta Gratis ${{ steps.meta.outputs.version }}" --notes "Corrige o WhatsApp que podia desaparecer ao fechar e reabrir o ALIYVO. Todos os WebView2 do aplicativo agora recebem encerramento explicito. Se a inicializacao do WhatsApp falhar ou ficar presa, o ALIYVO recria automaticamente apenas o navegador usando o mesmo perfil persistente. Login, IA, diagnosticos, lembretes e dados locais nao sao apagados." --latest
