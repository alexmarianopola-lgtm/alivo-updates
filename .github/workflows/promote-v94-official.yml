name: Promote ALIYVO 0.22.94 to official update
on:
  push:
    branches: ['feature/ahgora-sync-fix-02294']
    paths: ['trigger-promote-v94-official.txt']
permissions:
  contents: write
jobs:
  promote:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar RC3 aprovada
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\rc,C:\temp\verify,C:\temp\out | Out-Null
          gh release download v0.22.94-rc3 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02294_RC3.zip" --dir C:\temp\rc
          $sha=(Get-FileHash C:\temp\rc\ALIYVO_BETA_GRATIS_02294_RC3.zip -Algorithm SHA256).Hash.ToLower()
          if($sha -ne 'a6fb23a92c5cc91eb4834792b0a5736875463607b05f9bdc47fffbca81679321'){ throw "SHA da RC3 nao confere: $sha" }
          Copy-Item C:\temp\rc\ALIYVO_BETA_GRATIS_02294_RC3.zip C:\temp\out\ALIYVO_BETA_GRATIS_02294.zip
      - name: Validar pacote oficial
        shell: pwsh
        run: |
          Expand-Archive C:\temp\out\ALIYVO_BETA_GRATIS_02294.zip -DestinationPath C:\temp\verify -Force
          python -m py_compile C:\temp\verify\_app\main.py C:\temp\verify\_app\aliyvo_ponto.py C:\temp\verify\_app\updater_worker.pyw C:\temp\verify\_app\update_check_worker.py
          Select-String -Path C:\temp\verify\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.94"' | Out-Null
          Select-String -Path C:\temp\verify\_app\main.py -SimpleMatch 'https://api.github.com/repos/alexmarianopola-lgtm/alivo-updates/releases/latest' | Out-Null
          Select-String -Path C:\temp\verify\_app\main.py -SimpleMatch 'ALIYVO_USER_DIR = Path(' | Out-Null
          Select-String -Path C:\temp\verify\_app\main.py -SimpleMatch 'WEBVIEW2_PROFILE_DIR = ALIYVO_USER_DIR / "webview2_whatsapp_profile"' | Out-Null
          Select-String -Path C:\temp\verify\_app\main.py -SimpleMatch 'PROFILE_DIR = ALIYVO_USER_DIR / "whatsapp_profile"' | Out-Null
          if(-not (Test-Path C:\temp\verify\EXTENSAO_PONTO_SANKHYA\manifest.json)){ throw 'Extensao Ponto Guard ausente no pacote' }
          $sha=(Get-FileHash C:\temp\out\ALIYVO_BETA_GRATIS_02294.zip -Algorithm SHA256).Hash.ToLower()
          @(
            'ALIYVO 0.22.94 - ATUALIZACAO OFICIAL',
            'Base validada: 0.22.94 RC3',
            'Atualizacao pelo painel nativo do ALIYVO: SIM',
            'Canal: GitHub releases/latest',
            'Perfil WhatsApp fora da pasta de instalacao em LOCALAPPDATA/ALIYVO: preservado',
            'Configuracoes/dados do usuario em LOCALAPPDATA: preservados',
            'Controle de Ponto + sincronizacao Ahgora corrigida: incluido',
            'Extensao Ponto Guard incluida dentro do pacote',
            "SHA256=$sha"
          ) | Set-Content C:\temp\out\VALIDACAO_02294_OFICIAL.txt -Encoding UTF8
      - name: Publicar como latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if(gh release view v0.22.94 --repo "$env:GITHUB_REPOSITORY" *> $null){ throw 'v0.22.94 ja existe' }
          gh release create v0.22.94 C:\temp\out\ALIYVO_BETA_GRATIS_02294.zip C:\temp\out\VALIDACAO_02294_OFICIAL.txt --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "ALIYVO 0.22.94 - Ahgora sincronizado" --notes "Atualizacao oficial do ALIYVO. O Controle de Ponto valida a resposta real do espelho Ahgora, confere empresa, matricula e o dia atual, mostra as batidas encontradas e corrige estados locais antigos. A batida pelo ALIYVO exige clique e confirmacao. Perfis do WhatsApp e dados persistentes permanecem em LOCALAPPDATA/ALIYVO e nao sao apagados pela atualizacao. Inclui a extensao Ponto Guard dentro do pacote. Atualizacao disponivel pelo painel nativo do ALIYVO." --latest