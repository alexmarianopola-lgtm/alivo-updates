name: Publicar ALIYVO 0.22.88 recuperar startup e chamadas
on:
  push:
    paths: ['trigger-v88.txt']
permissions:
  contents: write
jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar base estavel 0.22.86
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\base,C:\temp\build | Out-Null
          gh release download v0.22.86 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02286.zip" --dir C:\temp\base
          Expand-Archive C:\temp\base\ALIYVO_BETA_GRATIS_02286.zip -DestinationPath C:\temp\build -Force
          (Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash | Set-Content C:\temp\worker_before.txt
      - name: Aplicar correcao segura
        shell: pwsh
        run: |
          python patch_whatsapp_permissions_v88.py C:\temp\build
          python -m py_compile C:\temp\build\_app\main.py C:\temp\build\_app\updater_worker.pyw
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.88"' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'def _reset_whatsapp_media_permissions' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern '_reset_whatsapp_media_permissions\(\)' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'args.SavesInProfile=False' | Out-Null
          $before=(Get-Content C:\temp\worker_before.txt).Trim()
          $after=(Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater foi alterado' }
      - name: Teste de importacao sem abrir interface
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          python -c "import runpy; import pathlib; p=pathlib.Path(r'C:\temp\build\_app\main.py'); c=p.read_text(encoding='utf-8'); compile(c,str(p),'exec'); print('startup compile ok')"
      - name: Empacotar e validar ZIP final
        shell: pwsh
        run: |
          Compress-Archive -Path C:\temp\build\* -DestinationPath C:\temp\ALIYVO_BETA_GRATIS_02288.zip -Force
          Expand-Archive C:\temp\ALIYVO_BETA_GRATIS_02288.zip -DestinationPath C:\temp\verify -Force
          python -m py_compile C:\temp\verify\_app\main.py C:\temp\verify\_app\updater_worker.pyw
          Select-String -Path C:\temp\verify\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.88"' | Out-Null
          if(Select-String -Path C:\temp\verify\_app\main.py -Pattern 'class ChatGPTWebView\(QtWebView2Widget\)' -Quiet){ throw 'Assistente voltou indevidamente ao WebView2' }
          $before=(Get-Content C:\temp\worker_before.txt).Trim()
          $after=(Get-FileHash C:\temp\verify\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater do ZIP final foi alterado' }
      - name: Publicar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.22.88 C:\temp\ALIYVO_BETA_GRATIS_02288.zip --repo "$env:GITHUB_REPOSITORY" --title "ALIYVO 0.22.88 - recuperação e chamadas WhatsApp" --notes "Versao criada diretamente sobre a 0.22.86 estavel. Corrige o erro de inicializacao introduzido na 0.22.87 e reaplica de forma segura a limpeza seletiva das permissoes de microfone/camera do WhatsApp. Assistente e atualizador preservados. A 0.22.87 nao deve ser usada." --latest
