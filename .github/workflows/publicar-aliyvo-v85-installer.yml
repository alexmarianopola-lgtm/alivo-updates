name: Publicar ALIYVO 0.22.85 com instalador
on:
  push:
    paths: ['trigger-v85-installer.txt']
permissions:
  contents: write
jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Baixar base funcional 0.22.83
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\base,C:\temp\build,C:\temp\out | Out-Null
          gh release download v0.22.83 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02283.zip" --dir C:\temp\base
          Expand-Archive C:\temp\base\ALIYVO_BETA_GRATIS_02283.zip -DestinationPath C:\temp\build -Force
          if(-not (Test-Path C:\temp\build\_app\main.py)){ throw 'Base 0.22.83 invalida' }
          if(-not (Test-Path 'C:\temp\build\INSTALAR ALIYVO.bat')){ throw 'Instalador BAT da base nao encontrado' }
          (Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash | Out-File C:\temp\updater_sha.txt -Encoding ascii

      - name: Gerar 0.22.85 sem a alteracao 0.22.84
        shell: pwsh
        run: |
          $p='C:\temp\build\_app\main.py'
          $txt=Get-Content $p -Raw -Encoding UTF8
          $txt=$txt -replace 'ALIYVO_VERSION = "0\.22\.83"','ALIYVO_VERSION = "0.22.85"'
          Set-Content $p $txt -Encoding UTF8
          python -m py_compile C:\temp\build\_app\main.py C:\temp\build\_app\updater_worker.pyw
          Select-String -Path $p -Pattern 'ALIYVO_VERSION = "0.22.85"' | Out-Null
          $before=(Get-Content C:\temp\updater_sha.txt -Raw).Trim()
          $after=(Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater foi alterado sem querer' }

      - name: Empacotar ZIP 0.22.85
        shell: pwsh
        run: |
          Compress-Archive -Path C:\temp\build\* -DestinationPath C:\temp\out\ALIYVO_BETA_GRATIS_02285.zip -Force
          Expand-Archive C:\temp\out\ALIYVO_BETA_GRATIS_02285.zip -DestinationPath C:\temp\verify -Force
          python -m py_compile C:\temp\verify\_app\main.py C:\temp\verify\_app\updater_worker.pyw
          Select-String -Path C:\temp\verify\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.85"' | Out-Null

      - name: Criar instalador EXE
        shell: pwsh
        run: |
          $iss=@'
          [Setup]
          AppId={{8B935A3E-2285-4E85-8A11-202609150001}}
          AppName=ALIYVO
          AppVersion=0.22.85
          AppPublisher=ALIYVO
          DefaultDirName={localappdata}\Programs\ALIYVO
          DisableProgramGroupPage=yes
          PrivilegesRequired=lowest
          OutputDir=C:\temp\out
          OutputBaseFilename=ALIYVO_SETUP_02285
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          Uninstallable=yes
          CloseApplications=yes
          RestartApplications=no
          SetupLogging=yes
          SetupIconFile=C:\temp\build\_app\Aliyvo.ico

          [Files]
          Source: "C:\temp\build\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Run]
          Filename: "{app}\INSTALAR ALIYVO.bat"; WorkingDir: "{app}"; Flags: waituntilterminated runhidden skipifsilent; Description: "Configurar ALIYVO"
          '@
          Set-Content C:\temp\aliyvo.iss $iss -Encoding UTF8
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(-not (Test-Path $iscc)){ choco install innosetup -y --no-progress; }
          if(-not (Test-Path $iscc)){ throw 'Inno Setup nao encontrado' }
          & $iscc C:\temp\aliyvo.iss
          if(-not (Test-Path C:\temp\out\ALIYVO_SETUP_02285.exe)){ throw 'EXE nao foi criado' }

      - name: Testar instalador em pasta limpa
        shell: pwsh
        run: |
          $dest='C:\temp\install-test'
          Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
          $proc=Start-Process -FilePath C:\temp\out\ALIYVO_SETUP_02285.exe -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dest") -Wait -PassThru
          if($proc.ExitCode -ne 0){ throw "Setup retornou codigo $($proc.ExitCode)" }
          if(-not (Test-Path "$dest\_app\main.py")){ throw 'Setup nao instalou main.py' }
          Select-String -Path "$dest\_app\main.py" -Pattern 'ALIYVO_VERSION = "0.22.85"' | Out-Null
          if(-not (Test-Path "$dest\_app\updater_worker.pyw")){ throw 'Updater ausente na instalacao' }
          Write-Host 'TESTE DO INSTALADOR EM PASTA LIMPA: OK'

      - name: Publicar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.22.85 C:\temp\out\ALIYVO_BETA_GRATIS_02285.zip C:\temp\out\ALIYVO_SETUP_02285.exe --repo "$env:GITHUB_REPOSITORY" --title "ALIYVO 0.22.85 - reinstalacao de recuperacao" --notes "Versao de recuperacao baseada na 0.22.83, ultima base que estava abrindo antes da alteracao 0.22.84. Mantem o atualizador automatico corrigido. O instalador EXE foi instalado e validado em uma pasta limpa no Windows. Na instalacao normal ele executa o mesmo bootstrap do ALIYVO usado anteriormente para conferir/instalar dependencias e criar o atalho. Os dados do usuario em LOCALAPPDATA\\ALIYVO nao sao apagados." --latest
