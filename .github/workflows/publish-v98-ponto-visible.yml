name: Publish ALIYVO 0.22.98 - Ponto Sempre Visivel
on:
  push:
    branches: ['feature/ponto-always-visible-02298']
    paths: ['trigger-v98-official.txt']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar base 0.22.97
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\base,C:\temp\build,C:\temp\verify,C:\temp\out | Out-Null
          gh release download v0.22.97 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02297.zip" --dir C:\temp\base
          Expand-Archive C:\temp\base\ALIYVO_BETA_GRATIS_02297.zip -DestinationPath C:\temp\build -Force
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.97"' | Out-Null
          (Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash | Set-Content C:\temp\updater.sha
      - name: Aplicar 0.22.98
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet PyQt6 PyQt6-WebEngine
          python patch_ponto_v98.py C:\temp\build
          python -m py_compile C:\temp\build\_app\main.py C:\temp\build\_app\aliyvo_ponto.py
          python tests\logic_ponto_v98.py C:\temp\build\_app
          if($LASTEXITCODE -ne 0){ throw 'Gate v98 falhou' }
          $before=(Get-Content C:\temp\updater.sha).Trim()
          $after=(Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater alterado indevidamente' }
      - name: Guardas
        shell: pwsh
        run: |
          Select-String -Path C:\temp\build\_app\aliyvo_ponto.py -SimpleMatch 'BATER PONTO AGORA  •' | Out-Null
          Select-String -Path C:\temp\build\_app\aliyvo_ponto.py -SimpleMatch 'Isso pode criar uma nova batida mesmo antes do horário previsto.' | Out-Null
          Select-String -Path C:\temp\build\_app\aliyvo_ponto.py -SimpleMatch 'always_punch.clicked.connect(self.punch_ahgora)' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'class WhatsAppView\(QtWebView2Widget\)' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'self._diagnostic_timer=QTimer\(self\); self._diagnostic_timer.setInterval\(20000\)' | Out-Null
      - name: Empacotar
        shell: pwsh
        run: |
          Compress-Archive -Path C:\temp\build\* -DestinationPath C:\temp\out\ALIYVO_BETA_GRATIS_02298.zip -Force
          Expand-Archive C:\temp\out\ALIYVO_BETA_GRATIS_02298.zip -DestinationPath C:\temp\verify -Force
          python -m py_compile C:\temp\verify\_app\main.py C:\temp\verify\_app\aliyvo_ponto.py
          python tests\logic_ponto_v98.py C:\temp\verify\_app
          if($LASTEXITCODE -ne 0){ throw 'ZIP final falhou' }
          $sha=(Get-FileHash C:\temp\out\ALIYVO_BETA_GRATIS_02298.zip -Algorithm SHA256).Hash.ToLower()
          @(
            'ALIYVO 0.22.98',
            'Botao BATER PONTO AGORA sempre visivel quando Ahgora conectado',
            'Permite batida adiantada/atrasada com confirmacao forte',
            'Mostra batidas ja existentes antes de confirmar',
            'Updater/WhatsApp preservados',
            "SHA256=$sha"
          ) | Set-Content C:\temp\out\VALIDACAO_02298.txt -Encoding UTF8
      - name: Publicar latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if(gh release view v0.22.98 --repo "$env:GITHUB_REPOSITORY" *> $null){ throw 'release ja existe' }
          gh release create v0.22.98 C:\temp\out\ALIYVO_BETA_GRATIS_02298.zip C:\temp\out\VALIDACAO_02298.txt --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "ALIYVO 0.22.98 - Bater ponto sempre disponível" --notes "O botão BATER PONTO AGORA fica disponível sempre que o Ahgora estiver conectado e sincronizado, mesmo antes do horário previsto. Antes de enviar, o ALIYVO mostra o horário atual, o próximo evento esperado e as batidas já encontradas no dia, exigindo confirmação explícita. Atualização disponível pelo painel do ALIYVO." --latest