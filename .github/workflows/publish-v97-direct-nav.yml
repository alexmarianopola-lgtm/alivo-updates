name: Publish ALIYVO 0.22.97 - Ahgora Direct Nav
on:
  push:
    branches: ['feature/ahgora-direct-nav-02297']
    paths: ['trigger-v97-official.txt']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar base 0.22.96
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\base,C:\temp\build,C:\temp\verify,C:\temp\out | Out-Null
          gh release download v0.22.96 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02296.zip" --dir C:\temp\base
          Expand-Archive C:\temp\base\ALIYVO_BETA_GRATIS_02296.zip -DestinationPath C:\temp\build -Force
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.96"' | Out-Null
          (Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash | Set-Content C:\temp\updater.sha
      - name: Aplicar 0.22.97
        shell: pwsh
        run: |
          python patch_ahgora_v97.py C:\temp\build
          python -m py_compile C:\temp\build\_app\main.py C:\temp\build\_app\aliyvo_ponto.py
          python -m json.tool C:\temp\build\EXTENSAO_PONTO_SANKHYA\manifest.json | Out-Null
          $before=(Get-Content C:\temp\updater.sha).Trim()
          $after=(Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater alterado indevidamente' }
      - name: Testar sincronizacao direta
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
        run: |
          python -m pip install --disable-pip-version-check --quiet PyQt6 PyQt6-WebEngine
          python tests\logic_ahgora_v97.py C:\temp\build\_app | Tee-Object C:\temp\out\logic-v97.txt
          if($LASTEXITCODE -ne 0){ throw 'Gate v97 falhou' }
          Select-String C:\temp\out\logic-v97.txt -Pattern 'ALIYVO_V97_SYNC_FIX=OK' | Out-Null
      - name: Guardas
        shell: pwsh
        run: |
          Select-String -Path C:\temp\build\_app\aliyvo_ponto.py -SimpleMatch 'view.setUrl(QUrl(AHGORA_MIRROR_API))' | Out-Null
          Select-String -Path C:\temp\build\_app\aliyvo_ponto.py -SimpleMatch 'toPlainText' | Out-Null
          Select-String -Path C:\temp\build\_app\aliyvo_ponto.py -SimpleMatch 'ForcePersistentCookies' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'class WhatsAppView\(QtWebView2Widget\)' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'self._diagnostic_timer=QTimer\(self\); self._diagnostic_timer.setInterval\(20000\)' | Out-Null
      - name: Empacotar
        shell: pwsh
        run: |
          Compress-Archive -Path C:\temp\build\* -DestinationPath C:\temp\out\ALIYVO_BETA_GRATIS_02297.zip -Force
          Expand-Archive C:\temp\out\ALIYVO_BETA_GRATIS_02297.zip -DestinationPath C:\temp\verify -Force
          python -m py_compile C:\temp\verify\_app\main.py C:\temp\verify\_app\aliyvo_ponto.py
          python tests\logic_ahgora_v97.py C:\temp\verify\_app
          if($LASTEXITCODE -ne 0){ throw 'ZIP final falhou' }
          $sha=(Get-FileHash C:\temp\out\ALIYVO_BETA_GRATIS_02297.zip -Algorithm SHA256).Hash.ToLower()
          @(
            'ALIYVO 0.22.97',
            'Corrige erro HTTP None da sincronizacao Ahgora',
            'Sincronizacao usa navegacao direta da API com a sessao oficial persistida',
            'Nao usa fetch CORS dentro da pagina',
            'Updater/WhatsApp preservados',
            "SHA256=$sha"
          ) | Set-Content C:\temp\out\VALIDACAO_02297.txt -Encoding UTF8
      - name: Publicar latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if(gh release view v0.22.97 --repo "$env:GITHUB_REPOSITORY" *> $null){ throw 'release ja existe' }
          gh release create v0.22.97 C:\temp\out\ALIYVO_BETA_GRATIS_02297.zip C:\temp\out\VALIDACAO_02297.txt --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "ALIYVO 0.22.97 - Correção Ahgora" --notes "Corrige o erro HTTP None visto após login válido no Ahgora. O ALIYVO mantém a sessão oficial do portal, mas passa a consultar o espelho navegando diretamente para a API com os mesmos cookies, evitando bloqueio de fetch/CORS. Atualização disponível pelo painel do ALIYVO." --latest