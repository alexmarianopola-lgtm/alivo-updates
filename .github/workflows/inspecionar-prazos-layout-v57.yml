name: Inspecionar Prazos layout v57

on:
  push:
    paths:
      - ".github/workflows/inspecionar-prazos-layout-v57.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspecionar abertura do Prazos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/base /tmp/app && mkdir -p /tmp/base /tmp/app
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_*.zip" --dir /tmp/base
          unzip -q "$(find /tmp/base -name '*.zip' | head -n1)" -d /tmp/app
          echo '=== OPEN QUICK TOOL ==='
          n=$(grep -n 'def _open_quick_tool' /tmp/app/_app/main.py | head -n1 | cut -d: -f1 || true)
          [ -n "$n" ] && sed -n "$((n-60)),$((n+220))p" /tmp/app/_app/main.py
          echo '=== TOGGLE PRAZO ==='
          n=$(grep -n 'def toggle_prazo_panel' /tmp/app/_app/main.py | head -n1 | cut -d: -f1 || true)
          [ -n "$n" ] && sed -n "$((n-80)),$((n+160))p" /tmp/app/_app/main.py
          echo '=== PRAZO GEOMETRY/PARENT ==='
          grep -nE 'prazo_panel|PrazoPanel\(|setGeometry\(|move\(|resize\(|setParent\(' /tmp/app/_app/main.py | head -n 500
