name: Publicar ALIYVO 0.22.94 CRM Interativo
on:
  push:
    paths: ['trigger-v94-release.txt']
permissions:
  contents: write
jobs:
  testar-e-publicar:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Baixar base oficial 0.22.93
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\base,C:\temp\build,C:\temp\verify,C:\temp\out | Out-Null
          gh release download v0.22.93 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02293.zip" --dir C:\temp\base
          Expand-Archive C:\temp\base\ALIYVO_BETA_GRATIS_02293.zip -DestinationPath C:\temp\build -Force
          if(-not (Test-Path C:\temp\build\_app\main.py)){ throw 'Base 0.22.93 invalida' }
          (Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash | Set-Content C:\temp\updater_before.txt

      - name: Aplicar CRM Interativo
        shell: pwsh
        run: |
          python patch_crm_interativo_v94.py C:\temp\build
          python -m py_compile C:\temp\build\_app\main.py C:\temp\build\_app\updater_worker.pyw
          python tests\logic_crm_interativo_v94.py C:\temp\build\_app | Tee-Object C:\temp\out\logic-v94.txt
          if($LASTEXITCODE -ne 0){ throw 'Gate CRM Interativo falhou' }
          Select-String -Path C:\temp\out\logic-v94.txt -Pattern 'ALIYVO_V94_CRM_INTERATIVO=OK' | Out-Null
          $before=(Get-Content C:\temp\updater_before.txt).Trim()
          $after=(Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater foi alterado' }

      - name: Empacotar e validar ZIP final
        shell: pwsh
        run: |
          Compress-Archive -Path C:\temp\build\* -DestinationPath C:\temp\out\ALIYVO_BETA_GRATIS_02294.zip -Force
          Expand-Archive C:\temp\out\ALIYVO_BETA_GRATIS_02294.zip -DestinationPath C:\temp\verify -Force
          python -m py_compile C:\temp\verify\_app\main.py C:\temp\verify\_app\updater_worker.pyw
          python tests\logic_crm_interativo_v94.py C:\temp\verify\_app | Tee-Object C:\temp\out\logic-final-v94.txt
          if($LASTEXITCODE -ne 0){ throw 'ZIP final falhou no CRM Interativo' }
          $before=(Get-Content C:\temp\updater_before.txt).Trim()
          $after=(Get-FileHash C:\temp\verify\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater no ZIP final foi alterado' }
          $sha=(Get-FileHash C:\temp\out\ALIYVO_BETA_GRATIS_02294.zip -Algorithm SHA256).Hash.ToLower()
          @(
            "ALIYVO 0.22.94",
            "CRM cards clicaveis: OK",
            "Selecao e duplo clique nos lembretes: OK",
            "Abrir conversa: OK",
            "Pendencias IA interativas: OK",
            "Altura dinamica dos cards: OK",
            "WhatsApp Turbo preservado: OK",
            "Updater preservado: OK",
            "ZIP_SHA256=$sha"
          ) | Set-Content C:\temp\out\VALIDACAO_02294.txt -Encoding UTF8

      - name: Publicar
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.22.94 C:\temp\out\ALIYVO_BETA_GRATIS_02294.zip C:\temp\out\VALIDACAO_02294.txt --repo "$env:GITHUB_REPOSITORY" --title "ALIYVO 0.22.94 - CRM Interativo" --notes "Corrige a tela CRM da 0.22.93: cards do topo agora sao botoes de verdade; cards de lembrete deixam o clique chegar ao item; duplo clique edita; adiciona Abrir conversa; corrige altura dos cards com status CRM; e o painel Pendencias da IA passa a permitir abrir WhatsApp, criar lembrete e marcar como resolvido. Mantem o Observador e o WhatsApp Turbo sem novo scanner DOM." --latest
