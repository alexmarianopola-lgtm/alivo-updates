name: Publicar ALIYVO 0.22.87 chamadas WhatsApp
on:
  push:
    paths: ['trigger-v87.txt']
permissions:
  contents: write
jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar base 0.22.86
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\base,C:\temp\build | Out-Null
          gh release download v0.22.86 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02286.zip" --dir C:\temp\base
          Expand-Archive C:\temp\base\ALIYVO_BETA_GRATIS_02286.zip -DestinationPath C:\temp\build -Force
          (Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash | Set-Content C:\temp\worker_before.txt
      - name: Corrigir permissoes de chamadas WhatsApp
        shell: pwsh
        run: |
          python patch_whatsapp_permissions_v87.py C:\temp\build
          python -m py_compile C:\temp\build\_app\main.py C:\temp\build\_app\updater_worker.pyw
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.87"' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'def _reset_whatsapp_media_permissions' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern 'args.SavesInProfile=False' | Out-Null
          Select-String -Path C:\temp\build\_app\main.py -Pattern '"whatsapp.net" not in uri' | Out-Null
          $before=(Get-Content C:\temp\worker_before.txt).Trim()
          $after=(Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater foi alterado' }
      - name: Empacotar e validar ZIP final
        shell: pwsh
        run: |
          Compress-Archive -Path C:\temp\build\* -DestinationPath C:\temp\ALIYVO_BETA_GRATIS_02287.zip -Force
          Expand-Archive C:\temp\ALIYVO_BETA_GRATIS_02287.zip -DestinationPath C:\temp\verify -Force
          python -m py_compile C:\temp\verify\_app\main.py C:\temp\verify\_app\updater_worker.pyw
          Select-String -Path C:\temp\verify\_app\main.py -Pattern 'ALIYVO_VERSION = "0.22.87"' | Out-Null
          Select-String -Path C:\temp\verify\_app\main.py -Pattern 'def _reset_whatsapp_media_permissions' | Out-Null
          Select-String -Path C:\temp\verify\_app\main.py -Pattern 'args.SavesInProfile=False' | Out-Null
          if(Select-String -Path C:\temp\verify\_app\main.py -Pattern 'class ChatGPTWebView\(QtWebView2Widget\)' -Quiet){ throw 'Assistente voltou indevidamente ao WebView2' }
          $before=(Get-Content C:\temp\worker_before.txt).Trim()
          $after=(Get-FileHash C:\temp\verify\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater do ZIP final foi alterado' }
      - name: Publicar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.22.87 C:\temp\ALIYVO_BETA_GRATIS_02287.zip --repo "$env:GITHUB_REPOSITORY" --title "ALIYVO 0.22.87 - correção de chamadas WhatsApp" --notes "Correcao focada nos icones de chamada de voz e video do WhatsApp. A versao redefine somente permissoes salvas de microfone/camera associadas ao WhatsApp no perfil WebView2, preservando login, cookies e conversas. Novos pedidos de permissao deixam de ficar gravados permanentemente no perfil. Tambem aceita origens auxiliares whatsapp.net. Assistente e atualizador nao foram alterados. Build/ZIP validados; a confirmacao final das chamadas depende do teste real no PC." --latest
