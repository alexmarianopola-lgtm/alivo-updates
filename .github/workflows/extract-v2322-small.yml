name: Extract v2322 small
on:
  push:
    paths:
      - 'trigger-extract-v2322-small.txt'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\small | Out-Null
          gh release download v0.23.22 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02322.zip" --dir C:\temp\small
          Expand-Archive C:\temp\small\ALIYVO_BETA_GRATIS_02322.zip C:\temp\small\app -Force
          python extract_v2322_small.py C:\temp\small\app\_app\main.py
          git config user.name aliyvo-inspector
          git config user.email actions@users.noreply.github.com
          git add inspect_v2322_calls.txt inspect_v2322_crm_methods.txt inspect_v2322_maininit.txt
          git commit -m "inspect: v2322 small call crm"
          git push
