name: Fast publish ALIYVO 0.22.96
on:
  push:
    branches: ['feature/ahgora-browser-session-02296']
    paths: ['trigger-v96-fast.txt']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar base 0.22.95
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/base /tmp/build /tmp/verify /tmp/out
          gh release download v0.22.95 --repo "$GITHUB_REPOSITORY" --pattern 'ALIYVO_BETA_GRATIS_02295.zip' --dir /tmp/base
          unzip -q /tmp/base/ALIYVO_BETA_GRATIS_02295.zip -d /tmp/build
          cp /tmp/build/_app/main.py /tmp/main-before.py
          sha256sum /tmp/build/_app/updater_worker.pyw | awk '{print $1}' > /tmp/updater-before.sha
      - name: Aplicar 0.22.96 e validar delta
        run: |
          python patch_ahgora_v96.py /tmp/build
          python -m py_compile /tmp/build/_app/main.py /tmp/build/_app/aliyvo_ponto.py /tmp/build/_app/updater_worker.pyw
          python tests/package_ahgora_v96.py /tmp/build
          python - <<'PY'
          from pathlib import Path
          before=Path('/tmp/main-before.py').read_text(encoding='utf-8')
          after=Path('/tmp/build/_app/main.py').read_text(encoding='utf-8')
          assert 'ALIYVO_VERSION = "0.22.95"' in before
          assert 'ALIYVO_VERSION = "0.22.96"' in after
          restored=after.replace('ALIYVO_VERSION = "0.22.96"','ALIYVO_VERSION = "0.22.95"',1)
          assert restored==before, 'main.py mudou alem da versao'
          PY
          test "$(cat /tmp/updater-before.sha)" = "$(sha256sum /tmp/build/_app/updater_worker.pyw | awk '{print $1}')"
      - name: Testar modulo Ahgora
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
        run: |
          pip install -q PyQt6 PyQt6-WebEngine cryptography
          python tests/logic_ahgora_v96.py /tmp/build/_app
      - name: Guardas de integridade
        run: |
          grep -F 'class WhatsAppView(QtWebView2Widget)' /tmp/build/_app/main.py >/dev/null
          grep -F 'self.web=QWebEngineView(self)' /tmp/build/_app/main.py >/dev/null
          grep -F 'self._diagnostic_timer=QTimer(self); self._diagnostic_timer.setInterval(20000)' /tmp/build/_app/main.py >/dev/null
          grep -F 'VINCULAR / REABRIR AHGORA' /tmp/build/_app/aliyvo_ponto.py >/dev/null
          grep -F 'ForcePersistentCookies' /tmp/build/_app/aliyvo_ponto.py >/dev/null
          grep -F 'https://www.ahgora.com.br/externo/index/' /tmp/build/_app/aliyvo_ponto.py >/dev/null
          grep -F 'https://app.ahgora.com.br/api-espelho/apuracao/' /tmp/build/_app/aliyvo_ponto.py >/dev/null
      - name: Empacotar
        run: |
          cd /tmp/build && zip -qr /tmp/out/ALIYVO_BETA_GRATIS_02296.zip .
          unzip -q /tmp/out/ALIYVO_BETA_GRATIS_02296.zip -d /tmp/verify
          python $GITHUB_WORKSPACE/tests/package_ahgora_v96.py /tmp/verify
          python -m py_compile /tmp/verify/_app/main.py /tmp/verify/_app/aliyvo_ponto.py
          sha=$(sha256sum /tmp/out/ALIYVO_BETA_GRATIS_02296.zip | awk '{print $1}')
          printf '%s\n' 'ALIYVO 0.22.96' 'Sessao oficial Ahgora via QtWebEngine' 'Perfil persistente em LOCALAPPDATA/ALIYVO/ahgora_browser_profile' 'main.py alterado apenas na versao' 'updater preservado' "SHA256=$sha" > /tmp/out/VALIDACAO_02296.txt
      - name: Publicar latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.22.96 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 1; fi
          gh release create v0.22.96 /tmp/out/ALIYVO_BETA_GRATIS_02296.zip /tmp/out/VALIDACAO_02296.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'ALIYVO 0.22.96 - Vínculo oficial Ahgora' --notes 'O Controle de Ponto agora vincula uma sessão real do portal oficial Ahgora dentro do ALIYVO, em vez de reproduzir o login por requisição. Faça o login uma vez em Ponto > Vincular / Reabrir Ahgora; a sessão fica persistente no computador e passa a alimentar a sincronização do espelho. WhatsApp, configurações e updater são preservados.' --latest