name: Inspecionar classe Prazos v58

on:
  push:
    paths:
      - ".github/workflows/inspecionar-prazo-class-v58.yml"

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspecionar PrazoPanel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/base /tmp/app && mkdir -p /tmp/base /tmp/app
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_*.zip" --dir /tmp/base
          unzip -q "$(find /tmp/base -name '*.zip' | head -n1)" -d /tmp/app
          sed -n '1130,1325p' /tmp/app/_app/main.py
          echo '=== PRAZO SIGNALS ALL ==='
          grep -nE 'prazo_toggle\.clicked|quick_prazo\.clicked|toggle_prazo_panel|position_prazo_overlay|toggle_prazo_expand' /tmp/app/_app/main.py
