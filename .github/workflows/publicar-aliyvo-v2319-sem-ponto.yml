name: Publicar ALIYVO 0.23.19 Sem Ponto
on:
  push:
    paths:
      - 'trigger-v2319-release.txt'
permissions:
  contents: write
jobs:
  testar-e-publicar:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar base 0.23.18
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp\base,C:\temp\build,C:\temp\verify,C:\temp\out | Out-Null
          gh release download v0.23.18 --repo "$env:GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_02318.zip" --dir C:\temp\base
          Expand-Archive C:\temp\base\ALIYVO_BETA_GRATIS_02318.zip -DestinationPath C:\temp\build -Force
          if(-not (Test-Path C:\temp\build\_app\main.py)){ throw 'Base 0.23.18 invalida' }
          (Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash | Set-Content C:\temp\updater_before.txt
      - name: Retirar temporariamente o ponto
        shell: pwsh
        run: |
          python patch_remove_ponto_v2319.py C:\temp\build
          python -m py_compile C:\temp\build\_app\main.py C:\temp\build\_app\updater_worker.pyw
          python tests\logic_remove_ponto_v2319.py C:\temp\build\_app
          $before=(Get-Content C:\temp\updater_before.txt).Trim()
          $after=(Get-FileHash C:\temp\build\_app\updater_worker.pyw -Algorithm SHA256).Hash
          if($before -ne $after){ throw 'Updater foi alterado' }
      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet PyQt6 PyQt6-WebEngine pyspellchecker qtwebview2==0.5.0 qtpy pythonnet
      - name: Teste de abertura
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          $env:QTWEBENGINE_DISABLE_SANDBOX='1'
          $proc=Start-Process -FilePath python -ArgumentList 'C:\temp\build\_app\Aliyvo.pyw' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 8
          if($proc.HasExited -and $proc.ExitCode -ne 0){ throw "ALIYVO encerrou na inicializacao com codigo $($proc.ExitCode)" }
          if(-not $proc.HasExited){ Stop-Process -Id $proc.Id -Force }
          Write-Host 'STARTUP_SMOKE_TEST=OK'
      - name: Empacotar e validar
        shell: pwsh
        run: |
          Compress-Archive -Path C:\temp\build\* -DestinationPath C:\temp\out\ALIYVO_BETA_GRATIS_02319.zip -Force
          Expand-Archive C:\temp\out\ALIYVO_BETA_GRATIS_02319.zip -DestinationPath C:\temp\verify -Force
          python -m py_compile C:\temp\verify\_app\main.py
          python tests\logic_remove_ponto_v2319.py C:\temp\verify\_app
          $main=Get-Content C:\temp\verify\_app\main.py -Raw
          if($main -notmatch 'ALIYVO_VERSION = "0.23.19"'){ throw 'Versao interna incorreta' }
      - name: Publicar oficial
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.23.19 C:\temp\out\ALIYVO_BETA_GRATIS_02319.zip --repo "$env:GITHUB_REPOSITORY" --title "ALIYVO 0.23.19 - Ponto Temporariamente Retirado" --notes "Hotfix operacional: o Controle de Ponto/Ahgora foi temporariamente retirado do ALIYVO para nao interromper o trabalho enquanto a sincronizacao e revisada. O botao fica oculto, o controller nao e iniciado e nenhum aviso automatico de ponto deve abrir. Demais funcoes do ALIYVO permanecem." --latest
