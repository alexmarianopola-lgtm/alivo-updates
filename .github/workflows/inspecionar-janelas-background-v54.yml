name: Inspecionar janelas background v54

on:
  push:
    paths:
      - ".github/workflows/inspecionar-janelas-background-v54.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspecionar ciclo de janelas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/base /tmp/app && mkdir -p /tmp/base /tmp/app
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "ALIYVO_BETA_GRATIS_*.zip" --dir /tmp/base
          unzip -q "$(find /tmp/base -name '*.zip' | head -n1)" -d /tmp/app
          echo '=== CLASSES/JANELAS ==='
          grep -nE '^class .*Window|PlateCatalog|CatalogWindow|catalog_window|catalogo|hide_background|QApplication\(|app\.exec|quitOnLastWindowClosed|setQuitOnLastWindowClosed|def closeEvent' /tmp/app/_app/main.py | head -n 500
          echo '=== CONTEXTOS CATALOGO ==='
          for n in $(grep -nE 'self\..*catalog.*=.*Window|PlateCatalogWindow\(' /tmp/app/_app/main.py | cut -d: -f1 | head -n 30); do sed -n "$((n-35)),$((n+90))p" /tmp/app/_app/main.py; done
          echo '=== FIM MAIN ==='
          tail -n 220 /tmp/app/_app/main.py
